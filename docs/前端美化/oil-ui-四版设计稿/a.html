</style></head><body class="a"><div id="root"></div><script>const STYLE={"id": "a", "name": "蓝序出版", "concept": "把书籍装帧的力量留在书架，把安静留给正文。", "typography": "京華老宋體：书封与标题；微软雅黑：工具；正文18px / 1.95", "palette": ["#F7F7F2", "#173CC0", "#222A35"], "traits": ["六本横向陈列", "双色巨字书封", "窄轨导航与宽正文"]};const pages=[['shelf','书架','书'],['settings','设置','外'],['editor','正文','文'],['outline','大纲','纲'],['world','设定','设'],['characters','人物','人'],['inspiration','灵感','灵']];

function shelf(){let head=`<div class="pagehead"><h1>我的作品</h1><input class="search" aria-label="搜索作品" placeholder="搜索作品">${btn('＋ 新建作品','primary','data-new="作品"')}</div>`;let tabs=`<div class="tabs">${btn('全部作品','active','data-filter="all"')}${btn('最近编辑','','data-filter="recent"')}</div>`;let html='';

function outline(){const positions={a:[[28,45],[300,45],[300,270],[565,270],[565,485]],b:[[260,35],[40,210],[480,210],[135,425],[430,425]],c:[[25,95],[25,330],[245,150],[245,410],[470,255]],d:[[24,115],[197,195],[370,115],[543,195],[370,425]]}[STYLE.id];let links=STYLE.id==='b'?[[0,1],[0,2],[1,3],[2,4],[3,4]]:STYLE.id==='c'?[[0,1],[1,2],[2,3],[3,4]]:[[0,1],[1,2],[2,3],[3,4],[0,4]];let lines=links.map(([s,t],i)=>{let [x,y]=positions[s], [xx,yy]=positions[t];let w=STYLE.id==='d'?150:STYLE.id==='c'?165:178;return `<path d="M${x+w/2},${y+90} L${xx+w/2},${yy+30}" fill="none" stroke="currentColor" stroke-width="1.2" ${i===4?'stroke-dasharray="5 5"':''} marker-end="url(#arrow)"/><text x="${(x+xx)/2+w/2+8}" y="${(y+yy)/2+50}" fill="currentColor" font-size="13">${i===4?'伏笔':'因果'}</text>`}).join('');return `<section class="workspace board-work">${chapters()}<div class="board-wrap"><div class="board-tools"><h2>故事大纲</h2>${btn('＋ 事件','secondary','data-new="事件"')}${btn('便签','plain','data-new="便签"')}${btn('连线','plain','data-toast="选择两个事件以建立关联"')}</div><div class="board">${STYLE.id==='c'?['第一幕 · 异常','第二幕 · 寻路','第三幕 · 决定'].map((s,i)=>`<div class="lane" style="left:${i*33.333}%">${s}</div>`).join(''):''}<svg class="links" viewBox="0 0 780 720" preserveAspectRatio="none"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="currentColor"/></marker></defs>${lines}</svg>${scenes.map((s,i)=>`<button class="node ${i===selectedNode?'selected':''}" data-node="${i}" style="left:${positions[i][0]}px;top:${positions[i][1]}px;text-align:left"><small>事件 ${i+1} · 第${i+1}章</small><h3>${s}</h3><p>${summaries[i]}</p></button>`).join('')}${STYLE.id==='c'?'':`<div class="sticky">留一条未解释的线索：<br>谁敲响了第十二声钟？</div>`}<div class="zoom">${btn('−','plain','data-zoom="-1"')}<span id="zoomvalue">100%</span>${btn('＋','plain','data-zoom="1"')} ${btn('适配','plain','data-zoom="0"')}</div></div></div><aside class="inspector nodefield"><h3>事件属性</h3><label for="ntitle">标题</label><input id="ntitle" value="${scenes[selectedNode]}"><label for="type">类型</label><select id="type"><option>情节点</option><option>伏笔</option></select><label for="chapter">关联章节</label><select id="chapter"><option>第${selectedNode+1}章</option></select><label for="summary">概要</label><textarea id="summary" rows="5">${summaries[selectedNode]}</textarea><hr><small>关联人物</small><p>林远 · 沈砚</p><span class="tag">${selectedNode===0?'伏笔':'因果'}</span></aside></section>`}
function world(){return `<section class="world"><aside class="tree"><h3>设定目录</h3><input aria-label="搜索设定" placeholder="搜索设定" style="width:100%"><div class="volume">⌄ 世界观</div>${['星图系统','地理','组织','历史'].map((s,i)=>btn(s,'item '+(i===0?'active':''),`data-local-select`)).join('')}<hr><small>12 条设定</small></aside><div class="world-main"><div class="pagehead"><h1>星图系统</h1>${btn('＋ 新增条目','secondary','data-new="设定"')}</div><div class="world-tree"><div class="outline-row">⌄ <strong>星图系统</strong><span class="push">3 项</span></div><div class="outline-row level1 selected">⌄ 铜星 <span class="push">关联第一章</span></div><div class="world-note"><p>铜星是星图中最稳定的导航基准。它们的位置由观测局记录，所有航船据此校正航线。</p><p style="margin-top:16px">一枚铜星的熄灭，意味着一条航线从记录中消失。失去坐标的人，会先忘记归途。</p></div><div class="outline-row level2">› 观测记录<span class="push">2 项</span></div><div class="outline-row level2">› 熄灭规则<span class="push">1 项</span></div><div class="outline-row level1">› 领航员<span class="push">4 项</span></div><div class="outline-row level1">› 失落坐标<span class="push">2 项</span></div><hr><div class="outline-row">› 地理<span class="push">雾港 · 钟楼</span></div><div class="outline-row">› 组织<span class="push">观测局</span></div></div></div><aside class="inspector"><h3>条目关联</h3><small>相关人物</small><div class="row" style="margin:18px 0"><span class="avatar">林</span><div>林远<br><small>主角 · 观测者</small></div></div><hr><small>关联章节</small><p>第一章 · 初雪</p>${btn('前往正文 →','plain','data-page="editor"')}<hr><small>引用预览</small><p class="quote">“三百六十枚星灯悬在头顶，一枚接一枚地暗下去。”</p></aside></section>`}
function characters(){const names=['林远','沈砚','白鸽'],roles=['主角','领航员','神秘访客'];return `<section class="characters"><aside class="people-list"><h3>人物</h3><input placeholder="搜索人物" aria-label="搜索人物">${names.map((s,i)=>`<button class="person ${selectedPerson===i?'active':''}" data-person="${i}"><span class="avatar">${s[0]}</span><div>${s}<br><small>${roles[i]}</small></div></button>`).join('')}<div style="margin-top:24px">${btn('＋ 新建人物','secondary','data-new="人物"')}</div></aside><div class="person-main"><div class="person-heading"><div class="portrait">${names[selectedPerson][0]}</div><div><h1>${names[selectedPerson]}</h1><span class="tag">${roles[selectedPerson]}</span><p class="subline">${selectedPerson===0?'观测者 · 雾港居民':selectedPerson===1?'领航员 · 观测局':'访客 · 来历不明'}</p></div></div><h3>人物动机</h3><p class="bio">${['寻找父亲留下的航线，理解星图为何会改变。','把失去坐标的人带回雾港，守住一个旧约定。','在第十二声钟响之前，取回被遗忘的名字。'][selectedPerson]}</p><h3>人物小传</h3><p class="bio">林远在雾港长大，熟悉钟楼的每一道回声。父亲离开以后，他守着一本没有写完的观测笔记，直到第一枚铜星熄灭。</p><div class="person-facts"><div><small>年龄</small><p>24 岁</p></div><div><small>所属组织</small><p>观测局</p></div></div><h3>人物关系</h3><div class="relation"><span class="avatar">沈</span><div class="rel-line"><span>导师</span></div><span class="avatar" style="background:var(--accent);color:var(--paper)">林</span><div class="rel-line"><span>对立</span></div><span class="avatar">白</span></div><div class="relation-labels"><span>沈砚</span><span>林远</span><span>白鸽</span></div></div><aside class="inspector"><h3>资料关联</h3><small>相关设定</small><p>铜星</p><p>领航员</p><p>失落坐标</p><hr><small>出场章节</small><p>第一章 · 初雪</p><p>第二章 · 领航员</p><p>第三章 · 雾中的钟楼</p><hr>${btn('查看故事大纲 →','plain','data-page="outline"')}</aside></section>`}
function inspiration(){const idea=ideas[selectedIdea];return `<section class="inspiration"><aside class="tree"><h3>灵感</h3>${['全部灵感','未整理','已转化'].map((s,i)=>btn(s,'item '+(i===0?'active':''),'data-local-select')).join('')}<hr><h3>标签</h3>${['伏笔','世界观','人物','场景'].map(s=>btn(s,'item','data-local-select')).join('')}</aside><div class="idea-list"><div class="row between"><span>4 条灵感</span>${btn('＋','plain','data-new="灵感" aria-label="新建灵感"')}</div>${ideas.map((s,i)=>`<button class="idea-card ${i===selectedIdea?'active':''}" data-idea="${i}"><h3>${s[0]}</h3><p>${s[1]}</p><small>${s[2]}　${s[3]}</small></button>`).join('')}</div><article class="idea-main"><small>${idea[3]} · 未整理</small><h1>${idea[0]}</h1><div class="row"><span class="tag">${idea[2]}</span></div><div class="idea-text"><p>${idea[1]}</p><p>林远以为自己听错了。十一声之后，整座雾港都安静下来，唯有那一声，像从很远的地方抵达。</p><p>他忽然记起，父亲的笔记总是在同一页停住。</p></div><hr><label for="ideanote">补充备注</label><textarea id="ideanote" placeholder="记下下一步想展开的方向"></textarea><div class="row">${btn('转为章节','primary','data-convert="章节"')}${btn('转为设定','secondary','data-convert="设定"')}</div></article><aside class="assistant"><h3>恍然梦</h3><label for="scope">任务范围</label><select id="scope"><option>当前灵感</option><option>相关设定</option></select><label for="instruction">创作指令</label><textarea id="instruction" placeholder="将钟声扩展成一个场景，保留悬念。"></textarea>${btn('生成场景提案','primary','data-proposal')}<hr><small>结果以提案展示，由你决定是否采用。</small></aside></section>`}
function render(animate=false){const view={shelf,settings,editor,outline,world,characters,inspiration}[page];$('#root').innerHTML=shell(view());if(animate)$('.content').classList.add('enter');}
function navigate(to){page=to;selectedPerson=0;history.replaceState(null,'','?state='+page);render(true)}
function toast(t){document.querySelector('.toast')?.remove();let d=document.createElement('div');d.className='toast';d.setAttribute('role','status');d.textContent=t;document.body.append(d);setTimeout(()=>d.remove(),2200)}
function modal(title,placeholder='名称'){let d=document.createElement('div');d.className='modal-backdrop';d.innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-label="${title}"><h2>${title}</h2><label for="new-name">${placeholder}</label><input id="new-name" autofocus><div class="row">${btn('确定','primary','data-modal-submit')}${btn('取消','secondary','data-modal-close')}</div></div>`;document.body.append(d);$('#new-name').focus()}
document.addEventListener('click',e=>{const t=e.target.closest('button,[data-book]');if(!t)return;if(t.dataset.page)navigate(t.dataset.page);else if(t.dataset.book!==undefined){selectedBook=+t.dataset.book;render()}else if(t.dataset.idea!==undefined){selectedIdea=+t.dataset.idea;render()}else if(t.dataset.node!==undefined){selectedNode=+t.dataset.node;render()}else if(t.dataset.person!==undefined){selectedPerson=+t.dataset.person;render()}else if(t.hasAttribute('data-collapse')){showNotes=!showNotes;render()}else if(t.dataset.new)modal('新建'+t.dataset.new);else if(t.hasAttribute('data-modal-close'))$('.modal-backdrop').remove();else if(t.hasAttribute('data-modal-submit')){let name=$('#new-name').value.trim();if(!name){$('#new-name').focus();return}$('.modal-backdrop').remove();toast('已收录：'+name)}else if(t.hasAttribute('data-switch')){t.classList.toggle('on');t.setAttribute('aria-checked',t.classList.contains('on'));if(t.getAttribute('aria-label')==='减少动态效果'){document.documentElement.style.setProperty('scroll-behavior','auto');document.body.classList.toggle('reduced',t.classList.contains('on'))}}else if(t.dataset.theme!==undefined){document.querySelectorAll('.theme').forEach(x=>x.classList.remove('active'));t.classList.add('active');const p=$('.settings-preview');p.style.background=['#faf7ec','#f4ead2','#132d2b'][+t.dataset.theme];p.style.color=+t.dataset.theme===2?'#e4e9da':'#302d27'}else if(t.hasAttribute('data-local-select')){t.parentElement.querySelectorAll('.active').forEach(x=>x.classList.remove('active'));t.classList.add('active')}else if(t.dataset.setting!==undefined&&+t.dataset.setting!==0){modal(['外观','模型设置','数据','关于'][+t.dataset.setting],'检索设置项')}else if(t.dataset.convert){modal('转为'+t.dataset.convert,'目标'+t.dataset.convert+'名称')}else if(t.dataset.toast)toast(t.dataset.toast);else if(t.hasAttribute('data-search-global'))modal('全局搜索','搜索作品、章节、人物或设定');else if(t.dataset.filter){t.parentElement.querySelectorAll('.active').forEach(x=>x.classList.remove('active'));t.classList.add('active');if(t.dataset.filter==='recent')toast('已按最近编辑排序')}else if(t.dataset.zoom!==undefined){let z=$('#zoomvalue');z.textContent=t.dataset.zoom==='0'?'100%':Math.max(50,Math.min(150,parseInt(z.textContent)+(+t.dataset.zoom*10)))+'%'}else if(t.hasAttribute('data-proposal')){const v=$('#instruction').value.trim();if(!v){$('#instruction').focus();return}modal('场景提案','提案名称')}else if(t.dataset.chapter!==undefined){t.parentElement.querySelectorAll('.active').forEach(x=>x.classList.remove('active'));t.classList.add('active');$('.manuscript h1').textContent=t.textContent;toast('已切换章节预览')}});
document.addEventListener('input',e=>{if(e.target.id==='size'){$('#sizevalue').textContent=e.target.value;$('.preview-body').style.fontSize=e.target.value+'px'}if(e.target.id==='leading'){$('#leadingvalue').textContent=e.target.value/10;$('.preview-body').style.lineHeight=e.target.value/10}if(e.target.getAttribute('aria-label')==='搜索作品'){const q=e.target.value.trim();document.querySelectorAll('.book').forEach(t=>t.hidden=!t.getAttribute('aria-label').includes(q));document.querySelectorAll('.catalog tbody tr').forEach(t=>t.hidden=!t.textContent.includes(q))}if(e.target.getAttribute('aria-label')==='搜索人物'){const q=e.target.value.trim();document.querySelectorAll('.person').forEach(t=>t.hidden=!t.textContent.includes(q))}});
document.addEventListener('change',e=>{if(e.target.id==='font')$('.preview-body').style.fontFamily=e.target.value});
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelector('.modal-backdrop')?.remove()});
const originalCover=cover;
const coverTitles=['星尘<br>旅人','长夜<br>将尽','雪落<br>界脊<br>之上','山海<br>拾遗录','第七位<br>访客','青鸾<br>纪事'];
cover=function(i=0){let html=originalCover(i);if(['a','d'].includes(STYLE.id))html=html.replace(`<div class="title">${books[i].title}</div>`,`<div class="title">${coverTitles[i]}</div>`);if(STYLE.id==='a'&&i%3===1)html=html.replace(/<svg[\s\S]*?<\/svg>/,`<svg viewBox="0 0 240 240" aria-hidden="true"><path d="M20 240L190 60L240 100L100 240Z" fill="currentColor"/><path d="M-20 235L180 25" stroke="currentColor" stroke-width="2"/></svg>`);if(STYLE.id==='a'&&i%3===2)html=html.replace(/<svg[\s\S]*?<\/svg>/,`<svg viewBox="0 0 240 240" aria-hidden="true">${Array.from({length:10},(_,n)=>`<path d="M-20 ${120+n*10} Q90 ${40+n*10} 260 ${150+n*10}" fill="none" stroke="currentColor" stroke-width="2"/>`).join('')}</svg>`);return html;};
render(true);
</script></body></html>
