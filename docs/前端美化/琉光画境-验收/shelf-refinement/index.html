<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>琉光画境 · 书架比例与叠册关系对照</title>
<style>
  *{box-sizing:border-box}body{margin:0;background:#e7f0f2;color:#234752;font:14px/1.65 "Microsoft YaHei",sans-serif}
  header{padding:28px 32px 18px;border-bottom:1px solid #b8d0d4;background:#f6fbfbdc;position:sticky;top:0;z-index:2;backdrop-filter:blur(18px)}
  h1{font:500 28px/1.3 "LXGW WenKai",serif;margin:0 0 8px}p{margin:0;max-width:980px;color:#55707a}
  nav{display:flex;gap:8px;margin-top:14px}button{border:1px solid #9dbfc5;border-radius:7px;background:white;color:#234752;padding:5px 13px;cursor:pointer}button.on{background:#146878;color:white}
  main{padding:26px 24px 50px}.triptych{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;align-items:start}
  figure{margin:0;min-width:0;background:white;border:1px solid #c7dadd;border-radius:10px;overflow:hidden;box-shadow:0 12px 30px #4d7c8712}
  figcaption{padding:10px 13px;border-bottom:1px solid #d3e2e4;font-weight:600}.frame{overflow:auto;max-height:76vh;background:#f9fcfc}
  img{display:block;width:100%;height:auto}.native .frame img{width:auto;max-width:none}.double .frame img{width:200%;max-width:none}
  section{margin-top:28px}h2{font:500 22px "LXGW WenKai",serif}.boundary{max-width:1080px}.boundary img{width:100%;border:1px solid #c7dadd;border-radius:10px}
  @media(max-width:1050px){.triptych{grid-template-columns:1fr}.frame{max-height:none}}
</style>
<header>
  <h1>琉光画境 · 书架比例与叠册关系优化</h1>
  <p>图 2 为本轮唯一视觉基准。修改后采用 410px 双栏舞台、左栏紧凑信息组、228／190／158px 前中后叠册，以及归入主书簇并压住书封边界的真实首章白卡。</p>
  <nav><button class="on" data-zoom="fit">适应宽度</button><button data-zoom="native">100%</button><button data-zoom="double">200%</button></nav>
</header>
<main>
  <div class="triptych">
    <figure><figcaption>修改前 · 软件现有排布</figcaption><div class="frame"><img src="before.png" alt="修改前书架"></div></figure>
    <figure><figcaption>视觉基准 · 设计稿</figcaption><div class="frame"><img src="reference.png" alt="书架设计稿"></div></figure>
    <figure><figcaption>修改后 · 真实 Electron 1440×900</figcaption><div class="frame"><img src="after-1440.png" alt="修改后书架"></div></figure>
  </div>
  <section class="boundary"><h2>1080×680 边界窗口</h2><img src="after-1080.png" alt="1080 像素宽书架"></section>
</main>
<script>
  document.querySelectorAll('[data-zoom]').forEach(button=>button.addEventListener('click',()=>{
    document.body.className=button.dataset.zoom
    document.querySelectorAll('[data-zoom]').forEach(item=>item.classList.toggle('on',item===button))
  }))
</script>
</html>
