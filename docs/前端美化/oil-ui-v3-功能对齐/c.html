function nodeCard(i,x,y){return `<button class="story-node ${selectedNode===i?'selected':''}" style="left:${x}px;top:${y}px" data-node="${i}"><small>0${i+1}<span>第${i+1}章</span></small><h3>${scenes[i]}</h3><p>${summaries[i]}</p><span class="node-foot">${i===0?'伏笔':'情节点'} <span>↗</span></span></button>`}
function outline(){const layouts={a:[[65,110],[350,45],[650,110],[350,300],[650,355]],b:[[34,130],[295,130],[555,130],[295,410],[555,410]],c:[[60,60],[340,190],[630,60],[60,390],[630,390]],d:[[35,95],[300,95],[565,95],[300,385],[565,385]]};let pos=layouts[STYLE.id];const con=[[0,1],[1,2],[2,3],[3,4],[0,4]];const paths=con.map(([s,t],k)=>{let [x,y]=pos[s],[xx,yy]=pos[t];let w=208,h=164, route,tx,ty;if(STYLE.id==='c'&&k===2){route='M838 140H885V375H20V470H60';tx=180;ty=365}else if(STYLE.id==='c'&&k===4){route='M164 60V20H910V610H674V554';tx=760;ty=600}else if(k===4){let ry=Math.max(y+h+35,yy+h+35);route=`M${x+42} ${y+h}V${ry}H${xx+44}V${yy+h}`;tx=(x+xx)/2+44;ty=ry-10}else if(xx>x+w){let gap=(x+w+xx)/2;route=`M${x+w} ${y+80}H${gap}V${yy+80}H${xx}`;tx=gap;ty=Math.min(y,yy)+63}else{let gap=y+h+38;route=`M${x+w/2} ${y+h}V${gap}H${xx+w/2}V${yy}`;tx=(x+xx)/2+w/2;ty=gap-10}return `<path d="${route}" class="${k===4?'foreshadow':''}"/><g><rect x="${tx-23}" y="${ty-14}" width="46" height="22" rx="10"/><text x="${tx}" y="${ty+1}">${k===4?'伏笔':'因果'}</text></g>`}).join('');return `<section class="outline-space"><div class="canvas-heading"><div><small>星尘旅人 / 第一卷</small><h1>${STYLE.id==='b'?'故事剪辑台':STYLE.id==='d'?'叙事分镜':'故事大纲'}</h1></div><div>${B('＋ 新建事件','primary','data-new="事件"')}${B('便签','secondary','data-note')}</div></div><div class="outline-layout"><div class="story-canvas ${STYLE.id==='b'||STYLE.id==='d'?'with-lanes':''}">${STYLE.id==='b'||STYLE.id==='d'?`<div class="act-labels"><span>第一幕 / 异常</span><span>第二幕 / 寻路</span><span>第三幕 / 决定</span></div>`:''}<div class="canvas-inner"><svg class="story-links" viewBox="0 0 940 690" aria-label="事件因果与伏笔连线">${paths}</svg>${scenes.map((_,i)=>nodeCard(i,...pos[i])).join('')}</div><div class="canvas-controls">${B('−','icon-button','data-zoom="-1"')}<span id="zoomvalue">100%</span>${B('＋','icon-button','data-zoom="1"')}${B('适配画布','text-button','data-zoom="0"')}</div></div><aside class="event-properties"><small>事件属性</small><h2>${scenes[selectedNode]}</h2><label for="event-title">标题</label><input id="event-title" value="${scenes[selectedNode]}"><label for="event-type">类型</label><select id="event-type"><option>情节点</option><option>伏笔</option></select><label for="event-summary">概要</label><textarea id="event-summary">${summaries[selectedNode]}</textarea><div class="property-bottom"><small>关联人物</small><div class="person-chips">${portrait(0)}林远${portrait(1)}沈砚</div><hr><small>关联章节</small><p>第${selectedNode+1}章</p>${B('前往正文 ↗','text-button','data-page="editor"')}</div></aside></div></section>`}
function world(){return `<section class="world-space"><aside class="world-index"><div class="pane-title"><h2>设定集</h2>${B('＋','icon-button','data-new="设定"')}</div><input aria-label="搜索设定" placeholder="查找设定">${['世界观','地理','组织','历史'].map((s,i)=>B(`<span>0${i+1}</span>${s}`,'world-category '+(i===0?'active':''),'data-local-select')).join('')}<div class="world-index-art"><img src="assets/${STYLE.id}.png" alt=""><span>星图系统<br><small>3 个核心条目</small></span></div></aside><div class="world-content"><div class="world-banner"><span class="overline">世界观 / 星图系统</span><h1>星图系统<br><span class="world-subtitle">观测、航线与失落坐标</span></h1><div class="world-symbol" aria-hidden="true"><i></i><b></b><em></em></div></div><div class="world-entry-head"><h2>铜星</h2><span class="tag">导航基准</span>${B('编辑条目 ↗','text-button','data-edit-world')}</div><div class="world-prose" contenteditable="true" aria-label="设定正文"><p>铜星是星图中最稳定的导航基准。它们的位置由观测局记录，所有航船据此校正航线。</p><p>一枚铜星的熄灭，意味着一条航线从记录中消失。失去坐标的人，会先忘记归途。</p></div><div class="world-branches">${['观测记录','熄灭规则','失落坐标'].map((s,i)=>B(`<span>0${i+1}</span><h3>${s}</h3><small>${[2,1,2][i]} 个条目</small><b>↗</b>`,'world-branch','data-new="子设定"')).join('')}</div></div><aside class="world-relations"><h2>故事中的回声</h2><small>关联人物</small><div class="linked-person">${portrait(0)}<div><h3>林远</h3><span>主角 · 观测者</span></div></div><hr><small>关联章节</small><h3>第一章 · 初雪</h3><p>“三百六十枚星灯悬在头顶，一枚接一枚地暗下去。”</p>${B('查看上下文 '+I('arrow'),'primary full','data-page="editor"')}<div class="world-related"><small>相关设定</small><h3>领航员　↗</h3><h3>失落坐标　↗</h3></div></aside></section>`}

function characters(){let p=people[selectedPerson],id=STYLE.id;let top=`<div class="characters-top"><h1>人物谱</h1><span>3 位人物 / 星尘旅人</span>${B('搜索人物 '+I('search'),'quiet','data-search')}</div>`;let bio=`<h3>人物动机</h3><p class="person-motive">${p.motive}</p><h3>人物小传</h3><p class="person-bio">${p.bio}</p>`;let identity=`<span class="tag">${p.role}</span><h1>${p.name}</h1><p>${p.identity}</p>`;
if(id==='a')return `<section class="characters-space a-people">${top}${personSelector()}<div class="character-orbit"><div class="character-hero">${portrait(selectedPerson,true)}<div>${identity}</div></div><div class="orbit-bio">${bio}${facts(p)}</div><div class="orbit-relations"><h2>关系星图</h2>${relationGraph()}</div></div></section>`;

if(id==='c')return `<section class="characters-space c-people">${top}${personSelector()}<div class="glass-relations"><div class="relation-canvas"><h2>人物关系</h2>${relationGraph()}<span class="canvas-caption">选择人物，查看相应档案。</span></div><aside class="glass-person-sheet"><div class="glass-person-heading">${portrait(selectedPerson)}<div>${identity}</div></div>${bio}${facts(p)}</aside></div></section>`;
return `<section class="characters-space d-people">${top}${personSelector()}<div class="interview"><div class="interview-portrait">${portrait(selectedPerson,true)}<span>人物 / 0${selectedPerson+1}</span><div>${identity}</div></div><div class="interview-body"><div class="person-quote">“${p.motive}”</div><span class="section-label">人物小传</span><p class="person-bio">${p.bio}</p>${facts(p)}<div class="cast-relationship"><small>人物关系</small><h3>沈砚 <span>— 导师 →</span> 林远 <span>← 对立 —</span> 白鸽</h3></div></div></div></section>`}
function ideaDetail(){let q=ideas[selectedIdea];return `<div class="idea-detail"><small>${q[3]} / 未整理</small><h1>${q[0]}</h1><span class="tag">${q[2]}</span><div class="idea-prose"><p>${q[1]}</p><p>${['林远以为自己听错了。十一声之后，整座雾港都安静下来，唯有那一声，像从很远的地方抵达。','信封里有一粒盐，也有一句熟悉的告诫。邮戳却落在一百年前。','有一条航线从纸面消失，另一条在他的指尖下慢慢亮起。','“等你想起我的名字，再来钟楼找我。”她这样说过。'][selectedIdea]}</p></div><label for="idea-note">下一步想法</label><textarea id="idea-note" placeholder="记下想展开的方向"></textarea><div class="idea-actions">${B('转为章节 ↗','primary','data-new="章节"')}${B('转为设定','secondary','data-new="设定"')}</div></div>`}

document.addEventListener('input',e=>{if(e.target.hasAttribute('data-graph-edge-label'))document.querySelector('.af-char-net svg text').textContent=e.target.value;if(e.target.hasAttribute('data-graph-edge-color'))document.querySelector('[data-edit-edge]').style.stroke=e.target.value});
document.addEventListener('change',e=>{if(e.target.hasAttribute('data-graph-edge-style'))document.querySelector('[data-edit-edge]').style.strokeDasharray=e.target.value});

function loreMenu(id){selectedLore=id;$('#overlay').innerHTML=`<div class="modal-scrim"><section class="af-operation-panel" role="dialog" aria-label="设定节点操作"><div class="af-section-head"><h2>节点操作</h2>${tool('关闭 ×','data-close')}</div><div class="af-menu-list">${tool('设置标签…','data-lore-tags-panel')}${tool('设置关系…','data-relation-panel="lore"')}${tool('打开详情页',`data-lore-detail="${id}"`)}${tool('新建同级节点','data-lore-add="sibling"')}${tool('新建子节点',`data-lore-child="${id}"`)}${tool('删除节点','data-demo="删除节点"')}</div></section></div>`}
document.addEventListener('click',e=>{let t=e.target.closest('button');if(!t)return;if(t.hasAttribute('data-lore-tags-panel')){let n=loreNodes.find(x=>x.id===selectedLore);$('#overlay').innerHTML=`<div class="modal-scrim"><section class="af-operation-panel" role="dialog" aria-label="设置标签"><div class="af-section-head"><h2>设置标签</h2>${tool('关闭 ×','data-close')}</div><small>${esc(n.note||n.text)}</small><div class="af-role-chips">${n.tags.map(t=>B(esc(t)+' ×','af-tag',`data-remove-tag="${esc(t)}"`)).join('')}</div><label>新增标签<input placeholder="输入标签名称，回车添加" data-add-lore-tag></label><div class="af-color-row">${['#dd9962','#73a6b7','#a3b887','#b58cae','#c56f64'].map(c=>`<button aria-label="标签颜色 ${c}" class="af-color-choice" style="background:${c}" data-demo="设置标签颜色"></button>`).join('')}</div><small>标签颜色与目录筛选联动</small></section></div>`}else if(t.dataset.removeTag){let n=loreNodes.find(x=>x.id===selectedLore);n.tags=n.tags.filter(x=>x!==t.dataset.removeTag);t.remove()}});
document.addEventListener('keydown',e=>{if(e.target.hasAttribute('data-add-lore-tag')&&e.key==='Enter'){e.preventDefault();let n=loreNodes.find(x=>x.id===selectedLore),tag=e.target.value.trim();if(tag&&!n.tags.includes(tag))n.tags.push(tag);$('#overlay').innerHTML='';repaint()}});

render(true);
</script></body></html>
