<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>小说工坊 · 四版视觉重构 · 40 个状态总览</title><style>
*{box-sizing:border-box}body{margin:0;background:#161718;color:#ededeb;font:14px/1.5 'Microsoft YaHei',sans-serif}header{padding:26px 32px 18px;border-bottom:1px solid #373839}h1{font-size:25px;letter-spacing:1px;margin:0 0 7px}p{color:#aeb0b1;margin:0}header>a{float:right;color:#eee;padding:10px 16px;border:1px solid #606263;text-decoration:none;border-radius:6px}nav{display:flex;gap:8px;margin-top:22px;flex-wrap:wrap}nav button{border:1px solid #515354;color:#c4c6c6;background:transparent;padding:9px 23px;border-radius:5px;cursor:pointer;font:inherit}nav button[aria-pressed=true]{color:#151718;background:#f1f0e9;border-color:#f1f0e9}main{padding:24px 32px 30px;display:grid;grid-template-columns:1fr 1fr;gap:25px 24px}article{min-width:0}article>a{display:block;text-decoration:none;color:inherit}article img{display:block;width:100%;aspect-ratio:1.6;border:1px solid #4c4e50;object-fit:contain;background:#222}h2{font-size:18px;margin:12px 0 3px}article p{font-size:13px}.card-head{display:flex;justify-content:space-between;align-items:center}.card-head span{color:#d5d6d3;font-size:13px}footer{padding:0 32px 24px;color:#939797;font-size:12px}@media(max-width:900px){main{grid-template-columns:1fr}header>a{float:none;display:inline-block;margin-bottom:16px}nav button{padding:8px 15px}}
footer{font-size:13px;max-width:620px}
</style></head><body><header><a href="style-explorer.html">进入 Oil UI 可操作对比 ↗</a><h1>小说工坊 · 功能对齐 / 03</h1><p>四种美术语言 · 每版七个功能界面与三个补充视图 · 点击画面打开原型</p><nav aria-label="功能界面"></nav></header><main></main><footer>设计评审原型 · 原生视口 1440 × 900 · AI 与保存流程为演示，未接入业务服务</footer><script>
const pages=[['shelf','书架'],['editor','正文'],['outline','大纲'],['world','设定'],['characters','人物'],['inspiration','灵感'],['settings','设置'],['outline-text','大纲·文本'],['world-detail','设定·详情'],['characters-graph','人物·关系图']];const designs=[['a','引力书舱','悬浮书册 / 轨道构图 / 关系星图'],['b','电光剪辑室','荧光切片 / 金属雕塑 / 模块画布'],['c','琉光画境','透光叠册 / 玻璃材质 / 灵感拼贴'],['d','赤月剧场','红月海报 / 巨字宋体 / 编辑档案']];let state=new URLSearchParams(location.search).get('state')||'shelf';if(!pages.some(p=>p[0]===state))state='shelf';function show(s){state=s;history.replaceState(null,'','?state='+s);document.querySelector('nav').innerHTML=pages.map(([id,name])=>`<button data-state="${id}" aria-pressed="${id===s}">${name}</button>`).join('');document.querySelector('main').innerHTML=designs.map(([id,name,desc])=>`<article><a href="${id}.html?state=${s}"><img src="gallery/${id}/${s}.png" alt="${name} · ${pages.find(p=>p[0]===s)[1]}"><div class="card-head"><h2>${id.toUpperCase()} / ${name}</h2><span>打开原型 ↗</span></div><p>${desc}</p></a></article>`).join('')}document.querySelector('nav').addEventListener('click',e=>{if(e.target.dataset.state)show(e.target.dataset.state)});show(state);
</script></body></html>
