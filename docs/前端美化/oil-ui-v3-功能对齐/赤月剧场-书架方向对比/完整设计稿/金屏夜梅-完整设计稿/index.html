<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>赤月戏 · 完整设计稿</title><style>
@font-face{font-family:OldSong;src:url('assets/oldsong.woff2')}*{box-sizing:border-box}body{margin:0;background:#111816;color:#e7dec9;font:13px 'Microsoft YaHei',sans-serif}button,a{font:inherit;color:inherit;border:0;background:none;text-decoration:none;cursor:pointer}button:focus-visible,a:focus-visible{outline:2px solid #d4b578;outline-offset:4px}aside{position:fixed;inset:0 auto 0 0;width:211px;border-right:1px solid #9b865540;background:#18211e;padding:27px 19px;display:flex;flex-direction:column;z-index:3}aside small{font-size:10px;letter-spacing:3px;color:#b7ab8d}aside h1{font:26px/1.5 OldSong;letter-spacing:4px;margin:15px 0 10px}aside>p{font-size:11px;color:#c4b599;line-height:1.9;margin:0 0 26px}nav{display:flex;flex-direction:column;gap:4px}nav button{text-align:left;padding:11px 12px;border-left:2px solid transparent;display:flex;align-items:center;gap:15px}nav button span{font:13px OldSong;color:#ad9a70}nav button.current{background:#bba16a24;border-left-color:#d0af68;color:#f6dfac}nav button:hover{background:#a08d6220}nav .sub{margin-left:22px;font-size:11px;padding:8px 10px;color:#c3b69a}aside .bottom{margin-top:auto;border-top:1px solid #9b865540;padding-top:19px;font-size:11px;line-height:1.9;color:#c0b494}.bottom a{color:#e5d2a9}main{margin-left:211px;height:100vh;display:flex;flex-direction:column;min-width:650px}.top{height:70px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 25px;border-bottom:1px solid #9b865540}.top strong{font:20px OldSong;letter-spacing:2px}.top small{margin-left:15px;color:#b9ad8e;font-size:11px}.top>div:last-child{display:flex;gap:10px;align-items:center}.top button,.top a{border:1px solid #9b865560;padding:8px 11px;font-size:11px}.top button.selected{background:#d2bd8e;color:#27332b}.viewport{flex:1;min-height:0;overflow:hidden;position:relative;background:radial-gradient(#323a30,#0c1311);padding:22px}.canvas{position:relative;margin:auto;box-shadow:0 12px 50px #0008}iframe{border:0;width:1440px;height:900px;display:block;transform-origin:top left;background:#171c1b}.actual .viewport{overflow:auto}.actual .canvas{margin:0}.caption{height:38px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 25px;color:#b8ac90;font-size:11px}.material-board{display:none;position:absolute;inset:0;background:#17211e;overflow:auto;padding:25px;z-index:2}.material-board.open{display:block}.material-board h2{font:24px OldSong;letter-spacing:3px;margin:0 0 10px}.material-board>p{font-size:12px;color:#bfb295;margin:0 0 24px}.materials{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:25px 20px}.material img{width:100%;height:190px;object-fit:cover;border:1px solid #b69b5d70;background:#273b32}.material h3{font:20px OldSong;letter-spacing:2px;margin:13px 0 8px}.material p{font-size:11px;color:#bfb295;line-height:1.8;margin:0}.material a{display:block}.material a:hover img{outline:2px solid #d5b778;outline-offset:3px}@media(max-width:1050px){aside{width:174px;padding:24px 13px}main{margin-left:174px}.top{padding:0 15px}.top small{display:none}.materials{grid-template-columns:repeat(2,1fr)}}
</style></head><body><aside><small>美术重设计 02 / 03</small><h1>赤月戏</h1><p>金屏夜梅 · 完整设计稿<br>七个模块，十个界面状态</p><nav aria-label="设计稿模块">
<button data-page="shelf"><span>01</span>书架</button><button data-page="editor"><span>02</span>正文</button><button data-page="outline"><span>03</span>故事大纲</button><button class="sub" data-page="outline-text">文本视图</button><button data-page="world"><span>04</span>世界设定</button><button class="sub" data-page="world-detail">条目详情</button><button data-page="characters"><span>05</span>人物档案</button><button class="sub" data-page="characters-graph">人物关系图</button><button data-page="inspiration"><span>06</span>灵感采集</button><button data-page="settings"><span>07</span>偏好设置</button></nav><div class="bottom">1440 × 900 设计视口<br>原有书架与正文素材保留<br><a href="设计说明.md" target="_blank">设计说明与素材记录 ↗</a></div></aside><main><header class="top"><div><strong id="page-name">正文</strong><small>赤月戏 · 模块展开</small></div><div><button id="fit" class="selected">适应窗口</button><button id="actual">实际尺寸</button><button id="replay">重播演出</button><button id="static">静态查看</button><button id="materials-toggle">素材总览</button><a id="open" href="editor.html" target="_blank">独立打开 ↗</a></div></header><div class="viewport"><div class="canvas"><iframe src="editor.html" title="赤月戏设计稿"></iframe></div><section class="material-board"><h2>一幕一境，各有主题</h2><p>统一曲线装饰、精细材质与舞台景深；按模块分别组织主体、配色和留白。</p><div class="materials" id="materials"></div></section></div><div class="caption"><span id="description">金屏夜梅 · 双页稿本</span><span id="scale-label">1440 × 900</span></div></main><script>
const names={shelf:['书架','沿用山月纸景 · 六部作品'],editor:['正文','金屏夜梅 · 双页稿本'],outline:['大纲 · 自由画布','叙事之树 · 模块与连线'],'outline-text':['大纲 · 文本视图','连续卷宗 · 事件大纲'],world:['设定 · 幕布','世界暗纹 · 连续树形编辑'],'world-detail':['设定 · 详情','星图系统 · 关联图谱'],characters:['人物 · 档案','双鸟结缘 · 肖像卷宗'],'characters-graph':['人物 · 关系图','双鸟结缘 · 关系连线'],inspiration:['灵感','幕间拾光 · 花窗与手记'],settings:['设置','花瓣光圈 · 偏好与排版']};
const materials=[['nouveau','书架 / 山月藏书','沿用已有素材。青绿山月、金枝与大面积纸白。'],['rinpa','正文 / 夜梅金屏','保留已选素材。金箔折屏与梅枝，围合双页稿本。'],['outline','大纲 / 叙事之树','分枝与叙事红线，呼应编排与连接。'],['secession','设定 / 世界暗纹','复用待使用的天鹅壁画，配星图关系与树形卷宗。'],['characters','人物 / 双鸟结缘','相向的鸟、交织的枝与结绳，呼应身份与关系。'],['mucha','灵感 / 幕间拾光','复用珍珠花窗，飞蛾与赤月映照散落的彩色手记。'],['settings','设置 / 花瓣光圈','珍珠花瓣、蓝绿景片与精巧机关，呼应排版与调节。']];
document.querySelector('#materials').innerHTML=materials.map(([id,title,desc])=>`<article class="material"><a href="assets/${id}.webp" target="_blank"><img src="assets/${id}.webp" alt="${title}"></a><h3>${title}</h3><p>${desc}</p></article>`).join('');
const frame=document.querySelector('iframe'),canvas=document.querySelector('.canvas'),viewport=document.querySelector('.viewport'),board=document.querySelector('.material-board');let actual=false;
function fit(){const scale=actual?1:Math.min((viewport.clientWidth-44)/1440,(viewport.clientHeight-44)/900);frame.style.transform=`scale(${scale})`;canvas.style.width=1440*scale+'px';canvas.style.height=900*scale+'px';document.querySelector('#scale-label').textContent=`1440 × 900 · ${Math.round(scale*100)}%`;document.body.classList.toggle('actual',actual);}
function sync(id){if(!names[id])return;document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('current',b.dataset.page===id));document.querySelector('#page-name').textContent=names[id][0];document.querySelector('#description').textContent=names[id][1];document.querySelector('#open').href=id+'.html';history.replaceState(null,'','?state='+id);}
function navigate(id){if(!names[id])id='editor';board.classList.remove('open');frame.src=id+'.html';sync(id);}
document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>navigate(b.dataset.page));
document.querySelector('#fit').onclick=()=>{actual=false;fit();document.querySelector('#fit').classList.add('selected');document.querySelector('#actual').classList.remove('selected');};
document.querySelector('#actual').onclick=()=>{actual=true;fit();document.querySelector('#actual').classList.add('selected');document.querySelector('#fit').classList.remove('selected');};
document.querySelector('#replay').onclick=()=>frame.contentWindow.postMessage({type:'replay'},'*');document.querySelector('#static').onclick=()=>frame.contentWindow.postMessage({type:'static'},'*');document.querySelector('#materials-toggle').onclick=()=>board.classList.toggle('open');
const videoLink=document.createElement('a');videoLink.href='evidence/演出预览.html';videoLink.target='_blank';videoLink.textContent='演出录屏 ↗';document.querySelector('aside .bottom').append(document.createElement('br'),videoLink);
frame.onload=()=>{try{sync(frame.contentDocument.body.dataset.state);}catch{}fit();};new ResizeObserver(fit).observe(viewport);navigate(new URLSearchParams(location.search).get('state')||'editor');
</script></body></html>
