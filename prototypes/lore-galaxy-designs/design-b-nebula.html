      // (a) 内芯守白、外晕赋彩（lighter）
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = alpha;
      const airy = ctx.createRadialGradient(x, y, 0, x, y, airyR);
      airy.addColorStop(0.0, 'rgba(255, 253, 248, 0.94)');
      airy.addColorStop(0.18, hexToRgba(starCol, 0.72));
      airy.addColorStop(0.45, pal.halo);
      airy.addColorStop(0.75, pal.soft);
      airy.addColorStop(1.0, 'rgba(0, 0, 0, 0)');
      ctx.fillStyle = airy;
      ctx.beginPath();
      ctx.arc(x, y, airyR, 0, TAU);
      ctx.fill();

      // 双色渐变尖锋衍射光线（中心炽象牙白 -> 向外渐变为条目专属矿物色）
      const hLen = r * lerp(2.90, 3.60, hoverT) * scint * tierScale;
      const vLen = r * lerp(2.15, 2.75, hoverT) * scint * tierScale;
      const dLen = r * lerp(1.08, 1.42, hoverT) * scint * tierScale;
      const rayA = lerp(0.88, 1.0, hoverT) * (0.94 + 0.06 * Math.sin(t * e._freqA + e._phaseA));
      drawOpticalSpikeA(ctx, x, y, hLen, 0, 1.08 * tierScale, rayA, starCol);
      drawOpticalSpikeA(ctx, x, y, vLen, Math.PI * 0.5, 0.94 * tierScale, rayA * 0.94, starCol);
      drawOpticalSpikeA(ctx, x, y, dLen, Math.PI * 0.25, 0.54, rayA * 0.44, starCol);
      drawOpticalSpikeA(ctx, x, y, dLen, -Math.PI * 0.25, 0.54, rayA * 0.44, starCol);

      // 纯洁炽白针尖内核（#FFFDF8）
      ctx.fillStyle = '#FFFDF8';
      ctx.beginPath();
      ctx.arc(x, y, coreR, 0, TAU);
      ctx.fill();
      ctx.globalCompositeOperation = 'source-over';

      // (b) 悬停激活时亮起专属矿物色外廓微光环
      if (hoverT > 0.04) {
        ctx.strokeStyle = starCol;
        ctx.lineWidth = 0.72;
        ctx.globalAlpha = alpha * hoverT * 0.72;
        ctx.beginPath();
        ctx.arc(x, y, ringR + 4.4, 0, TAU);
        ctx.stroke();
      }

      // (c) 0.65px 香槟金双层不对称镂空断弧游丝环
      const rot = e._rotA;
      ctx.lineCap = 'round';
      ctx.strokeStyle = hoverT > 0.35 ? '#FFF3D4' : goldCol;
      ctx.lineWidth = 0.65;
      ctx.globalAlpha = alpha * lerp(0.68, 0.95, hoverT);
      const a0 = rot, a1 = rot + Math.PI * 0.78;
      ctx.beginPath();
      ctx.arc(x, y, ringR, a0, a1);
      ctx.stroke();

      const b0 = rot + Math.PI * 1.06, b1 = rot + Math.PI * 1.62;
      ctx.globalAlpha = alpha * lerp(0.46, 0.84, hoverT);
      ctx.beginPath();
      ctx.arc(x, y, ringR + 2.0, b0, b1);
      ctx.stroke();

      // 主弧端：专属矿物色宝石微点；副弧端：精致 1.4px 朱砂定标点
      const gemX = x + Math.cos(a0) * ringR, gemY = y + Math.sin(a0) * ringR;
      const cinX = x + Math.cos(b1) * (ringR + 2.0), cinY = y + Math.sin(b1) * (ringR + 2.0);

      ctx.globalCompositeOperation = 'lighter';
      ctx.fillStyle = hexToRgba(starCol, 0.65);
      ctx.globalAlpha = alpha;
      ctx.beginPath();
      ctx.arc(gemX, gemY, lerp(2.4, 3.3, hoverT), 0, TAU);
      ctx.fill();
      ctx.globalCompositeOperation = 'source-over';

      ctx.fillStyle = starCol;
      ctx.globalAlpha = alpha * 0.98;
      ctx.beginPath();
      ctx.arc(gemX, gemY, lerp(1.25, 1.55, hoverT), 0, TAU);
      ctx.fill();
      ctx.strokeStyle = 'rgba(255, 253, 248, 0.65)';
      ctx.lineWidth = 0.4;
      ctx.stroke();

      // 1.4px 点绛朱砂定标点
      ctx.fillStyle = '#C84B31';
      ctx.globalAlpha = alpha * lerp(0.84, 1.0, hoverT);
      ctx.beginPath();
      ctx.arc(cinX, cinY, 1.4 * 0.55, 0, TAU); // 直径 ~1.5px 精准克制
      ctx.fill();
      ctx.strokeStyle = 'rgba(255, 240, 214, 0.58)';
      ctx.lineWidth = 0.4;
      ctx.stroke();
    } else if (starClass === 'anchor') {
      // 2. 集内主曜星「星官菱框」：中短光学十字星芒 + 专属矿物色星晕 + 4 角悬空微距菱形金丝卡位
      const haloR = r * lerp(1.90, 2.40, hoverT) * scint;
      const coreR = clamp(r * 0.26, 1.4, 2.0);
      const frameR = r * lerp(1.20, 1.52, hoverT);
      nItem.outerVisRA = frameR + 2.8;

      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = alpha;
      const glow = ctx.createRadialGradient(x, y, 0, x, y, haloR);
      glow.addColorStop(0.0, 'rgba(255, 253, 248, 0.92)');
      glow.addColorStop(0.20, hexToRgba(starCol, 0.66));
      glow.addColorStop(0.50, pal.halo);
      glow.addColorStop(0.80, pal.soft);
      glow.addColorStop(1.0, 'rgba(0, 0, 0, 0)');
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(x, y, haloR, 0, TAU);
      ctx.fill();

      const glintLen = r * lerp(1.62, 2.25, hoverT) * scint;
      drawOpticalSpikeA(ctx, x, y, glintLen, 0, 0.78, lerp(0.74, 0.98, hoverT), starCol);
      drawOpticalSpikeA(ctx, x, y, glintLen * 0.85, Math.PI * 0.5, 0.70, lerp(0.66, 0.92, hoverT), starCol);

      ctx.fillStyle = '#FFFDF8';
      ctx.beginPath();
      ctx.arc(x, y, coreR, 0, TAU);
      ctx.fill();
      ctx.globalCompositeOperation = 'source-over';

      // 悬空微距 4 角菱形金丝卡位（中段留白，悬停微扩锁焦并点亮顶角矿物光点）
      const arm = 2.65;
      const d = arm * 0.707;
      ctx.strokeStyle = isHovered ? '#FFF2D0' : goldCol;
      ctx.lineWidth = isHovered ? 0.84 : 0.65;
      ctx.globalAlpha = alpha * lerp(0.66, 0.96, hoverT);
      ctx.beginPath();
      ctx.moveTo(x - d, y - frameR + d); ctx.lineTo(x, y - frameR); ctx.lineTo(x + d, y - frameR + d);
      ctx.moveTo(x + frameR - d, y - d); ctx.lineTo(x + frameR, y); ctx.lineTo(x + frameR - d, y + d);
      ctx.moveTo(x - d, y + frameR - d); ctx.lineTo(x, y + frameR); ctx.lineTo(x + d, y + frameR - d);
      ctx.moveTo(x - frameR + d, y - d); ctx.lineTo(x - frameR, y); ctx.lineTo(x - frameR + d, y + d);
      ctx.stroke();

      // 顶角镶嵌专属矿物微点
      ctx.fillStyle = starCol;
      ctx.globalAlpha = alpha * lerp(0.74, 1.0, hoverT);
      ctx.beginPath();
      ctx.arc(x, y - frameR, lerp(0.95, 1.45, hoverT), 0, TAU);
      ctx.fill();

      if (hoverT > 0.04) {
        ctx.strokeStyle = starCol;
        ctx.lineWidth = 0.62;
        ctx.globalAlpha = alpha * hoverT * 0.62;
        ctx.beginPath();
        ctx.arc(x, y, frameR + 3.2, 0, TAU);
        ctx.stroke();
      }
    } else {
      // 3. 散星微曜（孤立或末梢 Tier 3）：炽白针尖核 + 专属矿物色微光晕 + 3 种克制微差古星图符号
      const pinR = clamp(r * 0.25, 0.85, 1.25);
      const haloR = r * lerp(1.62, 2.15, hoverT) * scint;
      const ringR = r * lerp(1.54, 1.82, hoverT);
      const variant = e.shapeVariantA || 0;
      nItem.outerVisRA = (isHovered || isSetFocused ? ringR : Math.max(pinR * 2.4, variant === 1 ? 5.2 : 3.2)) + 1.8;

      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = alpha;
      const mist = ctx.createRadialGradient(x, y, 0, x, y, haloR);
      mist.addColorStop(0.0, 'rgba(255, 253, 248, 0.88)');
      mist.addColorStop(0.24, hexToRgba(starCol, 0.56));
      mist.addColorStop(0.58, pal.halo);
      mist.addColorStop(1.0, 'rgba(0, 0, 0, 0)');
      ctx.fillStyle = mist;
      ctx.beginPath();
      ctx.arc(x, y, haloR, 0, TAU);
      ctx.fill();

      if (variant === 2) {
        // c. 极细微小斜向光针（白芯 -> 专属矿物色）
        const diagA = Math.PI * 0.25;
        drawOpticalSpikeA(ctx, x, y, r * lerp(1.35, 1.85, hoverT) * scint, diagA, 0.56, lerp(0.62, 0.90, hoverT), starCol);
        drawOpticalSpikeA(ctx, x, y, r * lerp(1.05, 1.48, hoverT) * scint, -diagA, 0.48, lerp(0.42, 0.72, hoverT), starCol);
      }

      ctx.fillStyle = '#FFFDF8';
      ctx.beginPath();
      ctx.arc(x, y, pinR, 0, TAU);
      ctx.fill();

      if (variant === 1) {
        // b. 距离 4.2px 处伴随一颗极微小的次级伴星尘点
        const cAng = e.companionAngA || 0.7;
        const cx = x + Math.cos(cAng) * 4.4;
        const cy = y + Math.sin(cAng) * 4.4;
        ctx.fillStyle = pal.halo;
        ctx.beginPath();
        ctx.arc(cx, cy, 1.8, 0, TAU);
        ctx.fill();
        ctx.fillStyle = '#FFFDF8';
        ctx.beginPath();
        ctx.arc(cx, cy, 0.65, 0, TAU);
        ctx.fill();
      }
      ctx.globalCompositeOperation = 'source-over';

      // a. 极淡单圈微金环（常态轻微可见，悬停或推近时显露专属矿物微光外廓）
      const zoomReveal = clamp((state.zoom - 1.18) / 0.45, 0, 1);
      const baseRingA = variant === 0 ? 0.34 : 0;
      const reticleA = Math.max(baseRingA, hoverT * 0.88, isSetFocused ? 0.42 : 0, zoomReveal * 0.36);
      if (reticleA > 0.03) {
        ctx.strokeStyle = hoverT > 0.25 ? starCol : goldCol;
        ctx.lineWidth = hoverT > 0.25 ? 0.68 : 0.50;
        ctx.globalAlpha = alpha * reticleA;
        ctx.beginPath();
        ctx.arc(x, y, ringR, 0, TAU);
        ctx.stroke();
      }
    }
    ctx.restore();
  }

  function drawFireflyTrailA(ctx, samples, u, isActive, baseAlpha, fromRgb = GOLD_RGB_A, toRgb = GOLD_RGB_A) {
    const nSegs = samples.length - 1;
    const trailSteps = 14;
    const stepU = 0.011;
    const sampleAt = (uu) => {
      const clampU = ((uu % 1) + 1) % 1;
      const fIdx = clampU * nSegs;
      const i0 = Math.min(nSegs - 1, Math.floor(fIdx));
      const frac = fIdx - i0;
      return {
        x: lerp(samples[i0].x, samples[i0 + 1].x, frac),
        y: lerp(samples[i0].y, samples[i0 + 1].y, frac)
      };
    };
    const uClamped = ((u % 1) + 1) % 1;
    const starRgb = [
      Math.round(lerp(fromRgb[0], toRgb[0], uClamped)),
      Math.round(lerp(fromRgb[1], toRgb[1], uClamped)),
      Math.round(lerp(fromRgb[2], toRgb[2], uClamped))
    ];
    const starHex = `#${starRgb.map(v => v.toString(16).padStart(2, '0')).join('')}`;

    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.lineCap = 'round';
    // 修长丝绒彗尾：炽白光头 -> 条目专属矿物星光 -> 赤金 / 朱砂微息
    for (let k = trailSteps; k >= 1; k--) {
      const pA = sampleAt(u - k * stepU);
      const pB = sampleAt(u - (k - 1) * stepU);
      const t = 1 - k / (trailSteps + 1);
      const ease = t * t;
      ctx.beginPath();
      ctx.moveTo(pA.x, pA.y);
      ctx.lineTo(pB.x, pB.y);
      const segCol = t > 0.78 ? '#FFF3D4' : t > 0.36 ? starHex : (isActive ? '#C84B31' : '#DF8C58');
      ctx.strokeStyle = segCol;
      ctx.lineWidth = (isActive ? 2.2 : 1.55) * (0.25 + 0.75 * ease);
      ctx.globalAlpha = baseAlpha * (isActive ? 0.85 : 0.60) * ease;
      ctx.stroke();
    }

    const head = sampleAt(u);
    const radius = isActive ? 2.6 : 1.9;
    const g = ctx.createRadialGradient(head.x, head.y, 0.2, head.x, head.y, radius * 3.8);
    g.addColorStop(0.0, 'rgba(255, 253, 248, 0.96)');
    g.addColorStop(0.28, `rgba(${starRgb[0]}, ${starRgb[1]}, ${starRgb[2]}, 0.56)`);
    g.addColorStop(0.62, isActive ? 'rgba(200, 75, 49, 0.24)' : 'rgba(232, 198, 136, 0.16)');
    g.addColorStop(1.0, 'rgba(0, 0, 0, 0)');
    ctx.globalAlpha = baseAlpha * (isActive ? 1.0 : 0.86);
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(head.x, head.y, radius * 3.8, 0, TAU);
    ctx.fill();

    drawOpticalSpikeA(ctx, head.x, head.y, radius * 2.6, 0, 0.55, baseAlpha * 0.78, starHex);
    drawOpticalSpikeA(ctx, head.x, head.y, radius * 2.1, Math.PI * 0.5, 0.5, baseAlpha * 0.68, starHex);

    ctx.fillStyle = '#FFFDF8';
    ctx.beginPath();
    ctx.arc(head.x, head.y, radius * 0.55, 0, TAU);
    ctx.fill();
    ctx.restore();
  }

  function drawCurveSpark(ctx, samples, u, coreColor, glowColor, radius) {
    const idx = Math.min(samples.length - 2, Math.floor(u * (samples.length - 1)));
    const frac = u * (samples.length - 1) - idx;
    const x = lerp(samples[idx].x, samples[idx + 1].x, frac);
    const y = lerp(samples[idx].y, samples[idx + 1].y, frac);
    ctx.save();
    const g = ctx.createRadialGradient(x, y, 0.5, x, y, radius * 3.2);
    g.addColorStop(0, coreColor);
    g.addColorStop(0.4, glowColor);
    g.addColorStop(1, 'rgba(0, 0, 0, 0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(x, y, radius * 3.2, 0, TAU);
    ctx.fill();
    ctx.fillStyle = coreColor;
    ctx.beginPath();
    ctx.arc(x, y, radius * 0.75, 0, TAU);
    ctx.fill();
    ctx.restore();
  }

  /* ==================== 7. LOD 外置微标签与屏幕空间防碰撞引擎 ==================== */
  function drawLabelsWithCollisionAvoidance(ctx, sortedSets, sortedNodes, relCurves, isA, width, height) {
    const occupiedBoxes = [];

    // 保护中心主星区域不放标签
    const c = frameCache.center || project3D(0, 0, 0, width, height);
    occupiedBoxes.push({ x1: c.x - c.radius - 12, y1: c.y - c.radius - 12, x2: c.x + c.radius + 12, y2: c.y + c.radius + 32 });
    // 方案 A：主星宋版牌记铭牌净空（防止设定集书牌 / 条目标签压住「天穹钟摆」）
    if (isA && c.titleBoxA) occupiedBoxes.push(c.titleBoxA);

    /* 7.1 各设定集星域标题（方案 A 毛玻璃圆角铭牌 vs 方案 B 去胶囊化 45° 测绘折线基线排印） */
    ctx.save();
    for (const sItem of sortedSets) {
      const s = sItem.set;
      const alpha = clamp((0.55 + 0.45 * sItem.depthNorm) * s.focusWeight, 0.08, 1.0);
      ctx.font = '600 12.5px "PingFang SC", "Microsoft YaHei", sans-serif';
      const titleW = ctx.measureText(s.title).width;
      const countStr = s.entries.length === 0 ? '00 · 待勘定' : String(s.entries.length).padStart(2, '0');
      ctx.font = '500 10.5px "JetBrains Mono", Consolas, monospace';
      const countW = ctx.measureText(countStr).width;

      const isUpperNorth = sItem.y < c.y - 30 && Math.abs(sItem.x - c.x) < c.radius * 3.2;

      if (isA) {
        // 方案 A：宋版书牌 / 竖标漆金微匾（彻底告别 45° 测绘折线：左侧竖金标 + 象牙白宋体标题 + 描金方框计数标 + 发丝金线 + 古天文副标）
        const isHighlighted = state.hoveredSetId === s.id || state.focusedSetId === s.id || state.rimHoverSetId === s.id || state.resizingSetId === s.id;
        ctx.font = '600 13px "Noto Serif SC", "Songti SC", serif';
        const serifTitleW = ctx.measureText(s.title).width;
        const numStr = String(s.entries.length).padStart(2, '0');
        ctx.font = '600 9.5px "Noto Serif SC", "JetBrains Mono", serif';
        const boxNumW = Math.max(18, ctx.measureText(numStr).width + 8);

        const subLabel = s.entries.length === 0
          ? `${s.catalogA || '星野卷 · 未名星野'} · 待勘`
          : `${s.catalogA || '钦天卷'} · ${s.latLabelA || '周天'}`;
        ctx.font = '500 9px "Noto Serif SC", "Songti SC", serif';
        const subW = ctx.measureText(subLabel).width;

        const plaqueW = Math.max(serifTitleW + boxNumW + 30, subW + 24);
        const plaqueH = 34;

        // 多方位避让候选锚位（优先置于星垣外侧上下及左右，避让中心与其余星域）
        const preferUp = sItem.y < c.y - 12;
        const gapR = sItem.radius + 10;
        const candidates = preferUp
          ? [
              { px: clamp(sItem.x - plaqueW * 0.45, 16, width - plaqueW - 18), py: clamp(sItem.y - gapR - plaqueH, 24, height - plaqueH - 20) },
              { px: clamp(sItem.x - plaqueW * 0.45, 16, width - plaqueW - 18), py: clamp(sItem.y + gapR, 24, height - plaqueH - 20) },
              { px: clamp(sItem.x + gapR, 16, width - plaqueW - 18), py: clamp(sItem.y - plaqueH * 0.5, 24, height - plaqueH - 20) },
              { px: clamp(sItem.x - gapR - plaqueW, 16, width - plaqueW - 18), py: clamp(sItem.y - plaqueH * 0.5, 24, height - plaqueH - 20) },
              { px: clamp(sItem.x - plaqueW * 0.45, 16, width - plaqueW - 18), py: clamp(sItem.y - gapR - plaqueH - 24, 24, height - plaqueH - 20) }
            ]
          : [
              { px: clamp(sItem.x - plaqueW * 0.45, 16, width - plaqueW - 18), py: clamp(sItem.y + gapR, 24, height - plaqueH - 20) },
              { px: clamp(sItem.x - plaqueW * 0.45, 16, width - plaqueW - 18), py: clamp(sItem.y - gapR - plaqueH, 24, height - plaqueH - 20) },
              { px: clamp(sItem.x + gapR, 16, width - plaqueW - 18), py: clamp(sItem.y - plaqueH * 0.5, 24, height - plaqueH - 20) },
              { px: clamp(sItem.x - gapR - plaqueW, 16, width - plaqueW - 18), py: clamp(sItem.y - plaqueH * 0.5, 24, height - plaqueH - 20) },
              { px: clamp(sItem.x - plaqueW * 0.45, 16, width - plaqueW - 18), py: clamp(sItem.y + gapR + 24, 24, height - plaqueH - 20) }
            ];

        let chosenSetBox = null;
        for (const cand of candidates) {
          const rect = { x1: cand.px - 4, y1: cand.py - 3, x2: cand.px + plaqueW + 4, y2: cand.py + plaqueH + 3 };
          const hit = occupiedBoxes.some(b => !(rect.x2 < b.x1 || rect.x1 > b.x2 || rect.y2 < b.y1 || rect.y1 > b.y2));
          if (!hit) {
            chosenSetBox = { px: cand.px, py: cand.py, rect };
            break;
          }
        }
        if (!chosenSetBox) {
          const cand = candidates[0];
          chosenSetBox = {
            px: cand.px, py: cand.py,
            rect: { x1: cand.px - 4, y1: cand.py - 3, x2: cand.px + plaqueW + 4, y2: cand.py + plaqueH + 3 }
          };
        }

        const { px, py, rect } = chosenSetBox;
        ctx.globalAlpha = alpha;
        const jadeCol = s.mineralA || '#E8C688';

        // 1. 横向松烟墨渐隐雾晕（椭圆径向雾，无任何硬边界，如墨印宣纸）
        ctx.save();
        const fogRx = plaqueW * 0.64;
        const fogRy = plaqueH * 0.86;
        ctx.translate(px + plaqueW * 0.44, py + plaqueH * 0.5);
        ctx.scale(1, fogRy / fogRx);
        const fog = ctx.createRadialGradient(0, 0, 0, 0, 0, fogRx);
        fog.addColorStop(0, 'rgba(7, 6, 5, 0.82)');
        fog.addColorStop(0.55, 'rgba(7, 6, 5, 0.56)');
        fog.addColorStop(1, 'rgba(7, 6, 5, 0)');
        ctx.fillStyle = fog;
        ctx.beginPath();
        ctx.arc(0, 0, fogRx, 0, TAU);
        ctx.fill();
        ctx.restore();

        // 2. 宋版书牌双细金 L 形折角 + 微曲回纹头（左上主折角，右下呼应小折角）
        ctx.save();
        ctx.lineCap = 'square';
        ctx.strokeStyle = isHighlighted ? '#F4D89E' : '#E8C688';
        ctx.lineWidth = 0.85;
        ctx.globalAlpha = alpha * (isHighlighted ? 0.98 : 0.82);
        ctx.beginPath();
        ctx.moveTo(px + 0.5, py + plaqueH - 7);
        ctx.lineTo(px + 0.5, py + 0.5);
        ctx.lineTo(px + 14, py + 0.5);
        ctx.lineTo(px + 14, py + 3.5);   // 回纹勾头
        ctx.lineTo(px + 11.5, py + 3.5);
        ctx.stroke();
        ctx.lineWidth = 0.5;
        ctx.globalAlpha = alpha * (isHighlighted ? 0.75 : 0.5);
        ctx.beginPath();
        ctx.moveTo(px + 3, py + plaqueH - 11);
        ctx.lineTo(px + 3, py + 3);
        ctx.lineTo(px + 9, py + 3);
        ctx.stroke();
        // 右下呼应折角
        const brX = px + plaqueW + 2, brY = py + plaqueH - 1;
        ctx.lineWidth = 0.65;
        ctx.globalAlpha = alpha * (isHighlighted ? 0.8 : 0.48);
        ctx.beginPath();
        ctx.moveTo(brX - 9, brY);
        ctx.lineTo(brX, brY);
        ctx.lineTo(brX, brY - 6);
        ctx.stroke();
        ctx.restore();
        ctx.globalAlpha = alpha;

        // 3. 左侧矿物色玉点（聚焦 / 悬停点亮为朱砂微点）
        const dotX = px + 8.5, dotY = py + 11;
        const dotCol = isHighlighted ? '#C84B31' : jadeCol;
        ctx.save();
        if (isHighlighted) {
          ctx.shadowColor = 'rgba(200, 75, 49, 0.75)';
          ctx.shadowBlur = 6;
        }
        const jade = ctx.createRadialGradient(dotX - 0.8, dotY - 0.9, 0.2, dotX, dotY, 2.7);
        jade.addColorStop(0, '#FFF8EA');
        jade.addColorStop(0.35, dotCol);
        jade.addColorStop(1, mixHexA(dotCol.length === 7 ? dotCol : '#E8C688', '#120D08', 0.55));
        ctx.fillStyle = jade;
        ctx.beginPath();
        ctx.arc(dotX, dotY, 2.6, 0, TAU);
        ctx.fill();
        ctx.restore();

        // 4. 主标题（象牙白端庄宋体）
        const titleX = px + 15;
        const titleY = py + 11;
        ctx.save();
        ctx.shadowColor = 'rgba(8, 7, 6, 0.96)';
        ctx.shadowBlur = 7;
        ctx.font = '600 13px "Noto Serif SC", "Songti SC", serif';
        ctx.fillStyle = isHighlighted ? '#FFFDF8' : '#F6EFE2';
        ctx.textAlign = 'left';
        ctx.textBaseline = 'middle';
        ctx.fillText(s.title, titleX, titleY);
        ctx.restore();

        // 5. 描金八角小章计数（双细八角框 + 纤细衬线数字）
        const stampR = 8.4;
        const stampCx = px + plaqueW - stampR - 1;
        const stampCy = titleY;
        const octo = (rad) => {
          ctx.beginPath();
          for (let k = 0; k < 8; k++) {
            const a = Math.PI / 8 + (k / 8) * TAU;
            const x = stampCx + Math.cos(a) * rad, y = stampCy + Math.sin(a) * rad;
            if (k === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
          }
          ctx.closePath();
        };
        ctx.save();
        octo(stampR);
        ctx.fillStyle = isHighlighted ? 'rgba(200, 75, 49, 0.26)' : 'rgba(10, 8, 6, 0.82)';
        ctx.fill();
        ctx.strokeStyle = isHighlighted ? '#F4D89E' : 'rgba(232, 198, 136, 0.72)';
        ctx.lineWidth = 0.75;
        ctx.stroke();
        octo(stampR - 2);
        ctx.strokeStyle = isHighlighted ? 'rgba(200, 75, 49, 0.8)' : 'rgba(232, 198, 136, 0.32)';
        ctx.lineWidth = 0.5;
        ctx.stroke();
        ctx.font = '600 8.5px "Noto Serif SC", "Songti SC", serif';
        ctx.fillStyle = isHighlighted ? '#FFF3D6' : '#EAD09B';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(numStr, stampCx, stampCy + 0.5);
        ctx.restore();

        // 6. 主副标题之间极淡渐隐发丝金线（起点微菱）
        const sepY = py + 20.5;
        const sepGrad = ctx.createLinearGradient(titleX, sepY, px + plaqueW, sepY);
        sepGrad.addColorStop(0, isHighlighted ? '#E8C688' : 'rgba(232, 198, 136, 0.55)');
        sepGrad.addColorStop(0.75, 'rgba(232, 198, 136, 0.16)');
        sepGrad.addColorStop(1, 'rgba(232, 198, 136, 0)');
        ctx.strokeStyle = sepGrad;
        ctx.lineWidth = 0.6;
        ctx.beginPath();
        ctx.moveTo(titleX + 4, sepY);
        ctx.lineTo(px + plaqueW, sepY);
        ctx.stroke();
        ctx.fillStyle = isHighlighted ? '#F4D89E' : 'rgba(232, 198, 136, 0.7)';
        ctx.beginPath();
        ctx.moveTo(titleX, sepY - 1.8);
        ctx.lineTo(titleX + 1.8, sepY);
        ctx.lineTo(titleX, sepY + 1.8);
        ctx.lineTo(titleX - 1.8, sepY);
        ctx.closePath();
        ctx.fill();

        // 7. 下方古天文坐标副标
        ctx.font = '500 9px "Noto Serif SC", "Songti SC", serif';
        ctx.fillStyle = isHighlighted ? '#EAD09B' : 'rgba(216, 184, 126, 0.78)';
        ctx.textAlign = 'left';
        ctx.textBaseline = 'middle';
        ctx.fillText(subLabel, titleX, py + 28.5);
        sItem.labelBox = { x: px + plaqueW * 0.5, y: py + plaqueH * 0.5, w: plaqueW + 8, h: plaqueH + 6 };
        occupiedBoxes.push(rect);
      } else {
        // 方案 B：全面去除深色胶囊底框！采用建筑测绘引线风（45° 折线引线 + 水平基线 + 标题 + 右上角等宽角标）
        const isHighlighted = state.hoveredSetId === s.id || state.focusedSetId === s.id || state.rimHoverSetId === s.id || state.resizingSetId === s.id;
        const ruleW = titleW + countW + 22;
        const dirY = isUpperNorth ? -1 : 1;
        // 从星域正下或正上偏外侧引出 45° 测绘折线
        const startX = sItem.x - ruleW * 0.28;
        const startY = sItem.y + dirY * (sItem.radius + 3);
        const diag = 12;
        const kneeX = startX + diag;
        const kneeY = startY + dirY * diag;
        const endX = kneeX + ruleW;

        ctx.globalAlpha = alpha;
        // 1. 起点微菱形锚点 + 45° 折线 + 水平测绘基线
        ctx.strokeStyle = isHighlighted ? '#47D7E8' : s.coldHue;
        ctx.lineWidth = isHighlighted ? 1.15 : 0.85;
        ctx.beginPath();
        ctx.moveTo(startX, startY);
        ctx.lineTo(kneeX, kneeY);
        ctx.lineTo(endX, kneeY);
        ctx.stroke();

        // 水平基线右端短竖刻度封尾
        ctx.beginPath();
        ctx.moveTo(endX, kneeY - 4);
        ctx.lineTo(endX, kneeY + 3);
        ctx.stroke();

        // 起点 2.5px 空心微菱形
        ctx.fillStyle = '#04070D';
        ctx.beginPath();
        ctx.moveTo(startX, startY - 2.5);
        ctx.lineTo(startX + 2.5, startY);
        ctx.lineTo(startX, startY + 2.5);
        ctx.lineTo(startX - 2.5, startY);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        // 2. 基线上方设定集标题（冷铂白高对比排印，深空光学暗晕托底，无胶囊框）
        const textY = kneeY - 8;
        ctx.save();
        ctx.shadowColor = 'rgba(4, 7, 13, 0.96)';
        ctx.shadowBlur = 7;
        ctx.font = '600 12.5px "PingFang SC", "Microsoft YaHei", sans-serif';
        ctx.fillStyle = isHighlighted ? '#FFFFFF' : '#EAF3FF';
        ctx.textAlign = 'left';
        ctx.textBaseline = 'middle';
        ctx.fillText(s.title, kneeX + 2, textY);

        // 3. 右侧等宽角标数字
        ctx.font = '600 10.5px "JetBrains Mono", Consolas, monospace';
        ctx.fillStyle = '#47D7E8';
        ctx.textAlign = 'right';
        ctx.fillText('[' + countStr + ']', endX - 3, textY);

        // 4. 基线下方极克制瑞士测绘坐标编号
        ctx.font = '500 8.5px "JetBrains Mono", Consolas, monospace';
        ctx.fillStyle = 'rgba(138, 168, 204, 0.66)';
        ctx.textAlign = 'left';
        ctx.fillText(`WELL // ΔZ +${(s.elevationB || 0.36).toFixed(2)}`, kneeX + 2, kneeY + 8);
        ctx.restore();

        const boxCx = kneeX + ruleW * 0.5;
        const boxCy = kneeY - 2;
        sItem.labelBox = { x: boxCx, y: boxCy, w: ruleW + 16, h: 28 };
        occupiedBoxes.push({ x1: startX - 4, y1: kneeY - 20, x2: endX + 6, y2: kneeY + 14 });
      }
    }
    ctx.restore();

    /* 7.2 条目节点独立外置微标签 + 2D 防碰撞偏移（方案 A 轻毛玻璃底衬 vs 方案 B 无底框高对比微排印） */
    if (isA) {
      for (const n of sortedNodes) n.labelRectA = null;
    }
    const candidates = sortedNodes
      .filter(n => n.entry.labelAlpha > 0.04 && n.entry.focusWeight > 0.22)
      .sort((a, b) => {
        const pa = (state.hoveredNodeId === a.entry.id ? 10 : 0) + (4 - a.entry.tier) * 2 + a.depthNorm;
        const pb = (state.hoveredNodeId === b.entry.id ? 10 : 0) + (4 - b.entry.tier) * 2 + b.depthNorm;
        return pb - pa;
      });

    ctx.save();
    for (const n of candidates) {
      const e = n.entry;
      const isHovered = state.hoveredNodeId === e.id;
      const fontSize = e.tier === 1 || isHovered ? 11.5 : 10.8;
      ctx.font = `${e.tier === 1 || isHovered ? 600 : 500} ${fontSize}px "PingFang SC", "Microsoft YaHei", sans-serif`;
      const tw = ctx.measureText(e.title).width;
      const boxW = tw + (isA ? 20 : 13);
      const boxH = 19;

      // 默认优先朝背离所在星域中心的外侧方向排布
      const dx = n.x - n.setProj.x;
      const preferRight = dx >= -4;

      // 6 个候选方位（右、左、上、下、右上、左上）择优避让
      const offsets = preferRight
        ? [
            { lx: n.x + n.radius + 7 + boxW * 0.5, ly: n.y, side: 'right' },
            { lx: n.x - n.radius - 7 - boxW * 0.5, ly: n.y, side: 'left' },
            { lx: n.x, ly: n.y - n.radius - 12, side: 'top' },
            { lx: n.x, ly: n.y + n.radius + 12, side: 'bottom' },
            { lx: n.x + n.radius + 5 + boxW * 0.5, ly: n.y - 14, side: 'right' },
            { lx: n.x - n.radius - 5 - boxW * 0.5, ly: n.y + 14, side: 'left' }
          ]
        : [
            { lx: n.x - n.radius - 7 - boxW * 0.5, ly: n.y, side: 'left' },
            { lx: n.x + n.radius + 7 + boxW * 0.5, ly: n.y, side: 'right' },
            { lx: n.x, ly: n.y - n.radius - 12, side: 'top' },
            { lx: n.x, ly: n.y + n.radius + 12, side: 'bottom' },
            { lx: n.x - n.radius - 5 - boxW * 0.5, ly: n.y - 14, side: 'left' },
            { lx: n.x + n.radius + 5 + boxW * 0.5, ly: n.y + 14, side: 'right' }
          ];

      let chosen = null;
      for (const cand of offsets) {
        const rect = {
          x1: cand.lx - boxW * 0.5 - 2,
          y1: cand.ly - boxH * 0.5 - 2,
          x2: cand.lx + boxW * 0.5 + 2,
          y2: cand.ly + boxH * 0.5 + 2
        };
        const hit = occupiedBoxes.some(b => !(rect.x2 < b.x1 || rect.x1 > b.x2 || rect.y2 < b.y1 || rect.y1 > b.y2));
        if (!hit) {
          chosen = { ...cand, rect };
          break;
        }
      }
      if (!chosen && isHovered) {
        const cand = offsets[0];
        chosen = { ...cand, rect: { x1: cand.lx - boxW * 0.5, y1: cand.ly - boxH * 0.5, x2: cand.lx + boxW * 0.5, y2: cand.ly + boxH * 0.5 } };
      }
      if (!chosen) continue;

      const depthFadeA = isA && e.tier > 1 && !isHovered ? clamp((n.depthNorm - 0.30) / 0.38, 0, 1) : 1;
      if (isA && depthFadeA < 0.05) continue;
      occupiedBoxes.push(chosen.rect);
      const alpha = clamp(e.labelAlpha * e.focusWeight * (0.62 + 0.38 * n.depthNorm) * depthFadeA, 0, 1);

      if (isA) {
        n.labelRectA = chosen.rect;
        const starCol = e.mineralA?.tint || '#E8C688';
        const isEntryFocused = isHovered || state.focusedSetId === n.set.id;
        // 方案 A：文字维持象牙暖白干净可读 + 左侧点缀 2.5px 专属矿物微星标 + 引线/悬停底托线呼应矿物微光
        const textCenterX = chosen.lx + 3.5;
        const pipX = textCenterX - tw * 0.5 - 6.5;
        const pipY = chosen.ly;
        const attachX = clamp(n.x, chosen.lx - tw * 0.5 - 7, chosen.lx + tw * 0.5 + 3);
        const attachY = chosen.ly + (e.tier === 1 || isHovered ? 8.5 : 0);
        const ldx = attachX - n.x, ldy = attachY - n.y;
        const lDist = Math.hypot(ldx, ldy) || 1;
        const startOffset = Math.min(lDist * 0.72, (n.outerVisRA || n.radius * 1.25) + 2.2);
        const sx = n.x + (ldx / lDist) * startOffset;
        const sy = n.y + (ldy / lDist) * startOffset;

        if (lDist > startOffset + 1.5) {
          const leadG = ctx.createLinearGradient(sx, sy, attachX, attachY);
          leadG.addColorStop(0, hexToRgba(starCol, alpha * (isHovered ? 0.36 : 0.20)));
          leadG.addColorStop(1, hexToRgba(isHovered ? starCol : '#E8C688', alpha * (isHovered ? 0.90 : 0.62)));
          ctx.strokeStyle = leadG;
          ctx.lineWidth = isHovered ? 0.80 : 0.60;
          ctx.globalAlpha = 1;
          ctx.beginPath();
          ctx.moveTo(sx, sy);
          ctx.lineTo(attachX, attachY);
          ctx.stroke();
        }
        if (e.tier === 1 || isHovered || isEntryFocused) {
          // 悬停/聚焦亮起专属矿物微光底托游丝；一等主曜常态带克制底托线
          const ulCol = isHovered ? starCol : (isEntryFocused ? starCol : '#E8C688');
          const ulG = ctx.createLinearGradient(pipX - 3, attachY, textCenterX + tw * 0.52, attachY);
          ulG.addColorStop(0.0, hexToRgba(starCol, 0));
          ulG.addColorStop(0.22, hexToRgba(ulCol, alpha * (isHovered ? 0.88 : 0.52)));
          ulG.addColorStop(0.80, hexToRgba(ulCol, alpha * (isHovered ? 0.84 : 0.46)));
          ulG.addColorStop(1.0, hexToRgba(ulCol, 0));
          ctx.strokeStyle = ulG;
          ctx.lineWidth = isHovered ? 0.85 : 0.58;
          ctx.globalAlpha = 1;
          ctx.beginPath();
          ctx.moveTo(pipX - 3, chosen.ly + 8.5);
          ctx.lineTo(textCenterX + tw * 0.52, chosen.ly + 8.5);
          ctx.stroke();
        }

        // 文字前 2.5px 专属矿物色微星标（轻量四芒微珠 + 柔和光息）
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        ctx.fillStyle = hexToRgba(starCol, alpha * (isHovered ? 0.72 : 0.44));
        ctx.beginPath();
        ctx.arc(pipX, pipY, isHovered ? 3.2 : 2.5, 0, TAU);
        ctx.fill();
        ctx.globalCompositeOperation = 'source-over';
        ctx.fillStyle = starCol;
        ctx.globalAlpha = alpha * (isHovered ? 1.0 : 0.90);
        ctx.beginPath();
        ctx.moveTo(pipX, pipY - 1.55);
        ctx.lineTo(pipX + 1.55, pipY);
        ctx.lineTo(pipX, pipY + 1.55);
        ctx.lineTo(pipX - 1.55, pipY);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = '#FFFDF8';
        ctx.beginPath();
        ctx.arc(pipX, pipY, 0.55, 0, TAU);
        ctx.fill();
        ctx.restore();

        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.shadowColor = 'rgba(8, 7, 6, 0.98)';
        ctx.shadowBlur = 8;
        ctx.font = `${e.tier === 1 || isHovered ? 600 : 500} ${fontSize}px ${e.tier === 1 ? '"Noto Serif SC", "PingFang SC", serif' : '"PingFang SC", "Microsoft YaHei", sans-serif'}`;
        ctx.fillStyle = isHovered ? '#FFFDF8' : (e.tier === 1 ? '#F7F0E2' : '#E6D8C0');
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(e.title, textCenterX, chosen.ly);
        ctx.fillText(e.title, textCenterX, chosen.ly);
        ctx.restore();
      } else {
        // 方案 B：去胶囊化！不画任何胶囊底盒，采用精密测绘短引线 + 高对比冷白字 + 深空暗晕
        const attachX = clamp(n.x, chosen.lx - tw * 0.5 - 3, chosen.lx + tw * 0.5 + 3);
        const attachY = chosen.ly + (e.tier === 1 || isHovered ? 8.5 : 0);

        ctx.globalAlpha = alpha * (isHovered ? 0.92 : 0.62);
        ctx.strokeStyle = isHovered ? '#47D7E8' : n.set.coldHue;
        ctx.lineWidth = isHovered ? 1.0 : 0.72;
        ctx.beginPath();
        ctx.moveTo(n.x, n.y);
        ctx.lineTo(attachX, attachY);
        if (e.tier === 1 || isHovered) {
          // 核心条目与悬停条目带一条极细底部测绘托线
          ctx.moveTo(chosen.lx - tw * 0.5, chosen.ly + 8.5);
          ctx.lineTo(chosen.lx + tw * 0.5, chosen.ly + 8.5);
        }
        ctx.stroke();

        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.shadowColor = '#04070D';
        ctx.shadowBlur = 6;
        ctx.fillStyle = isHovered ? '#FFFFFF' : (e.tier === 1 ? '#EAF3FF' : '#d6e6fa');
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        // 双遍微暗晕叠印确保无底框时在网格线上依然锐利清晰
        ctx.fillText(e.title, chosen.lx, chosen.ly);
        ctx.fillText(e.title, chosen.lx, chosen.ly);
        ctx.restore();
      }
    }
    ctx.restore();
  }

  function hexToRgba(hex, a) {
    const r = parseInt(hex.slice(1, 3), 16);
    const g = parseInt(hex.slice(3, 5), 16);
    const b = parseInt(hex.slice(5, 7), 16);
    return `rgba(${r}, ${g}, ${b}, ${a})`;
  }

  /* ==================== 8. 拾取测试（节点 / 星域 / 星域圆边热区 / 关系贝塞尔弧线） ==================== */
  function distToSegment(px, py, ax, ay, bx, by) {
    const dx = bx - ax, dy = by - ay;
    const lenSq = dx * dx + dy * dy;
    if (!lenSq) return Math.hypot(px - ax, py - ay);
    const t = clamp(((px - ax) * dx + (py - ay) * dy) / lenSq, 0, 1);
    return Math.hypot(px - (ax + t * dx), py - (ay + t * dy));
  }

  function pickAt(x, y) {
    // 1. 优先拾取条目圆
    const nodesDesc = [...frameCache.nodes].sort((a, b) => b.z - a.z);
    for (const n of nodesDesc) {
      if (Math.hypot(x - n.x, y - n.y) <= Math.max(n.radius + 5, 10)) {
        return { kind: 'node', item: n };
      }
    }

    // 2. 拾取设定集外环边线缩放热区 (|dist - R| <= 8.5px)
    const setsDesc = [...frameCache.sets].sort((a, b) => b.z - a.z);
    for (const s of setsDesc) {
      const d = Math.hypot(x - s.x, y - s.y);
      if (Math.abs(d - s.radius) <= 8.5) {
        return { kind: 'rim', item: s };
      }
    }

    // 3. 拾取设定集底部铭牌
    for (const s of setsDesc) {
      if (s.labelBox) {
        const { x: lx, y: ly, w, h } = s.labelBox;
        if (Math.abs(x - lx) <= w * 0.5 && Math.abs(y - ly) <= h * 0.5) {
          return { kind: 'set-label', item: s };
        }
      }
    }

    // 4. 拾取关系贝塞尔曲线
    let bestRel = null, bestDist = 7.5;
    for (const rc of frameCache.relCurves) {
      if (rc.rel.focusWeight < 0.15) continue;
      const pts = rc.samples;
      for (let i = 0; i < pts.length - 1; i++) {
        const d = distToSegment(x, y, pts[i].x, pts[i].y, pts[i + 1].x, pts[i + 1].y);
        if (d < bestDist) {
          bestDist = d;
          bestRel = rc;
        }
      }
    }
    if (bestRel) return { kind: 'relation', item: bestRel };

    // 5. 拾取设定集星域内部
    for (const s of setsDesc) {
      if (Math.hypot(x - s.x, y - s.y) < s.radius) {
        return { kind: 'set', item: s };
      }
    }
    return null;
  }

  /* ==================== 9. 交互事件与层级导航联动 ==================== */
  let pointerDown = null;
  const floatingCard = document.getElementById('floatingCard');
  const resizeBadge = document.getElementById('resizeBadge');

  function setGestureIndicator(name) {
    state.activeGesture = name;
    const guide = document.getElementById('gestureGuide');
    guide.classList.toggle('is-active', Boolean(name));
    guide.querySelectorAll('.guide-item').forEach(el => {
      el.classList.toggle('on', el.dataset.guide === name);
    });
  }

  function updateFloatingCard(pick, clientX, clientY) {
    if (!pick || (pick.kind !== 'node' && pick.kind !== 'relation')) {
      floatingCard.hidden = true;
      return;
    }
    const metaEl = document.getElementById('cardMeta');
    if (pick.kind === 'node') {
      const e = pick.item.entry;
      const s = pick.item.set;
      const deg = (nodeLinks.get(e.id) || []).length;
      const palA = e.mineralA;
      const kindText = state.scheme === 'a'
        ? (e.tier === 1 ? '星官枢要 · ' : '星垣条目 · ') + s.title
        : s.title + (e.tier === 1 ? ' · 核心枢纽' : ' · 条目');
      document.getElementById('cardKind').textContent = kindText;
      if (state.scheme === 'a' && palA) {
        metaEl.textContent = `◆ ${palA.name} · ${deg} 脉关联`;
        metaEl.style.color = palA.tint;
        floatingCard.style.borderColor = hexToRgba(palA.tint, 0.52);
      } else {
        metaEl.textContent = `${deg} 条关联`;
        metaEl.style.color = '';
        floatingCard.style.borderColor = '';
      }
      document.getElementById('cardTitle').textContent = e.title;
      document.getElementById('cardDesc').textContent = e.desc;
      floatingCard.style.left = clamp(pick.item.x, 140, viewSize.width - 140) + 'px';
      floatingCard.style.top = Math.max(85, pick.item.y - pick.item.radius) + 'px';
      floatingCard.hidden = false;
    } else if (pick.kind === 'relation') {
      const rel = pick.item.rel;
      const palA = rel.fromNode?.mineralA;
      const relKindText = state.scheme === 'a'
        ? (rel.kind === 'cross' ? '天河跨渡' : '星垣内脉 · ' + rel.fromNode.set.title)
        : (rel.kind === 'cross' ? '跨集关系' : '集内关系 · ' + rel.fromNode.set.title);
      document.getElementById('cardKind').textContent = relKindText;
      metaEl.textContent = rel.label;
      if (state.scheme === 'a' && palA) {
        metaEl.style.color = palA.tint;
        floatingCard.style.borderColor = hexToRgba(palA.tint, 0.44);
      } else {
        metaEl.style.color = '';
        floatingCard.style.borderColor = '';
      }
      document.getElementById('cardTitle').innerHTML = `<span>${rel.fromNode.title}</span><span class="arrow">── ${rel.label} ──›</span><span>${rel.toNode.title}</span>`;
      document.getElementById('cardDesc').textContent = rel.desc;
      floatingCard.style.left = clamp(pick.item.midPt.x, 160, viewSize.width - 160) + 'px';
      floatingCard.style.top = Math.max(92, pick.item.midPt.y) + 'px';
      floatingCard.hidden = false;
    }
  }

  canvas.addEventListener('pointerdown', e => {
    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left, y = e.clientY - rect.top;
    try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
    const pick = pickAt(x, y);

    if (e.button === 0 && pick?.kind === 'rim') {
      const sItem = pick.item;
      state.resizingSetId = sItem.set.id;
      pointerDown = {
        mode: 'resize',
        set: sItem.set,
        centerX: sItem.x,
        centerY: sItem.y,
        startDist: Math.max(20, Math.hypot(x - sItem.x, y - sItem.y)),
        startScale: sItem.set.targetDomainScale,
        moved: false
      };
      viewportEl.classList.add('is-resizing');
      setGestureIndicator('resize');
      return;
    }

    const isPan = e.button === 1 || e.button === 2 || e.shiftKey;
    pointerDown = {
      mode: isPan ? 'pan' : 'rotate',
      startX: x,
      startY: y,
      lastX: x,
      lastY: y,
      moved: false,
      pick
    };
    viewportEl.classList.add(isPan ? 'is-panning' : 'is-rotating');
    setGestureIndicator(isPan ? 'pan' : 'rotate');
  });

  canvas.addEventListener('pointermove', e => {
    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left, y = e.clientY - rect.top;

    if (pointerDown) {
      const dx = x - pointerDown.lastX, dy = y - pointerDown.lastY;
      if (Math.hypot(x - pointerDown.startX, y - pointerDown.startY) > 4) pointerDown.moved = true;
      pointerDown.lastX = x;
      pointerDown.lastY = y;

      if (pointerDown.mode === 'resize') {
        const curDist = Math.max(16, Math.hypot(x - pointerDown.centerX, y - pointerDown.centerY));
        const newScale = clamp(pointerDown.startScale * (curDist / pointerDown.startDist), 0.62, 1.85);
        pointerDown.set.targetDomainScale = newScale;
        relaxSetEntries(pointerDown.set);
        resizeBadge.textContent = `${pointerDown.set.title} · 星域半径 ${Math.round(newScale * 100)}%`;
        resizeBadge.style.left = pointerDown.centerX + 'px';
        resizeBadge.style.top = (pointerDown.centerY - curDist - 18) + 'px';
        resizeBadge.hidden = false;
        document.getElementById('resetRadiiBtn').hidden = false;
      } else if (pointerDown.mode === 'rotate' && pointerDown.moved) {
        if (state.scheme === 'a') {
          // 方案 A 专属：四元数 360° 全向无死角自由球面旋转（解除 Pitch 上下限与万向节死锁）
          const qPitch = quatFromAxisAngle(1, 0, 0, dy * 0.0065);
          const qYaw = quatFromAxisAngle(0, 1, 0, dx * 0.0065);
          state.targetQuatA = quatMultiply(quatMultiply(qPitch, qYaw), state.targetQuatA);
          state.velYawA = dx * 0.00036;
          state.velPitchA = dy * 0.00036;
        } else {
          // 方案 B：严格保留原有欧拉角旋转与 Pitch 边界
          state.targetYaw += dx * 0.0065;
          state.targetPitch = clamp(state.targetPitch + dy * 0.0055, -1.15, 1.15);
          state.velYaw = dx * 0.00035;
          state.velPitch = dy * 0.0003;
        }
      } else if (pointerDown.mode === 'pan' && pointerDown.moved) {
        state.targetPanX += dx;
        state.targetPanY += dy;
      }
      return;
    }

    const pick = pickAt(x, y);
    state.hoveredNodeId = pick?.kind === 'node' ? pick.item.entry.id : '';
    state.hoveredRelId = pick?.kind === 'relation' ? pick.item.rel.id : '';
    state.rimHoverSetId = pick?.kind === 'rim' ? pick.item.set.id : '';
    state.hoveredSetId = (pick?.kind === 'set' || pick?.kind === 'set-label' || pick?.kind === 'rim')
      ? pick.item.set.id
      : (pick?.kind === 'node' ? pick.item.set.id : '');

    viewportEl.classList.toggle('is-rim-hover', Boolean(state.rimHoverSetId));
    viewportEl.classList.toggle('is-pointer', Boolean(pick && pick.kind !== 'rim'));
    setGestureIndicator(state.rimHoverSetId ? 'resize' : '');
    updateFloatingCard(pick, e.clientX, e.clientY);
  });

  function endPointer(e) {
    viewportEl.classList.remove('is-rotating', 'is-panning', 'is-resizing');
    resizeBadge.hidden = true;
    if (!pointerDown) return;
    const pd = pointerDown;
    pointerDown = null;
    setGestureIndicator('');

    if (!pd.moved && e.button === 0) {
      const pick = pd.pick;
      if (!pick) {
        if (state.focusedSetId) focusOnSet('');
      } else if (pick.kind === 'set' || pick.kind === 'set-label') {
        focusOnSet(state.focusedSetId === pick.item.set.id ? '' : pick.item.set.id);
      } else if (pick.kind === 'node') {
        focusOnSet(pick.item.set.id);
      }
    }
  }
  canvas.addEventListener('pointerup', endPointer);
  canvas.addEventListener('pointercancel', endPointer);
  canvas.addEventListener('contextmenu', e => e.preventDefault());

  let wheelTimer = null;
  canvas.addEventListener('wheel', e => {
    e.preventDefault();
    state.targetZoom = clamp(state.targetZoom * Math.exp(-e.deltaY * 0.0014), 0.58, 2.65);
    setGestureIndicator('zoom');
    clearTimeout(wheelTimer);
    wheelTimer = setTimeout(() => setGestureIndicator(''), 420);
  }, { passive: false });

  /* ==================== 10. 聚焦下钻、层级导航与顶部方案切换 ==================== */
  function focusOnSet(setId) {
    state.focusedSetId = setId;
    const set = setsById.get(setId);
    const crumbRoot = document.getElementById('crumbRoot');
    const crumbSep = document.getElementById('crumbSep');
    const crumbFocused = document.getElementById('crumbFocused');

    if (!set) {
      state.targetZoom = 1.0;
      state.targetPanX = 0;
      state.targetPanY = 0;
      document.getElementById('viewTitle').textContent = '设定集总览';
      document.getElementById('statSets').textContent = String(LORE_SETS.length);
      document.getElementById('statNodes').textContent = String(nodesById.size);
      document.getElementById('statCross').textContent = String(CROSS_RELATIONS.length);
      crumbRoot.classList.add('is-current');
      crumbSep.hidden = true;
      crumbFocused.hidden = true;
    } else {
      const angle = set.phase + state.orbitalTime * set.orbitSpeed;
      const [wx, wy, wz] = setWorldPos(set, angle, state.scheme === 'a');
      state.targetZoom = 1.52;
      // 计算该星域在目标缩放下的相机偏移，使其平滑推镜至画布中心
      const p0 = project3D(wx, wy, wz, viewSize.width, viewSize.height);
      const dx = (p0.x - state.panX) - viewSize.width * 0.5;
      const dy = (p0.y - state.panY) - viewSize.height * 0.52;
      const ratio = state.targetZoom / state.zoom;
      state.targetPanX = -dx * ratio;
      state.targetPanY = -dy * ratio;

      const crossCount = CROSS_RELATIONS.filter(r => nodesById.get(r.from)?.setId === set.id || nodesById.get(r.to)?.setId === set.id).length;
      document.getElementById('viewTitle').textContent = set.title;
      document.getElementById('statSets').textContent = '1';
      document.getElementById('statNodes').textContent = String(set.entries.length);
      document.getElementById('statCross').textContent = String(crossCount);
      crumbRoot.classList.remove('is-current');
      crumbSep.hidden = false;
      crumbFocused.hidden = false;
      crumbFocused.textContent = set.title;
    }

    document.querySelectorAll('.domain-chip').forEach(btn => {
      btn.classList.toggle('is-active', btn.dataset.setId === setId);
    });
  }

  // 初始化右上层级导航快捷星域胶囊
  const quickNavEl = document.getElementById('domainQuickNav');
  for (const s of LORE_SETS) {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'domain-chip' + (s.entries.length === 0 ? ' is-empty' : '');
    btn.dataset.setId = s.id;
    btn.style.setProperty('--chip-color', s.hueB);
    btn.innerHTML = `<i aria-hidden="true"></i><span>${s.title}</span><small>${s.entries.length}</small>`;
    btn.addEventListener('click', () => focusOnSet(state.focusedSetId === s.id ? '' : s.id));
    btn.addEventListener('pointerenter', () => { state.hoveredSetId = s.id; });
    btn.addEventListener('pointerleave', () => { if (state.hoveredSetId === s.id) state.hoveredSetId = ''; });
    quickNavEl.appendChild(btn);
  }
  document.getElementById('crumbRoot').addEventListener('click', () => focusOnSet(''));

  // 顶部双方案切换器
  function setScheme(scheme) {
    state.scheme = scheme === 'b' ? 'b' : 'a';
    document.body.dataset.scheme = state.scheme;
    floatingCard.style.borderColor = '';
    const metaEl = document.getElementById('cardMeta');
    if (metaEl) metaEl.style.color = '';
    const setsLbl = document.getElementById('statSetsLabel');
    const nodesLbl = document.getElementById('statNodesLabel');
    const crossLbl = document.getElementById('statCrossLabel');
    const hierLbl = document.getElementById('hierarchyLabel');
    const crumbRoot = document.getElementById('crumbRoot');
    if (setsLbl && nodesLbl && crossLbl) {
      if (state.scheme === 'a') {
        setsLbl.textContent = '星野';
        nodesLbl.textContent = '星曜';
        crossLbl.textContent = '星渡';
        if (hierLbl) hierLbl.textContent = '星野卷目';
        if (crumbRoot) crumbRoot.textContent = '卷首';
      } else {
        setsLbl.textContent = '设定集';
        nodesLbl.textContent = '条目';
        crossLbl.textContent = '跨集关系';
        if (hierLbl) hierLbl.textContent = '层级导航';
        if (crumbRoot) crumbRoot.textContent = '全书总览';
      }
    }
    document.querySelectorAll('[data-scheme-btn]').forEach(btn => {
      btn.setAttribute('aria-selected', String(btn.dataset.schemeBtn === state.scheme));
    });
    document.querySelectorAll('.domain-chip').forEach(btn => {
      const s = setsById.get(btn.dataset.setId);
      if (s) btn.style.setProperty('--chip-color', state.scheme === 'a' ? (s.mineralA || s.hueA) : s.coldHue);
    });
  }
  document.querySelectorAll('[data-scheme-btn]').forEach(btn => {
    btn.addEventListener('click', () => setScheme(btn.dataset.schemeBtn));
  });

  // 左上图例点击过滤与悬停单层高亮
  document.querySelectorAll('.legend-pill').forEach(btn => {
    const layer = btn.dataset.layer;
    btn.addEventListener('click', () => {
      state.layers[layer] = !state.layers[layer];
      btn.setAttribute('aria-pressed', String(state.layers[layer]));
    });
    btn.addEventListener('pointerenter', () => { state.soloLayer = layer; });
    btn.addEventListener('pointerleave', () => { state.soloLayer = ''; });
  });

  // 右下视角控制
  function resetCameraOrientation() {
    focusOnSet('');
    if (state.scheme === 'a') {
      state.targetQuatA = [...DEFAULT_QUAT_A];
      state.velYawA = 0;
      state.velPitchA = 0;
    } else {
      state.targetYaw = -0.28;
      state.targetPitch = 0.44;
      state.velYaw = 0;
      state.velPitch = 0;
    }
    state.targetPanX = 0;
    state.targetPanY = 0;
    state.targetZoom = 1.0;
  }
  document.getElementById('zoomInBtn').addEventListener('click', () => {
    state.targetZoom = clamp(state.targetZoom * 1.2, 0.58, 2.65);
  });
  document.getElementById('zoomOutBtn').addEventListener('click', () => {
    state.targetZoom = clamp(state.targetZoom / 1.2, 0.58, 2.65);
  });
  document.getElementById('zoomResetBtn').addEventListener('click', resetCameraOrientation);
  document.getElementById('orientResetBtnA').addEventListener('click', resetCameraOrientation);
  document.getElementById('resetRadiiBtn').addEventListener('click', e => {
    LORE_SETS.forEach(s => { s.targetDomainScale = 1.0; });
    e.currentTarget.hidden = true;
  });

  /* ==================== 11. 尺寸自适应与 60fps 主循环 ==================== */
  function resizeCanvas() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const width = viewportEl.clientWidth;
    const height = viewportEl.clientHeight;
    viewSize = { width, height, dpr };
    canvas.width = Math.max(1, Math.round(width * dpr));
    canvas.height = Math.max(1, Math.round(height * dpr));
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  new ResizeObserver(resizeCanvas).observe(viewportEl);
  resizeCanvas();

  // 解析 URL 参数或 Hash 预设方案
  const params = new URLSearchParams(location.search || location.hash.slice(1));
  if (params.get('scheme')) setScheme(params.get('scheme'));
  else setScheme(DEFAULT_SCHEME);
  if (params.get('focus')) focusOnSet(params.get('focus'));

  const compassNeedleA = document.getElementById('compassNeedleA');
  const DEFAULT_QUAT_A_CONJ = [-DEFAULT_QUAT_A[0], -DEFAULT_QUAT_A[1], -DEFAULT_QUAT_A[2], DEFAULT_QUAT_A[3]];
  let lastNow = performance.now();
  function tick(now) {
    const dt = Math.min(40, now - lastNow);
    lastNow = now;
    state.clock += dt;

    // 静息轨道微速漂移（鼠标交互或悬停星体时平滑减速静止）
    const isInteracting = Boolean(pointerDown || state.hoveredNodeId || state.hoveredSetId || state.hoveredRelId || state.rimHoverSetId || state.focusedSetId);
    state.idleFactor = lerp(state.idleFactor, isInteracting ? 0.0 : 1.0, 1 - Math.exp(-dt / 180));
    state.orbitalTime += dt * state.idleFactor;

    // 物理阻尼惯性（方案 A 四元数 360° 球面阻尼 vs 方案 B 原始欧拉阻尼）
    if (!pointerDown) {
      if (state.scheme === 'a' && (Math.abs(state.velYawA) > 1e-5 || Math.abs(state.velPitchA) > 1e-5)) {
        const qPitch = quatFromAxisAngle(1, 0, 0, state.velPitchA * dt);
        const qYaw = quatFromAxisAngle(0, 1, 0, state.velYawA * dt);
        state.targetQuatA = quatMultiply(quatMultiply(qPitch, qYaw), state.targetQuatA);
        const decay = Math.exp(-dt / 145);
        state.velYawA *= decay;
        state.velPitchA *= decay;
      } else if (state.scheme === 'b' && (Math.abs(state.velYaw) > 1e-5 || Math.abs(state.velPitch) > 1e-5)) {
        state.targetYaw += state.velYaw * dt;
        state.targetPitch = clamp(state.targetPitch + state.velPitch * dt, -1.15, 1.15);
        const decay = Math.exp(-dt / 140);
        state.velYaw *= decay;
        state.velPitch *= decay;
      }
    }

    const camEase = 1 - Math.exp(-dt / 65);
    state.quatA = quatSlerp(state.quatA, state.targetQuatA, camEase);
    state.yaw = lerp(state.yaw, state.targetYaw, camEase);
    state.pitch = lerp(state.pitch, state.targetPitch, camEase);
    state.panX = lerp(state.panX, state.targetPanX, camEase);
    state.panY = lerp(state.panY, state.targetPanY, camEase);
    state.zoom = lerp(state.zoom, state.targetZoom, camEase);

    // 方案 A 专属：右下角黄铜罗盘磁针实时联动当前 360° 视角方位角
    if (state.scheme === 'a' && compassNeedleA) {
      const qRel = quatMultiply(state.quatA, DEFAULT_QUAT_A_CONJ);
      const eVec = rotateVecByQuat(1, 0, 0, qRel);
      const uVec = rotateVecByQuat(0, 1, 0, qRel);
      const yawRad = Math.atan2(-eVec[2], eVec[0]);
      const rollRad = Math.atan2(eVec[1], Math.hypot(eVec[0], eVec[2]));
      const pitchCue = Math.atan2(uVec[2], uVec[1]) * 0.25;
      const deg = ((yawRad + rollRad * 0.5 + pitchCue) * 180) / Math.PI;
      compassNeedleA.setAttribute('transform', `rotate(${deg.toFixed(2)} 22 22)`);
    }

    document.getElementById('zoomResetBtn').textContent = Math.round(state.zoom * 100) + '%';

    updateFocusWeights(dt);
    renderScene();
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
