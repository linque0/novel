            const meshY = gravityWellY(wx, wz, projectedSets);
            shadowSamples.push(project3D(wx, meshY, wz, width, height));
          }
          const midPt = samples[Math.floor(samples.length / 2)];
          relCurves.push({ rel, a, b, samples, midPt });

          ctx.save();
          // 1. 底部引力网格表面投影虚线弧（Ground Shadow Arc）
          const showGroundShadow = isActive || state.soloLayer === 'cross' || rel.focusWeight > 0.25;
          if (showGroundShadow) {
            ctx.beginPath();
            for (let i = 0; i < shadowSamples.length; i++) {
              const sp = shadowSamples[i];
              if (i === 0) ctx.moveTo(sp.x, sp.y);
              else ctx.lineTo(sp.x, sp.y);
            }
            ctx.setLineDash([2.5, 4]);
            ctx.strokeStyle = isActive ? '#47D7E8' : '#7aa4cc';
            ctx.lineWidth = isActive ? 1.05 : 0.75;
            ctx.globalAlpha = alpha * (isActive ? 0.52 : 0.22);
            ctx.stroke();

            // 高亮时在弧顶向地面投影垂下一条极淡测高对位虚线
            if (isActive) {
              const shadowMid = shadowSamples[Math.floor(shadowSamples.length / 2)];
              ctx.setLineDash([1.5, 3.5]);
              ctx.strokeStyle = '#47D7E8';
              ctx.lineWidth = 0.7;
              ctx.globalAlpha = alpha * 0.36;
              ctx.beginPath();
              ctx.moveTo(midPt.x, midPt.y);
              ctx.lineTo(shadowMid.x, shadowMid.y);
              ctx.stroke();
            }
            ctx.setLineDash([]);
          }

          // 2. 高空三维抛物跃迁光带外层冷青/欧泊折射柔晕
          ctx.beginPath();
          for (let i = 0; i < samples.length; i++) {
            const pt = samples[i];
            if (i === 0) ctx.moveTo(pt.x, pt.y);
            else ctx.lineTo(pt.x, pt.y);
          }
          ctx.strokeStyle = isActive ? '#47D7E8' : '#8C7BFF';
          ctx.lineWidth = isActive ? 4.4 : 2.6;
          ctx.globalAlpha = alpha * (isActive ? 0.26 : 0.12);
          ctx.stroke();

          // 3. 高空抛物线锐利核心光线
          ctx.strokeStyle = isActive ? '#EAF3FF' : '#65d6e8';
          ctx.lineWidth = isActive ? 1.65 : 1.0;
          ctx.globalAlpha = alpha * (isActive ? 1.0 : 0.85);
          ctx.stroke();

          // 4. 定向流光棱晶脉冲微粒
          if (isActive || rel.focusWeight > 0.34) {
            const u = (state.clock * 0.00036 + rel.phase) % 1;
            drawCrystalPulse(ctx, samples, u, '#EAF3FF', '#47D7E8', isActive ? 3.2 : 2.2);
          }
          ctx.restore();
        }
      }
    }

    /* ---------- 5.7 按 Z 轴绘制条目节点（方案 A 黑曜琉璃圆 vs 方案 B 锐利四芒菱晶） ---------- */
    const sortedNodes = [...projectedNodes].sort((a, b) => a.z - b.z);
    for (const nItem of sortedNodes) {
      if (isA) drawAstrolabeNode(ctx, nItem);
      else drawTopologyCrystalNode(ctx, nItem);
    }

    /* ---------- 5.8 设定集铭牌与外置防碰撞条目微标签（方案 A 胶囊铭牌 vs 方案 B 去胶囊化测绘引线排印） ---------- */
    drawLabelsWithCollisionAvoidance(ctx, sortedSets, sortedNodes, relCurves, isA, width, height);

    frameCache = { sets: projectedSets, nodes: projectedNodes, relCurves, center: centerProj, labelBoxesA: frameCache.labelBoxesA || [] };
    if (isA) {
      const boxes = projectedSets
        .filter(s => s.labelBox)
        .map(s => ({
          x1: s.labelBox.x - s.labelBox.w * 0.5,
          y1: s.labelBox.y - s.labelBox.h * 0.5,
          x2: s.labelBox.x + s.labelBox.w * 0.5,
          y2: s.labelBox.y + s.labelBox.h * 0.5
        }));
      for (const n of projectedNodes) {
        if (n.labelRectA) boxes.push(n.labelRectA);
      }
      if (centerProj.titleBoxA) boxes.push(centerProj.titleBoxA);
      frameCache.labelBoxesA = boxes;
    }
  }

  /* ==================== 6. 方案 A 与方案 B 专属图元绘制函数 ==================== */

  // 二十四节气（自春分 0° 起逆布黄赤周天）
  const SOLAR_TERMS_24 = [
    '春分', '清明', '谷雨', '立夏', '小满', '芒种',
    '夏至', '小暑', '大暑', '立秋', '处暑', '白露',
    '秋分', '寒露', '霜降', '立冬', '小雪', '大雪',
    '冬至', '小寒', '大寒', '立春', '雨水', '惊蛰'
  ];
  // 十二辰地支方位
  const EARTHLY_BRANCHES_12 = ['卯', '辰', '巳', '午', '未', '申', '酉', '戌', '亥', '子', '丑', '寅'];
  // 二十八宿四象星官单字微刻
  const LUNAR_MANSIONS_28 = [
    '角', '亢', '氐', '房', '心', '尾', '箕',
    '斗', '牛', '女', '虚', '危', '室', '壁',
    '奎', '娄', '胃', '昴', '毕', '觜', '参',
    '井', '鬼', '柳', '星', '张', '翼', '轸'
  ];

  function drawAstrolabeDeckAndPlumbs(ctx, w, h, projectedSets, projectedNodes, centerProj) {
    ctx.save();
    // 0. 黑漆洒金 × 松烟云气（4%–7% 缓慢流动松烟淡墨星云暗纹 + 极稀疏漂浮泥金尘粒）
    const driftT = state.clock * 0.000038;
    const nebShifts = [
      { cx: w * 0.34 + Math.cos(driftT) * 28, cy: h * 0.38 + Math.sin(driftT * 0.8) * 18, rx: w * 0.42, col: 'rgba(72, 56, 38, 0.068)', col2: 'rgba(34, 29, 24, 0.042)' },
      { cx: w * 0.68 + Math.sin(driftT * 0.9) * 24, cy: h * 0.62 + Math.cos(driftT * 0.7) * 20, rx: w * 0.38, col: 'rgba(54, 48, 42, 0.058)', col2: 'rgba(84, 62, 34, 0.036)' },
      { cx: w * 0.50 + Math.cos(driftT * 0.6 + 1.4) * 22, cy: h * 0.24 + Math.sin(driftT) * 14, rx: w * 0.32, col: 'rgba(66, 54, 39, 0.050)', col2: 'rgba(28, 25, 22, 0.025)' }
    ];
    for (const neb of nebShifts) {
      const ng = ctx.createRadialGradient(neb.cx, neb.cy, neb.rx * 0.08, neb.cx, neb.cy, neb.rx);
      ng.addColorStop(0, neb.col);
      ng.addColorStop(0.55, neb.col2);
      ng.addColorStop(1, 'rgba(8, 7, 6, 0)');
      ctx.fillStyle = ng;
      ctx.fillRect(0, 0, w, h);
    }

    // 1. 远景松烟墨场中的稀疏漂浮泥金尘粒（随四元数视角产生柔和视差）
    const qShiftX = (state.quatA[1] * 210 + state.panX * 0.22);
    const qShiftY = (state.quatA[0] * 170 + state.panY * 0.22);
    for (let i = 0; i < 42; i++) {
      const p = STARDUST[i];
      const breathe = 0.72 + 0.28 * Math.sin(state.clock * 0.0012 + p.phase);
      const x = ((p.x * w + qShiftX * p.depth + Math.sin(driftT + i) * 6) % w + w) % w;
      const y = ((p.y * h + qShiftY * p.depth + Math.cos(driftT * 0.8 + i) * 5) % h + h) % h;
      ctx.globalAlpha = (0.045 + (i % 4) * 0.024) * breathe;
      ctx.fillStyle = i % 4 === 0 ? '#F6EFE2' : (i % 3 === 0 ? '#D6A85E' : '#E8C688');
      if (i % 7 === 0) {
        // 偶见微小碎金箔菱粒
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(p.phase);
        ctx.fillRect(-1.1, -0.55, 2.2, 1.1);
        ctx.restore();
      } else {
        ctx.beginPath();
        ctx.arc(x, y, i % 5 === 0 ? 0.95 : 0.6, 0, TAU);
        ctx.fill();
      }
    }

    // 中央赤道星盘平面（Y = 0，处于三维星穹正中央，分隔北天球与南天球）
    const projectDeck = (gx, gz) => project3D(gx, 0, gz, w, h);

    // 掠射角平滑淡化系数（Grazing-Angle Attenuation）：当大环趋近侧视平视压扁时平滑衰减线宽与不透明度至 16%~22%，保持宁静通透
    const grazingAttenForNormal = (nx, ny, nz) => {
      const [, , viewNz] = rotateVecByQuat(nx, ny, nz, state.quatA);
      const absN = Math.abs(viewNz);
      return clamp(0.16 + 0.84 * Math.pow(absN, 0.88), 0.16, 1.0);
    };
    const eqAtten = grazingAttenForNormal(0, 1, 0);
    const ecAtten = grazingAttenForNormal(0, Math.cos(0.41), -Math.sin(0.41));

    // 星盘刻字防重叠遮罩评估：确保节气/地支/星宿铭刻绝不与设定集星域、宋版书牌或条目微标签互相打架
    const prevBoxes = frameCache.labelBoxesA || [];
    const inscriptionFadeAt = (tx, ty, halfW = 10, halfH = 7) => {
      let fade = 1.0;
      const cc = centerProj;
      const dxC = Math.max(0, Math.abs(tx - cc.x) - halfW * 0.45);
      const dyC = Math.max(0, Math.abs(ty - cc.y) - halfH * 0.45);
      if (Math.hypot(dxC, dyC) < cc.radius * 1.45) return 0.06;
      for (const sItem of projectedSets) {
        const dxS = Math.max(0, Math.abs(tx - sItem.x) - halfW * 0.55);
        const dyS = Math.max(0, Math.abs(ty - sItem.y) - halfH * 0.55);
        const dSet = Math.hypot(dxS, dyS) - sItem.radius;
        if (dSet < 22) fade = Math.min(fade, clamp((dSet + 6) / 28, 0.04, 1.0));
      }
      for (const b of prevBoxes) {
        const dxBox = Math.max(0, Math.max(b.x1 - (tx + halfW), (tx - halfW) - b.x2));
        const dyBox = Math.max(0, Math.max(b.y1 - (ty + halfH), (ty - halfH) - b.y2));
        const dBox = Math.hypot(dxBox, dyBox);
        if (dBox < 24) fade = Math.min(fade, clamp((dBox - 2) / 22, 0.0, 1.0));
      }
      return fade;
    };

    const drawRing3DPts = (pts, baseColor, minA, maxA, widthBase, dashed, atten = 1.0) => {
      ctx.setLineDash(dashed || []);
      const widthScale = 0.70 + 0.30 * atten;
      for (let i = 0; i < pts.length - 1; i++) {
        const p0 = pts[i], p1 = pts[i + 1];
        const depth = (p0.depthNorm + p1.depthNorm) * 0.5;
        ctx.beginPath();
        ctx.moveTo(p0.x, p0.y);
        ctx.lineTo(p1.x, p1.y);
        ctx.strokeStyle = baseColor;
        ctx.lineWidth = widthBase * widthScale * (0.72 + 0.45 * depth);
        ctx.globalAlpha = lerp(minA, maxA, Math.pow(depth, 1.35)) * atten;
        ctx.stroke();
      }
      ctx.setLineDash([]);
    };

    const drawDeckRing3D = (radiusWorld, segs, baseColor, minA, maxA, widthBase, dashed) => {
      const pts = [];
      for (let i = 0; i <= segs; i++) {
        const a = (i / segs) * TAU;
        pts.push(projectDeck(Math.cos(a) * radiusWorld, Math.sin(a) * radiusWorld));
      }
      drawRing3DPts(pts, baseColor, minA, maxA, widthBase, dashed, eqAtten);
    };

    // 2. 3D 球壳立体子午经线大环与黄道交角大环（带掠射角衰减，构建通透 360° 浑天球壳参考系）
    // (a) 两道正交 3D 子午经线大环（贯穿南北天极 R = 4.22）
    const meridianSegs = 84;
    for (const lonAngle of [0, Math.PI * 0.5]) {
      const ca = Math.cos(lonAngle), sa = Math.sin(lonAngle);
      const mAtten = grazingAttenForNormal(-sa, 0, ca);
      const mPts = [];
      for (let i = 0; i <= meridianSegs; i++) {
        const theta = (i / meridianSegs) * TAU;
        const rHoriz = Math.cos(theta) * 4.22;
        const wy = Math.sin(theta) * 4.22;
        mPts.push(project3D(rHoriz * ca, wy, rHoriz * sa, w, h));
      }
      drawRing3DPts(mPts, '#C8A262', 0.025, 0.14, 0.65, [3, 5], mAtten);
    }

    // 南北天极微标（北极紫微垣 / 南极丹元星锚点）
    for (const [poleY, poleText] of [[4.22, '北极 · 紫微'], [-4.22, '南极 · 丹元']]) {
      const pp = project3D(0, poleY, 0, w, h);
      const proxFade = inscriptionFadeAt(pp.x, pp.y + (poleY > 0 ? -10 : 10));
      if (proxFade < 0.05) continue;
      const d = 2.4;
      ctx.strokeStyle = '#E8C688';
      ctx.lineWidth = 0.75;
      ctx.globalAlpha = lerp(0.06, 0.32, pp.depthNorm) * proxFade;
      ctx.beginPath();
      ctx.moveTo(pp.x - d * 1.8, pp.y); ctx.lineTo(pp.x + d * 1.8, pp.y);
      ctx.moveTo(pp.x, pp.y - d * 1.8); ctx.lineTo(pp.x, pp.y + d * 1.8);
      ctx.stroke();
      ctx.font = '500 9px "Noto Serif SC", "Songti SC", serif';
      ctx.fillStyle = '#D4B475';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(poleText, pp.x, pp.y + (poleY > 0 ? -10 : 10));
    }

    // (b) 23.5° 黄道交角立体大环（与中央赤道盘在春秋分点斜交，带掠射角柔化）
    const eclipticTilt = 0.41; // 23.5° 黄赤交角
    const ecPts = [];
    for (let i = 0; i <= 96; i++) {
      const a = (i / 96) * TAU;
      const gx = Math.cos(a) * 3.92;
      const rawZ = Math.sin(a) * 3.92;
      const gy = rawZ * Math.sin(eclipticTilt);
      const gz = rawZ * Math.cos(eclipticTilt);
      ecPts.push(project3D(gx, gy, gz, w, h));
    }
    drawRing3DPts(ecPts, '#D8B470', 0.035, 0.22, 0.78, [5, 3.5], ecAtten);

    // (c) 最外层二十八宿周天星官方位暗纹（沿黄赤交界球壳极低透明度微刻，带碰撞退避）
    ctx.font = '500 9.5px "Noto Serif SC", "Songti SC", serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    const mansionAtten = lerp(0.45, 1.0, ecAtten);
    for (let i = 0; i < 28; i++) {
      const a = (i / 28) * TAU;
      const gx = Math.cos(a) * 4.52;
      const rawZ = Math.sin(a) * 4.52;
      const gy = rawZ * Math.sin(eclipticTilt * 0.5);
      const gz = rawZ * Math.cos(eclipticTilt * 0.5);
      const mp = project3D(gx, gy, gz, w, h);
      const proxFade = inscriptionFadeAt(mp.x, mp.y);
      if (proxFade < 0.04) continue;
      const tickIn = project3D(gx * 0.965, gy * 0.965, gz * 0.965, w, h);
      const depthA = Math.pow(mp.depthNorm, 1.45);
      ctx.strokeStyle = '#C8A262';
      ctx.lineWidth = 0.55;
      ctx.globalAlpha = lerp(0.02, 0.16, depthA) * mansionAtten * proxFade;
      ctx.beginPath();
      ctx.moveTo(tickIn.x, tickIn.y);
      ctx.lineTo(mp.x, mp.y);
      ctx.stroke();

      ctx.fillStyle = '#D4B67B';
      ctx.globalAlpha = lerp(0.03, 0.22, depthA) * mansionAtten * proxFade;
      ctx.fillText(LUNAR_MANSIONS_28[i], mp.x, mp.y);
    }

    // 3. 中央赤道浑天星盘（Y = 0）：二十四节气外环 + 十二辰地支中环 + 内座罗盘环（均应用 eqAtten 掠射角柔化）
    drawDeckRing3D(4.22, 96, '#E8C688', 0.05, 0.30, 0.92, []);
    drawDeckRing3D(4.10, 96, '#C8A262', 0.035, 0.20, 0.68, []);

    // 外圈 72 候分度短刻线 & 二十四节气微刻
    for (let i = 0; i < 72; i++) {
      const a = (i / 72) * TAU;
      const isTerm = i % 3 === 0;      // 二十四节气（每 15°）
      const isCardinal = i % 18 === 0; // 二分二至（春分/夏至/秋分/冬至）
      const rIn = isCardinal ? 3.92 : isTerm ? 4.00 : 4.10;
      const p0 = projectDeck(Math.cos(a) * rIn, Math.sin(a) * rIn);
      const p1 = projectDeck(Math.cos(a) * 4.22, Math.sin(a) * 4.22);
      const depth = p1.depthNorm;
      ctx.beginPath();
      ctx.moveTo(p0.x, p0.y);
      ctx.lineTo(p1.x, p1.y);
      ctx.strokeStyle = isCardinal ? '#F6EFE2' : '#E8C688';
      ctx.lineWidth = (isCardinal ? 1.05 : isTerm ? 0.8 : 0.58) * (0.72 + 0.28 * eqAtten);
      ctx.globalAlpha = lerp(0.035, isCardinal ? 0.44 : isTerm ? 0.26 : 0.15, Math.pow(depth, 1.35)) * eqAtten;
      ctx.stroke();

      if (isTerm && !isCardinal) {
        const termIdx = (i / 3) % 24;
        const ptTerm = projectDeck(Math.cos(a) * 4.35, Math.sin(a) * 4.35);
        const proxFade = inscriptionFadeAt(ptTerm.x, ptTerm.y, 16, 7);
        if (proxFade < 0.05) continue;
        ctx.font = '500 8.5px "Noto Serif SC", "Songti SC", serif';
        ctx.fillStyle = '#C9A86A';
        ctx.globalAlpha = lerp(0.03, 0.24, Math.pow(ptTerm.depthNorm, 1.4)) * eqAtten * proxFade;
        ctx.fillText(SOLAR_TERMS_24[termIdx], ptTerm.x, ptTerm.y);
      }
    }

    // 四正节气主铭刻（当设定集标签/星域接近时平滑退避淡出，绝不叠字）
    const cardinalLabels = [
      { ang: 0, text: '卯正 · 春分 · 〇〇度' },
      { ang: Math.PI * 0.5, text: '午正 · 夏至 · 九〇度' },
      { ang: Math.PI, text: '酉正 · 秋分 · 一八〇度' },
      { ang: Math.PI * 1.5, text: '子正 · 冬至 · 二七〇度' }
    ];
    ctx.font = '600 9.5px "Noto Serif SC", "Songti SC", serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for (const cl of cardinalLabels) {
      const pt = projectDeck(Math.cos(cl.ang) * 4.38, Math.sin(cl.ang) * 4.38);
      const proxFade = inscriptionFadeAt(pt.x, pt.y, 48, 9);
      if (proxFade < 0.05) continue;
      ctx.fillStyle = '#EAD09B';
      ctx.globalAlpha = lerp(0.08, 0.46, Math.pow(pt.depthNorm, 1.25)) * lerp(0.45, 1.0, eqAtten) * proxFade;
      ctx.fillText(cl.text, pt.x, pt.y);
    }

    // 中圈：赤道十二辰地支分度章环 (R = 2.96 & 2.86)
    drawDeckRing3D(2.96, 84, '#E8C688', 0.045, 0.25, 0.82, []);
    drawDeckRing3D(2.86, 84, '#B89254', 0.035, 0.16, 0.62, [3, 4]);
    for (let i = 0; i < 48; i++) {
      const a = (i / 48) * TAU;
      const isBranch = i % 4 === 0;
      const p0 = projectDeck(Math.cos(a) * (isBranch ? 2.80 : 2.86), Math.sin(a) * (isBranch ? 2.80 : 2.86));
      const p1 = projectDeck(Math.cos(a) * 2.96, Math.sin(a) * 2.96);
      ctx.beginPath();
      ctx.moveTo(p0.x, p0.y);
      ctx.lineTo(p1.x, p1.y);
      ctx.strokeStyle = '#E8C688';
      ctx.lineWidth = (isBranch ? 0.88 : 0.56) * (0.72 + 0.28 * eqAtten);
      ctx.globalAlpha = lerp(0.035, isBranch ? 0.30 : 0.14, Math.pow(p1.depthNorm, 1.35)) * eqAtten;
      ctx.stroke();

      if (isBranch) {
        const branchIdx = (i / 4) % 12;
        const pb = projectDeck(Math.cos(a) * 2.68, Math.sin(a) * 2.68);
        const proxFade = inscriptionFadeAt(pb.x, pb.y);
        if (proxFade < 0.05) continue;
        ctx.font = '500 9px "Noto Serif SC", "Songti SC", serif';
        ctx.fillStyle = '#D4B67B';
        ctx.globalAlpha = lerp(0.045, 0.29, Math.pow(pb.depthNorm, 1.35)) * eqAtten * proxFade;
        ctx.fillText(EARTHLY_BRANCHES_12[branchIdx], pb.x, pb.y);
      }
    }

    // 内圈：璇玑浑天基座环 (R = 1.62 & 0.62)
    drawDeckRing3D(1.62, 64, '#D6B374', 0.045, 0.22, 0.74, []);
    drawDeckRing3D(0.62, 48, '#E8C688', 0.07, 0.30, 0.78, []);

    // 12 道赤道子午辐射金丝
    for (let i = 0; i < 12; i++) {
      const a = (i / 12) * TAU;
      const isCardinal = i % 3 === 0;
      const steps = 16;
      for (let s = 0; s < steps; s++) {
        const r0 = lerp(0.62, 4.10, s / steps);
        const r1 = lerp(0.62, 4.10, (s + 1) / steps);
        const p0 = projectDeck(Math.cos(a) * r0, Math.sin(a) * r0);
        const p1 = projectDeck(Math.cos(a) * r1, Math.sin(a) * r1);
        const depth = (p0.depthNorm + p1.depthNorm) * 0.5;
        ctx.beginPath();
        ctx.moveTo(p0.x, p0.y);
        ctx.lineTo(p1.x, p1.y);
        ctx.strokeStyle = isCardinal ? '#E8C688' : '#A6834B';
        ctx.lineWidth = (isCardinal ? 0.72 : 0.54) * (0.72 + 0.28 * eqAtten);
        ctx.globalAlpha = lerp(0.02, isCardinal ? 0.16 : 0.08, Math.pow(depth, 1.3)) * eqAtten;
        ctx.stroke();
      }
    }

    // 4. 双向金丝测高垂针（北天球星域向下落于赤道星盘 Y=0，南天球星域向上映于赤道星盘 Y=0）
    const drawGoldenPlumbNeedle = (wx, wy, wz, color, alpha, isHighlighted, domainRadiusWorld, latLabel) => {
      const topP = project3D(wx, wy, wz, w, h);
      const botP = projectDeck(wx, wz);

      ctx.save();
      // (a) 赤道盘交点处的 3D 透视双环星盘锚点（在 Y = 0 赤道面上真实投影为透视椭圆）
      if (domainRadiusWorld > 0) {
        const rProj = domainRadiusWorld * 0.68;
        const rInner = 0.13;
        for (const [rad, dash, mult] of [[rProj, [2.5, 3.5], 0.50], [rInner, [], 0.95], [rInner * 1.7, [], 0.70]]) {
          const steps = 32;
          ctx.beginPath();
          for (let i = 0; i <= steps; i++) {
            const a = (i / steps) * TAU;
            const p = projectDeck(wx + Math.cos(a) * rad, wz + Math.sin(a) * rad);
            if (i === 0) ctx.moveTo(p.x, p.y);
            else ctx.lineTo(p.x, p.y);
          }
          ctx.setLineDash(dash);
          ctx.strokeStyle = isHighlighted ? '#FFE5AE' : color;
          ctx.lineWidth = isHighlighted ? 0.95 : 0.7;
          ctx.globalAlpha = alpha * mult * (isHighlighted ? 0.85 : 0.42);
          ctx.stroke();
        }
        ctx.setLineDash([]);
      }

      // (b) 双向金丝垂针（星体端实线金针 -> 赤道盘端虚线游丝）
      const midX = lerp(topP.x, botP.x, 0.48);
      const midY = lerp(topP.y, botP.y, 0.48);
      ctx.strokeStyle = isHighlighted ? '#FFE7B5' : color;
      ctx.lineWidth = isHighlighted ? 1.15 : 0.78;
      ctx.globalAlpha = alpha * (isHighlighted ? 0.88 : 0.44);
      ctx.beginPath();
      ctx.moveTo(topP.x, topP.y);
      ctx.lineTo(midX, midY);
      ctx.stroke();

      ctx.setLineDash([2, 3]);
      ctx.beginPath();
      ctx.moveTo(midX, midY);
      ctx.lineTo(botP.x, botP.y);
      ctx.stroke();
      ctx.setLineDash([]);

      // 垂针中段微型金珠配重节
      ctx.fillStyle = isHighlighted ? '#FFF9EC' : '#E8C688';
      ctx.globalAlpha = alpha * (isHighlighted ? 0.95 : 0.62);
      ctx.beginPath();
      ctx.arc(midX, midY, isHighlighted ? 1.6 : 1.1, 0, TAU);
      ctx.fill();

      // (c) 赤道盘落点十字刻度与金珠锚心
      const arm = isHighlighted ? 5.0 : 3.6;
      ctx.strokeStyle = isHighlighted ? '#FFE7B5' : color;
      ctx.lineWidth = isHighlighted ? 1.05 : 0.76;
      ctx.globalAlpha = alpha * (isHighlighted ? 0.96 : 0.56);
      ctx.beginPath();
      ctx.moveTo(botP.x - arm, botP.y); ctx.lineTo(botP.x + arm, botP.y);
      ctx.moveTo(botP.x, botP.y - arm); ctx.lineTo(botP.x, botP.y + arm);
      ctx.stroke();

      ctx.fillStyle = isHighlighted ? '#C84B31' : '#E8C688';
      ctx.beginPath();
      ctx.arc(botP.x, botP.y, isHighlighted ? 1.9 : 1.25, 0, TAU);
      ctx.fill();

      // 悬停或聚焦时在垂针旁轻盈标注南北天赤纬微刻
      if (isHighlighted && latLabel) {
        ctx.font = '500 8.5px "Noto Serif SC", "Songti SC", serif';
        ctx.fillStyle = '#EAD09B';
        ctx.globalAlpha = alpha * 0.88;
        ctx.textAlign = 'left';
        ctx.textBaseline = 'middle';
        ctx.fillText(latLabel, midX + 6, midY);
      }
      ctx.restore();
    };

    // 各设定集子星盘双向鎏金测高垂针（北天球下垂、南天球上映）
    for (const sItem of projectedSets) {
      const s = sItem.set;
      const isSetHi = state.hoveredSetId === s.id || state.focusedSetId === s.id || state.rimHoverSetId === s.id || state.resizingSetId === s.id;
      drawGoldenPlumbNeedle(
        sItem.wx, sItem.wy, sItem.wz,
        s.hueA,
        s.focusWeight * 0.95,
        isSetHi,
        s.baseDomainRadius * s.domainScale,
        s.latLabelA
      );
    }

    // 核心高权重星曜与悬停星曜的辅助垂针
    for (const n of projectedNodes) {
      const e = n.entry;
      const isNodeHi = state.hoveredNodeId === e.id;
      const isSetFocused = state.focusedSetId === n.set.id || state.hoveredSetId === n.set.id;
      if (e.tier === 1 || isNodeHi || (e.tier === 2 && isSetFocused)) {
        drawGoldenPlumbNeedle(n.wx, n.wy, n.wz, n.set.hueA, e.focusWeight * (isNodeHi ? 1.0 : 0.62), isNodeHi, 0, '');
      }
    }

    ctx.restore();
  }

  function drawTopologyGravityMesh(ctx, w, h, projectedSets, projectedNodes, centerProj) {
    ctx.save();
    // 1. 远景极克制冷色微粒坐标点（非圆球，而是精密微十字/微菱点）
    for (let i = 0; i < 42; i++) {
      const p = STARDUST[i];
      const shiftX = (state.yaw * 115 + state.panX * 0.25) * p.depth;
      const shiftY = (state.pitch * 85 + state.panY * 0.25) * p.depth;
      const x = ((p.x * w + shiftX) % w + w) % w;
      const y = ((p.y * h + shiftY) % h + h) % h;
      ctx.globalAlpha = 0.08 + (i % 4) * 0.03;
      ctx.fillStyle = i % 3 === 0 ? '#47D7E8' : '#b8d0ec';
      ctx.fillRect(x - 0.6, y - 0.6, 1.2, 1.2);
    }

    // 2. 三维透视高斯引力势阱曲面网格（取消同心椭圆轨道，构建真实物理凹陷地形）
    const EXTENT = 4.9;
    const LINES = 22; // 经纬网格线数
    const SUB = 44;   // 每条网格线采样细分数，保证势阱凹陷平滑自然

    // 预采样两条方向网格线族
    for (let dir = 0; dir < 2; dir++) {
      for (let i = 0; i <= LINES; i++) {
        const u = -EXTENT + (i / LINES) * (EXTENT * 2);
        let prev = null;
        for (let j = 0; j <= SUB; j++) {
          const v = -EXTENT + (j / SUB) * (EXTENT * 2);
          const gx = dir === 0 ? u : v;
          const gz = dir === 0 ? v : u;
          const rNorm = Math.hypot(gx, gz) / EXTENT;
          if (rNorm > 1.04) {
            prev = null;
            continue;
          }
          const gy = gravityWellY(gx, gz, projectedSets);
          const pt = project3D(gx, gy, gz, w, h);
          const wellDepth = clamp((-gy - 0.78) / 1.08, 0, 1);
          const edgeFade = Math.pow(clamp(1 - Math.pow(rNorm, 2.15), 0, 1), 1.3);
          pt.edgeFade = edgeFade;
          pt.wellDepth = wellDepth;

          if (prev) {
            const fade = (prev.edgeFade + pt.edgeFade) * 0.5;
            if (fade > 0.012) {
              const well = (prev.wellDepth + pt.wellDepth) * 0.5;
              const depthVis = 0.42 + 0.58 * ((prev.depthNorm + pt.depthNorm) * 0.5);
              ctx.beginPath();
              ctx.moveTo(prev.x, prev.y);
              ctx.lineTo(pt.x, pt.y);
              ctx.strokeStyle = well > 0.24 ? '#47D7E8' : '#9bb8d8';
              ctx.lineWidth = well > 0.35 ? 0.82 : 0.68;
              ctx.globalAlpha = (0.065 + 0.165 * well) * fade * depthVis;
              ctx.stroke();
            }
          }
          prev = pt;
        }
      }
    }

    // 3. 中心主势阱与各设定集底层的 2 圈引力等高线波纹（投影在扭曲网格表面）
    const drawMeshContourRing = (cx, cz, radiusWorld, color, alpha, dashed) => {
      const steps = 44;
      ctx.beginPath();
      for (let i = 0; i <= steps; i++) {
        const a = (i / steps) * TAU;
        const gx = cx + Math.cos(a) * radiusWorld;
        const gz = cz + Math.sin(a) * radiusWorld;
        const gy = gravityWellY(gx, gz, projectedSets);
        const p = project3D(gx, gy, gz, w, h);
        if (i === 0) ctx.moveTo(p.x, p.y);
        else ctx.lineTo(p.x, p.y);
      }
      ctx.setLineDash(dashed ? [2.5, 3.5] : []);
      ctx.strokeStyle = color;
      ctx.lineWidth = 0.8;
      ctx.globalAlpha = alpha;
      ctx.stroke();
      ctx.setLineDash([]);
    };

    // 主星底部漏斗等高环
    drawMeshContourRing(0, 0, 0.46, '#47D7E8', 0.24, false);
    drawMeshContourRing(0, 0, 0.88, '#8C7BFF', 0.15, true);

    // 各设定集底层双圈引力等高线波纹（随拖拽缩放实时变宽、变深）
    for (const sItem of projectedSets) {
      const s = sItem.set;
      const isHighlighted = state.hoveredSetId === s.id || state.focusedSetId === s.id || state.rimHoverSetId === s.id || state.resizingSetId === s.id;
      const rWorld = s.baseDomainRadius * s.domainScale;
      const baseA = (isHighlighted ? 0.42 : 0.18) * s.focusWeight;
      drawMeshContourRing(sItem.wx, sItem.wz, rWorld * 0.56, isHighlighted ? '#47D7E8' : s.coldHue, baseA, false);
      drawMeshContourRing(sItem.wx, sItem.wz, rWorld * 1.02, isHighlighted ? '#47D7E8' : s.coldHue, baseA * 0.72, true);
    }

    // 4. Z 轴悬浮垂直测高细虚线（Plumb Line）+ 网格表面 3px 十字坐标锚点
    const drawPlumbAnchor = (wx, wy, wz, color, alpha, isHighlighted) => {
      const meshY = gravityWellY(wx, wz, projectedSets);
      const topP = project3D(wx, wy, wz, w, h);
      const botP = project3D(wx, meshY, wz, w, h);

      ctx.save();
      ctx.setLineDash([2, 3.2]);
      ctx.strokeStyle = isHighlighted ? '#47D7E8' : color;
      ctx.lineWidth = isHighlighted ? 1.1 : 0.75;
      ctx.globalAlpha = alpha * (isHighlighted ? 0.88 : 0.34);
      ctx.beginPath();
      ctx.moveTo(topP.x, topP.y);
      ctx.lineTo(botP.x, botP.y);
      ctx.stroke();
      ctx.setLineDash([]);

      // 网格交点处 3px 十字坐标锚点 (+)
      const arm = isHighlighted ? 4.2 : 3.0;
      ctx.strokeStyle = isHighlighted ? '#47D7E8' : color;
      ctx.lineWidth = isHighlighted ? 1.15 : 0.85;
      ctx.globalAlpha = alpha * (isHighlighted ? 0.96 : 0.52);
      ctx.beginPath();
      ctx.moveTo(botP.x - arm, botP.y);
      ctx.lineTo(botP.x + arm, botP.y);
      ctx.moveTo(botP.x, botP.y - arm);
      ctx.lineTo(botP.x, botP.y + arm);
      ctx.stroke();

      if (isHighlighted) {
        // 悬停高亮时在势阱锚点外围浮现微菱形锁定框
        const d = 6.2;
        ctx.globalAlpha = alpha * 0.65;
        ctx.beginPath();
        ctx.moveTo(botP.x, botP.y - d);
        ctx.lineTo(botP.x + d, botP.y);
        ctx.lineTo(botP.x, botP.y + d);
        ctx.lineTo(botP.x - d, botP.y);
        ctx.closePath();
        ctx.stroke();
      }
      ctx.restore();
    };

    // 主星中心测高垂线
    drawPlumbAnchor(0, centerProj.wy, 0, '#47D7E8', 0.75, false);

    // 各设定集中心测高垂线
    for (const sItem of projectedSets) {
      const s = sItem.set;
      const isSetHi = state.hoveredSetId === s.id || state.focusedSetId === s.id || state.rimHoverSetId === s.id || state.resizingSetId === s.id;
      drawPlumbAnchor(sItem.wx, sItem.wy, sItem.wz, s.coldHue, s.focusWeight * 0.9, isSetHi);
    }

    // 核心条目与悬停条目的测高垂线
    for (const n of projectedNodes) {
      const e = n.entry;
      const isNodeHi = state.hoveredNodeId === e.id;
      const isSetFocused = state.focusedSetId === n.set.id || state.hoveredSetId === n.set.id;
      if (e.tier === 1 || isNodeHi || (e.tier === 2 && isSetFocused)) {
        drawPlumbAnchor(n.wx, n.wy, n.wz, n.set.coldHue, e.focusWeight * (isNodeHi ? 1.0 : 0.72), isNodeHi);
      }
    }

    ctx.restore();
  }

  // 方案 A 专属：十六进制颜色线性混合（拉丝青铜受光明暗，返回 #rrggbb 支持嵌套混合）
  function mixHexA(a, b, k) {
    const t = clamp(k, 0, 1);
    const pa = [parseInt(a.slice(1, 3), 16), parseInt(a.slice(3, 5), 16), parseInt(a.slice(5, 7), 16)];
    const pb = [parseInt(b.slice(1, 3), 16), parseInt(b.slice(3, 5), 16), parseInt(b.slice(5, 7), 16)];
    const h = (v) => Math.round(v).toString(16).padStart(2, '0');
    return `#${h(lerp(pa[0], pb[0], t))}${h(lerp(pa[1], pb[1], t))}${h(lerp(pa[2], pb[2], t))}`;
  }

  // 方案 A 专属：球内游曳微尘金粒（确定性参数，避免逐帧随机抖动）
  const CORE_DUST_A = Array.from({ length: 16 }, (_, i) => ({
    rad: 0.26 + ((Math.sin(i * 91.7) * 0.5 + 0.5) * 0.58),
    incl: (Math.sin(i * 37.3) * 0.5 + 0.5) * Math.PI,
    speed: 0.10 + ((Math.sin(i * 13.1) * 0.5 + 0.5) * 0.22) * (i % 2 ? 1 : -1),
    phase: i * 1.93,
    size: 0.55 + (i % 3) * 0.28
  }));

  function drawAstrolabeCenterStar(ctx, c, clock, w, h) {
    const r = c.radius;
    const t = clock * 0.001;
    ctx.save();

    // 3D 局部投影与欧拉旋转（围绕中心主星 (0, c.wy, 0) 构建真实前后遮挡的璇玑玉衡浑天仪：六合仪 / 三辰仪 / 四游仪）
    const worldRadius = 0.45;
    const projectLocal3D = (lx, ly, lz) => project3D(lx * worldRadius, c.wy + ly * worldRadius, lz * worldRadius, w, h);
    const rotVec = (x, y, z, rx, ry, rz) => {
      let y1 = y * Math.cos(rx) - z * Math.sin(rx);
      let z1 = y * Math.sin(rx) + z * Math.cos(rx);
      let x2 = x * Math.cos(ry) + z1 * Math.sin(ry);
      let z2 = -x * Math.sin(ry) + z1 * Math.cos(ry);
      let x3 = x2 * Math.cos(rz) - y1 * Math.sin(rz);
      let y3 = x2 * Math.sin(rz) + y1 * Math.cos(rz);
      return [x3, y3, z2];
    };

    // 博物馆级拉丝青铜三环：六合仪（天经子午环）、三辰仪（黄赤道交环）、四游仪（璇玑双环）
    const armillaryRings = [
      { name: 'liuhe', radOuter: 1.58, radInner: 1.43, rx: 1.18 + Math.sin(t * 0.2) * 0.06, ry: -0.34 - t * 0.10, rz: 0.24, ticks: 72, lugs: 4, fretStep: 3, hiCol: '#FBE7B8', loCol: '#4A3319' },
      { name: 'sanchen', radOuter: 1.33, radInner: 1.20, rx: 0.41, ry: t * 0.15, rz: -0.32, ticks: 48, lugs: 4, fretStep: 3, hiCol: '#F4D89E', loCol: '#46301A' },
      { name: 'siyou', radOuter: 1.11, radInner: 1.00, rx: -0.58 + t * 0.13, ry: 0.85 - t * 0.17, rz: 0.62, ticks: 32, lugs: 2, fretStep: 2, hiCol: '#FFEFC8', loCol: '#4C351C' }
    ];

    const backDrawCalls = [];
    const frontDrawCalls = [];
    let maxY = c.y + r;
    let maxDist = r;
    const trackExtent = (p) => {
      if (p.y > maxY) maxY = p.y;
      const d = Math.hypot(p.x - c.x, p.y - c.y);
      if (d > maxDist) maxDist = d;
    };
    // 屏幕空间固定光源（左上方受光）：环带受光面呈拉丝香槟金，背光面沉入古铜暗影
    const LX = -0.70, LY = -0.72;

    for (const ring of armillaryRings) {
      const segs = 84;
      const outerPts = [], innerPts = [], midPts = [], hiPts = [];
      const radMid = (ring.radOuter + ring.radInner) * 0.5;
      const radHi = lerp(ring.radOuter, ring.radInner, 0.32);
      for (let i = 0; i <= segs; i++) {
        const a = (i / segs) * TAU;
        const ca = Math.cos(a), sa = Math.sin(a);
        const po = projectLocal3D(...rotVec(ca * ring.radOuter, 0, sa * ring.radOuter, ring.rx, ring.ry, ring.rz));
        outerPts.push(po);
        trackExtent(po);
        innerPts.push(projectLocal3D(...rotVec(ca * ring.radInner, 0, sa * ring.radInner, ring.rx, ring.ry, ring.rz)));
        midPts.push(projectLocal3D(...rotVec(ca * radMid, 0, sa * radMid, ring.rx, ring.ry, ring.rz)));
        hiPts.push(projectLocal3D(...rotVec(ca * radHi, 0, sa * radHi, ring.rx, ring.ry, ring.rz)));
      }

      for (let i = 0; i < segs; i++) {
        const o0 = outerPts[i], o1 = outerPts[i + 1];
        const n0 = innerPts[i], n1 = innerPts[i + 1];
        const m0 = midPts[i], m1 = midPts[i + 1];
        const h0 = hiPts[i], h1 = hiPts[i + 1];
        const zAvg = (o0.z + o1.z) * 0.5;
        const isFront = zAvg >= c.z;
        const zSoft = clamp((zAvg - c.z + 0.36) / 0.72, 0, 1);
        // 受光系数：环带径向外法线（屏幕空间）与左上光源的点积
        const rdx = (m0.x + m1.x) * 0.5 - c.x, rdy = (m0.y + m1.y) * 0.5 - c.y;
        const rl = Math.hypot(rdx, rdy) || 1;
        const lit = clamp(0.5 + 0.5 * ((rdx / rl) * LX + (rdy / rl) * LY) / Math.hypot(LX, LY), 0, 1);
        const list = isFront ? frontDrawCalls : backDrawCalls;
        list.push(() => {
          if (zSoft > 0.25) {
            // (a) 金属环厚度侧壁：外缘下方 1.3px 古铜暗影挤出
            ctx.beginPath();
            ctx.moveTo(o0.x, o0.y + 1.3);
            ctx.lineTo(o1.x, o1.y + 1.3);
            ctx.strokeStyle = '#1E140A';
            ctx.lineWidth = 1.7;
            ctx.globalAlpha = 0.82 * zSoft;
            ctx.stroke();
          }
          // (b) 环带实体：受光明暗渐变填充（拉丝香槟金 ↔ 古铜暗影，平滑过渡前后半环）
          ctx.beginPath();
          ctx.moveTo(o0.x, o0.y);
          ctx.lineTo(o1.x, o1.y);
          ctx.lineTo(n1.x, n1.y);
          ctx.lineTo(n0.x, n0.y);
          ctx.closePath();
          ctx.fillStyle = mixHexA('#362412', mixHexA(ring.loCol, '#C9A060', Math.pow(lit, 1.2)), zSoft);
          ctx.globalAlpha = lerp(0.32, 0.80, zSoft);
          ctx.fill();

          if (zSoft > 0.35) {
            // (c) 拉丝高光带：沿环带外侧三分之一的镜面拉丝反光
            ctx.beginPath();
            ctx.moveTo(h0.x, h0.y);
            ctx.lineTo(h1.x, h1.y);
            ctx.strokeStyle = '#FFF4D6';
            ctx.lineWidth = 0.75;
            ctx.globalAlpha = (0.08 + 0.62 * Math.pow(lit, 2.4)) * zSoft;
            ctx.stroke();
          }

          // (d) 双边倒角亮线：外缘主倒角 + 朝镜头受光面 0.7px 极细象牙白高光边 + 内缘副倒角
          ctx.beginPath();
          ctx.moveTo(o0.x, o0.y);
          ctx.lineTo(o1.x, o1.y);
          ctx.strokeStyle = mixHexA('#7A5B32', ring.hiCol, zSoft);
          ctx.lineWidth = lerp(0.60, 0.92, zSoft);
          ctx.globalAlpha = lerp(0.32, 0.42 + 0.50 * lit, zSoft);
          ctx.stroke();

          if (zSoft > 0.52 && lit > 0.45) {
            ctx.beginPath();
            ctx.moveTo(o0.x, o0.y);
            ctx.lineTo(o1.x, o1.y);
            ctx.strokeStyle = '#FFFDF6';
            ctx.lineWidth = 0.7;
            ctx.globalAlpha = (lit - 0.45) * 1.45 * zSoft;
            ctx.stroke();
          }

          ctx.beginPath();
          ctx.moveTo(n0.x, n0.y);
          ctx.lineTo(n1.x, n1.y);
          ctx.strokeStyle = mixHexA('#6A4E2A', mixHexA('#8A6838', '#FFF0CC', lit), zSoft);
          ctx.lineWidth = lerp(0.45, 0.62, zSoft);
          ctx.globalAlpha = lerp(0.24, 0.32 + 0.42 * lit, zSoft);
          ctx.stroke();

          // (e) 间断几何云雷 / 回纹饰带
          if (zSoft > 0.42 && i % 4 !== 3) {
            ctx.beginPath();
            ctx.moveTo(m0.x, m0.y);
            ctx.lineTo(m1.x, m1.y);
            if (i % 4 === 0) {
              const towardOuter = (i / 4) % 2 === 0;
              const tip = towardOuter ? o0 : n0;
              ctx.moveTo(m0.x, m0.y);
              ctx.lineTo(lerp(m0.x, tip.x, 0.72), lerp(m0.y, tip.y, 0.72));
            }
            ctx.strokeStyle = '#2A1C0E';
            ctx.lineWidth = 0.55;
            ctx.globalAlpha = (0.34 + 0.18 * lit) * zSoft;
            ctx.stroke();
          }
        });
      }

      // 微距分度刻度 + 四正云头耳卡扣 + 鎏金铜铆钉
      for (let k = 0; k < ring.ticks; k++) {
        const a = (k / ring.ticks) * TAU;
        const ca = Math.cos(a), sa = Math.sin(a);
        const major = k % (ring.ticks / ring.lugs) === 0;
        const mid = k % ring.fretStep === 0;
        const rIn = major ? ring.radInner : mid ? lerp(ring.radOuter, ring.radInner, 0.55) : lerp(ring.radOuter, ring.radInner, 0.30);
        const pIn = projectLocal3D(...rotVec(ca * rIn, 0, sa * rIn, ring.rx, ring.ry, ring.rz));
        const pOut = projectLocal3D(...rotVec(ca * ring.radOuter, 0, sa * ring.radOuter, ring.rx, ring.ry, ring.rz));
        const isFront = pOut.z >= c.z;
        const list = isFront ? frontDrawCalls : backDrawCalls;
        let pEar = null;
        if (major) {
          pEar = projectLocal3D(...rotVec(ca * (ring.radOuter + 0.10), 0, sa * (ring.radOuter + 0.10), ring.rx, ring.ry, ring.rz));
          trackExtent(pEar);
        }
        list.push(() => {
          ctx.beginPath();
          ctx.moveTo(pIn.x, pIn.y);
          ctx.lineTo(pOut.x, pOut.y);
          ctx.strokeStyle = isFront ? (major ? '#FFF8E8' : '#2A1C0E') : '#6E512B';
          ctx.lineWidth = major ? (isFront ? 0.9 : 0.6) : (isFront ? 0.5 : 0.4);
          ctx.globalAlpha = isFront ? (major ? 0.9 : mid ? 0.62 : 0.42) : 0.18;
          ctx.stroke();

          if (major && pEar) {
            // 镂空如意云头耳卡扣（三瓣云纹朝环外侧）
            const ang = Math.atan2(pEar.y - pOut.y, pEar.x - pOut.x);
            const s = isFront ? 1.0 : 0.72;
            ctx.save();
            ctx.translate(pEar.x, pEar.y);
            ctx.rotate(ang + Math.PI * 0.5);
            ctx.scale(s, s);
            ctx.beginPath();
            ctx.moveTo(-4.2, 1.6);
            ctx.arc(-2.5, 0.2, 1.55, Math.PI * 0.85, Math.PI * 1.95);
            ctx.arc(0, -1.2, 1.75, Math.PI * 1.02, Math.PI * 1.98);
            ctx.arc(2.5, 0.2, 1.55, Math.PI * 1.05, Math.PI * 0.15);
            ctx.lineTo(4.2, 1.6);
            ctx.strokeStyle = isFront ? '#F6DFA8' : '#6E512B';
            ctx.lineWidth = isFront ? 0.8 : 0.55;
            ctx.globalAlpha = isFront ? 0.86 : 0.26;
            ctx.stroke();
            ctx.restore();

            // 鎏金铜铆钉（左上高光 + 暗缘）
            const rr = isFront ? 1.9 : 1.2;
            const rivet = ctx.createRadialGradient(pOut.x - rr * 0.4, pOut.y - rr * 0.45, 0.1, pOut.x, pOut.y, rr);
            rivet.addColorStop(0, '#FFF6DC');
            rivet.addColorStop(0.55, '#D9AE62');
            rivet.addColorStop(1, '#4A3218');
            ctx.fillStyle = rivet;
            ctx.globalAlpha = isFront ? 1 : 0.35;
            ctx.beginPath();
            ctx.arc(pOut.x, pOut.y, rr, 0, TAU);
            ctx.fill();
          }
        });
      }
    }

    // 玉衡窥管两端点（同时参与铭牌净空计算）
    const axisRot = [0.18, t * 0.1, -0.15];
    const pTopAxis = projectLocal3D(...rotVec(0, 1.80, 0, ...axisRot));
    const pBotAxis = projectLocal3D(...rotVec(0, -1.80, 0, ...axisRot));
    trackExtent(pTopAxis);
    trackExtent(pBotAxis);

    // 0. 浑天仪外围无边界「香槟金日冕星尘光环」（透明度 10%–14% 柔和托出中心引力场 + 极细若隐若现刻度晕）
    const haloR = maxDist + 10;
    const gapHalf = 0.36;
    const haloSpin = t * 0.025;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const dustCorona = ctx.createRadialGradient(c.x, c.y, maxDist * 0.62, c.x, c.y, haloR + 28);
    dustCorona.addColorStop(0, 'rgba(232, 198, 136, 0)');
    dustCorona.addColorStop(0.45, 'rgba(232, 198, 136, 0.12)');
    dustCorona.addColorStop(0.72, 'rgba(244, 214, 152, 0.075)');
    dustCorona.addColorStop(1, 'rgba(232, 198, 136, 0)');
    ctx.fillStyle = dustCorona;
    ctx.globalAlpha = 1;
    ctx.beginPath();
    ctx.arc(c.x, c.y, haloR + 28, 0, TAU);
    ctx.fill();
    // 环绕中心引力场的微距星尘金粒（避开底部铭牌区）
    for (let i = 0; i < 28; i++) {
      const a = (i / 28) * TAU + haloSpin * (i % 2 ? 1.15 : -0.85);
      let rel = ((a - Math.PI * 0.5) % TAU + TAU) % TAU;
      if (rel < gapHalf || rel > TAU - gapHalf) continue;
      const dr = haloR - 3 + ((i * 19) % 15);
      const sx = c.x + Math.cos(a) * dr;
      const sy = c.y + Math.sin(a) * dr;
      const tw = 0.55 + 0.45 * Math.sin(t * 1.3 + i * 2.1);
      ctx.fillStyle = i % 4 === 0 ? '#FFF6E0' : '#E8C688';
      ctx.globalAlpha = (i % 3 === 0 ? 0.24 : 0.13) * tw;
      ctx.beginPath();
      ctx.arc(sx, sy, i % 5 === 0 ? 1.05 : 0.65, 0, TAU);
      ctx.fill();
    }
    ctx.globalCompositeOperation = 'source-over';
    ctx.strokeStyle = '#E8C688';
    ctx.lineWidth = 0.55;
    ctx.globalAlpha = 0.13;
    ctx.beginPath();
    ctx.arc(c.x, c.y, haloR, Math.PI * 0.5 + gapHalf, Math.PI * 2.5 - gapHalf);
    ctx.stroke();
    for (let k = 0; k < 96; k++) {
      const a = (k / 96) * TAU + haloSpin;
      let rel = ((a - Math.PI * 0.5) % TAU + TAU) % TAU;
      if (rel < gapHalf || rel > TAU - gapHalf) continue;
      const major = k % 8 === 0;
      const len = major ? 3.8 : 1.5;
      ctx.globalAlpha = major ? 0.14 : 0.09;
      ctx.beginPath();
      ctx.moveTo(c.x + Math.cos(a) * haloR, c.y + Math.sin(a) * haloR);
      ctx.lineTo(c.x + Math.cos(a) * (haloR + len), c.y + Math.sin(a) * (haloR + len));
      ctx.stroke();
    }
    ctx.restore();

    // 1. 后半环（沉入古铜暗影）
    for (const fn of backDrawCalls) fn();

    // 2. 琥珀琉璃浑象球核（随 3D 缩放与浑天三环等比联动，避免放大后球核偏小）
    const coreR = clamp(Math.max(r * 0.66, c.scale * worldRadius * 0.62), 18, Math.min(w, h) * 0.15);
    const coreLocal = coreR / (worldRadius * Math.max(1e-3, c.scale));

    // (a) 极克制暖金外晕（不发糊）
    const bloom = ctx.createRadialGradient(c.x, c.y, coreR * 0.92, c.x, c.y, coreR * 1.48);
    bloom.addColorStop(0, 'rgba(240, 192, 112, 0.16)');
    bloom.addColorStop(1, 'rgba(240, 192, 112, 0)');
    ctx.globalAlpha = 1;
    ctx.fillStyle = bloom;
    ctx.beginPath();
    ctx.arc(c.x, c.y, coreR * 1.48, 0, TAU);
    ctx.fill();

    // (b) 半透明琥珀琉璃球体
    const body = ctx.createRadialGradient(c.x - coreR * 0.26, c.y - coreR * 0.30, coreR * 0.04, c.x, c.y, coreR);
    body.addColorStop(0, 'rgba(168, 112, 50, 0.82)');
    body.addColorStop(0.42, 'rgba(104, 64, 26, 0.84)');
    body.addColorStop(0.80, 'rgba(48, 29, 12, 0.88)');
    body.addColorStop(1, 'rgba(128, 82, 34, 0.92)');
    ctx.fillStyle = body;
    ctx.beginPath();
    ctx.arc(c.x, c.y, coreR, 0, TAU);
    ctx.fill();

    ctx.save();
    ctx.beginPath();
    ctx.arc(c.x, c.y, coreR - 0.4, 0, TAU);
    ctx.clip();

    // (c) 球内深处暖光（琉璃体积感）
    ctx.globalCompositeOperation = 'lighter';
    const inner = ctx.createRadialGradient(c.x, c.y, 0, c.x, c.y, coreR * 0.82);
    inner.addColorStop(0, 'rgba(255, 196, 118, 0.26)');
    inner.addColorStop(1, 'rgba(255, 196, 118, 0)');
    ctx.fillStyle = inner;
    ctx.fillRect(c.x - coreR, c.y - coreR, coreR * 2, coreR * 2);
    ctx.globalCompositeOperation = 'source-over';

    // (d) 缓慢自转的三维赤道经纬金丝网
    const meshR = coreLocal * 0.90;
    const spin = t * 0.12;
    const meshSeg = (pts, baseA, frontA, width) => {
      for (let i = 0; i < pts.length - 1; i++) {
        const p0 = pts[i], p1 = pts[i + 1];
        const front = (p0.z + p1.z) * 0.5 >= c.z;
        ctx.beginPath();
        ctx.moveTo(p0.x, p0.y);
        ctx.lineTo(p1.x, p1.y);
        ctx.strokeStyle = front ? '#F6D9A0' : '#C79A58';
        ctx.lineWidth = width;
        ctx.globalAlpha = front ? frontA : baseA;
        ctx.stroke();
      }
    };
    for (const lat of [-1.05, -0.55, 0, 0.55, 1.05]) {
      const ry = Math.sin(lat) * meshR, rr = Math.cos(lat) * meshR;
      const pts = [];
      for (let i = 0; i <= 40; i++) {
        const a = (i / 40) * TAU;
        pts.push(projectLocal3D(...rotVec(Math.cos(a) * rr, ry, Math.sin(a) * rr, 0.41, spin, 0)));
      }
      meshSeg(pts, 0.08, lat === 0 ? 0.42 : 0.24, lat === 0 ? 0.7 : 0.5);
    }
    for (let m = 0; m < 6; m++) {
      const lon = (m / 6) * Math.PI;
      const pts = [];
      for (let i = 0; i <= 40; i++) {
        const a = (i / 40) * TAU;
        const x = Math.cos(a) * meshR, y = Math.sin(a) * meshR;
        pts.push(projectLocal3D(...rotVec(x * Math.cos(lon), y, x * Math.sin(lon), 0.41, spin, 0)));
      }
      meshSeg(pts, 0.07, 0.20, 0.45);
    }

    // (e) 贯穿浑天仪主轴的「玉衡窥管」（两端微尖，中段微粗）
    {
      const dx = pBotAxis.x - pTopAxis.x, dy = pBotAxis.y - pTopAxis.y;
      const len = Math.hypot(dx, dy) || 1;
      const nx = -dy / len, ny = dx / len;
      ctx.restore();
      ctx.save();
      const tube = ctx.createLinearGradient(pTopAxis.x, pTopAxis.y, pBotAxis.x, pBotAxis.y);
      tube.addColorStop(0, '#FFF3D0');
      tube.addColorStop(0.5, '#B98F52');
      tube.addColorStop(1, '#FFF3D0');
      ctx.fillStyle = tube;
      ctx.globalAlpha = 0.86;
      ctx.beginPath();
      ctx.moveTo(pTopAxis.x, pTopAxis.y);
      ctx.lineTo(c.x + nx * 1.7, c.y + ny * 1.7);
      ctx.lineTo(pBotAxis.x, pBotAxis.y);
      ctx.lineTo(c.x - nx * 1.7, c.y - ny * 1.7);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = '#FFF8E8';
      ctx.lineWidth = 0.45;
      ctx.globalAlpha = 0.72;
      ctx.beginPath();
      ctx.moveTo(pTopAxis.x, pTopAxis.y);
      ctx.lineTo(pBotAxis.x, pBotAxis.y);
      ctx.stroke();
      // 窥管两端箍环
      for (const k of [0.12, 0.88]) {
        const qx = lerp(pTopAxis.x, pBotAxis.x, k), qy = lerp(pTopAxis.y, pBotAxis.y, k);
        const half = 2.6 * (1 - Math.abs(k - 0.5) * 0.8);
        ctx.strokeStyle = '#F4D89E';
        ctx.lineWidth = 0.8;
        ctx.globalAlpha = 0.8;
        ctx.beginPath();
        ctx.moveTo(qx + nx * half, qy + ny * half);
        ctx.lineTo(qx - nx * half, qy - ny * half);
        ctx.stroke();
      }
      ctx.restore();
      ctx.save();
      ctx.beginPath();
      ctx.arc(c.x, c.y, coreR - 0.4, 0, TAU);
      ctx.clip();
    }

    // (f) 球内缓缓游曳的微尘金粒
    ctx.globalCompositeOperation = 'lighter';
    for (const d of CORE_DUST_A) {
      const a = d.phase + t * d.speed;
      const rr = d.rad * coreLocal;
      const p = projectLocal3D(...rotVec(Math.cos(a) * rr, 0, Math.sin(a) * rr, d.incl, spin * 0.6, 0));
      const front = p.z >= c.z;
      ctx.fillStyle = '#FFE3A6';
      ctx.globalAlpha = front ? 0.78 : 0.30;
      ctx.beginPath();
      ctx.arc(p.x, p.y, d.size * (front ? 1 : 0.75), 0, TAU);
      ctx.fill();
    }

    // (g) 紫微星心：暖象牙白→赤金微星芒光核（极缓呼吸）
    const breath = 0.5 + 0.5 * Math.sin(t * 1.15);
    const heartR = coreR * (0.50 + 0.06 * breath);
    const heart = ctx.createRadialGradient(c.x, c.y, 0, c.x, c.y, heartR);
    heart.addColorStop(0, 'rgba(255, 250, 236, 0.95)');
    heart.addColorStop(0.12, 'rgba(255, 228, 168, 0.78)');
    heart.addColorStop(0.42, 'rgba(236, 164, 84, 0.24)');
    heart.addColorStop(1, 'rgba(236, 164, 84, 0)');
    ctx.fillStyle = heart;
    ctx.globalAlpha = 0.82 + 0.18 * breath;
    ctx.beginPath();
    ctx.arc(c.x, c.y, heartR, 0, TAU);
    ctx.fill();
    const spikeL = coreR * (0.40 + 0.08 * breath);
    for (const [ux, uy, k] of [[1, 0, 1], [0, 1, 1], [0.707, 0.707, 0.48], [0.707, -0.707, 0.48]]) {
      const g = ctx.createLinearGradient(c.x - ux * spikeL * k, c.y - uy * spikeL * k, c.x + ux * spikeL * k, c.y + uy * spikeL * k);
      g.addColorStop(0, 'rgba(255, 236, 196, 0)');
      g.addColorStop(0.5, 'rgba(255, 244, 222, 0.85)');
      g.addColorStop(1, 'rgba(255, 236, 196, 0)');
      ctx.strokeStyle = g;
      ctx.lineWidth = k === 1 ? 0.75 : 0.5;
      ctx.globalAlpha = 0.55 + 0.25 * breath;
      ctx.beginPath();
      ctx.moveTo(c.x - ux * spikeL * k, c.y - uy * spikeL * k);
      ctx.lineTo(c.x + ux * spikeL * k, c.y + uy * spikeL * k);
      ctx.stroke();
    }
    ctx.globalCompositeOperation = 'source-over';

    // (h) Fresnel 琉璃边缘折射光晕 + 左上玉质镜面高光
    const fres = ctx.createRadialGradient(c.x, c.y, coreR * 0.74, c.x, c.y, coreR);
    fres.addColorStop(0, 'rgba(255, 220, 160, 0)');
    fres.addColorStop(0.78, 'rgba(255, 214, 150, 0.16)');
    fres.addColorStop(1, 'rgba(255, 236, 196, 0.46)');
    ctx.fillStyle = fres;
    ctx.globalAlpha = 1;
    ctx.fillRect(c.x - coreR, c.y - coreR, coreR * 2, coreR * 2);
    const spec = ctx.createRadialGradient(c.x - coreR * 0.40, c.y - coreR * 0.46, 0, c.x - coreR * 0.40, c.y - coreR * 0.46, coreR * 0.42);
    spec.addColorStop(0, 'rgba(255, 252, 240, 0.30)');
    spec.addColorStop(1, 'rgba(255, 252, 240, 0)');
    ctx.fillStyle = spec;
    ctx.fillRect(c.x - coreR, c.y - coreR, coreR * 2, coreR * 2);
    ctx.restore();

    // (i) 球缘发丝金线 + 左上月白-香槟金锐利高光弧 + 右下温润琥珀反光弧
    ctx.globalAlpha = 0.5;
    ctx.strokeStyle = '#E8C688';
    ctx.lineWidth = 0.7;
    ctx.beginPath();
    ctx.arc(c.x, c.y, coreR, 0, TAU);
    ctx.stroke();
    ctx.globalAlpha = 0.92;
    ctx.strokeStyle = '#FFF7E6';
    ctx.lineWidth = 1.35;
    ctx.beginPath();
    ctx.arc(c.x, c.y, coreR, Math.PI * 1.03, Math.PI * 1.60);
    ctx.stroke();
    ctx.globalAlpha = 0.38;
    ctx.lineWidth = 0.6;
    ctx.beginPath();
    ctx.arc(c.x, c.y, coreR - 2.2, Math.PI * 1.10, Math.PI * 1.50);
    ctx.stroke();
    ctx.globalAlpha = 0.72;
    ctx.strokeStyle = '#D8963F';
    ctx.lineWidth = 1.15;
    ctx.beginPath();
    ctx.arc(c.x, c.y, coreR, Math.PI * 0.08, Math.PI * 0.56);
    ctx.stroke();

    // 3. 前半环（拉丝香槟金受光面 + 倒角亮线 + 云头耳卡扣）
    for (const fn of frontDrawCalls) fn();

    // 4. 正中「点绛朱砂星枢」2.5px 微珠 + 纤细渐变十字星芒
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (const [ux, uy] of [[1, 0], [0, 1]]) {
      const sg = ctx.createLinearGradient(c.x - ux * 8.5, c.y - uy * 8.5, c.x + ux * 8.5, c.y + uy * 8.5);
      sg.addColorStop(0, 'rgba(255, 224, 198, 0)');
      sg.addColorStop(0.5, 'rgba(255, 232, 208, 0.85)');
      sg.addColorStop(1, 'rgba(255, 224, 198, 0)');
      ctx.strokeStyle = sg;
      ctx.lineWidth = 0.55;
      ctx.globalAlpha = 0.72 + 0.22 * breath;
      ctx.beginPath();
      ctx.moveTo(c.x - ux * 8.5, c.y - uy * 8.5);
      ctx.lineTo(c.x + ux * 8.5, c.y + uy * 8.5);
      ctx.stroke();
    }
    ctx.restore();
    const bead = ctx.createRadialGradient(c.x - 0.35, c.y - 0.35, 0.08, c.x, c.y, 1.3);
    bead.addColorStop(0, '#FFB89B');
    bead.addColorStop(0.55, '#C84B31');
    bead.addColorStop(1, '#6E2112');
    ctx.globalAlpha = 1;
    ctx.fillStyle = bead;
    ctx.beginPath();
    ctx.arc(c.x, c.y, 1.28, 0, TAU);
    ctx.fill();
    ctx.strokeStyle = 'rgba(244, 216, 158, 0.88)';
    ctx.lineWidth = 0.45;
    ctx.beginPath();
    ctx.arc(c.x, c.y, 1.95, 0, TAU);
    ctx.stroke();

    // 5. 宋版刻本牌记铭牌：严格置于最外层浑天仪净空之外（≥ 22px 呼吸间距）
    const titleFontPx = clamp(r * 0.36, 13, 15.5);
    const titleY = maxY + 22 + titleFontPx * 0.5;
    ctx.save();
    ctx.shadowColor = '#080706';
    ctx.shadowBlur = 9;
    ctx.font = `600 ${titleFontPx}px "Noto Serif SC", "Songti SC", serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    const mainTitle = '天穹钟摆';
    const titleW = ctx.measureText(mainTitle).width;
    const sealSize = 12;
    const groupW = titleW + 6 + sealSize;
    const titleCx = c.x - (sealSize + 6) * 0.5;
    ctx.fillStyle = '#F7EFE0';
    ctx.fillText(mainTitle, titleCx, titleY);
    ctx.restore();

    // 小篆朱砂方章「枢」（阴文：朱底白字 + 内缩细框）
    const sealX = titleCx + titleW * 0.5 + 6;
    const sealY = titleY - sealSize * 0.5;
    ctx.save();
    ctx.fillStyle = '#B9432B';
    ctx.globalAlpha = 0.96;
    ctx.beginPath();
    ctx.moveTo(sealX + 0.6, sealY);
    ctx.lineTo(sealX + sealSize, sealY + 0.4);
    ctx.lineTo(sealX + sealSize - 0.3, sealY + sealSize);
    ctx.lineTo(sealX, sealY + sealSize - 0.4);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = 'rgba(255, 238, 214, 0.78)';
    ctx.lineWidth = 0.55;
    ctx.strokeRect(sealX + 1.4, sealY + 1.4, sealSize - 2.8, sealSize - 2.8);
    ctx.font = '700 8px "Noto Serif SC", "Songti SC", serif';
    ctx.fillStyle = '#FFF2DE';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('枢', sealX + sealSize * 0.5, sealY + sealSize * 0.54);
    ctx.restore();

    // 微距古籍「鱼尾」细金线承托副标
    const ywY = titleY + titleFontPx * 0.5 + 6;
    const ywHalf = Math.max(groupW * 0.5 + 10, 44);
    ctx.save();
    for (const dir of [-1, 1]) {
      const g = ctx.createLinearGradient(c.x + dir * 5, ywY, c.x + dir * ywHalf, ywY);
      g.addColorStop(0, 'rgba(232, 198, 136, 0.78)');
      g.addColorStop(1, 'rgba(232, 198, 136, 0)');
      ctx.strokeStyle = g;
      ctx.lineWidth = 0.6;
      ctx.beginPath();
      ctx.moveTo(c.x + dir * 5, ywY);
      ctx.lineTo(c.x + dir * ywHalf, ywY);
      ctx.stroke();
    }
    // 鱼尾（双尾燕剪形微标）
    ctx.fillStyle = '#C84B31';
    ctx.globalAlpha = 0.9;
    ctx.beginPath();
    ctx.moveTo(c.x - 4.5, ywY - 2.2);
    ctx.lineTo(c.x, ywY + 0.6);
    ctx.lineTo(c.x + 4.5, ywY - 2.2);
    ctx.lineTo(c.x + 4.5, ywY + 2.2);
    ctx.lineTo(c.x, ywY - 0.4);
    ctx.lineTo(c.x - 4.5, ywY + 2.2);
    ctx.closePath();
    ctx.fill();
    ctx.globalAlpha = 0.88;
    ctx.shadowColor = '#080706';
    ctx.shadowBlur = 6;
    ctx.font = '500 9.5px "Noto Serif SC", "Songti SC", serif';
    ctx.fillStyle = '#D8B77A';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('天枢紫微 · 零度', c.x, ywY + 11);
    ctx.restore();

    // 供标签防碰撞与星盘刻字退避使用的主星净空包围盒
    c.titleBoxA = { x1: c.x - ywHalf - 4, y1: titleY - titleFontPx * 0.5 - 4, x2: c.x + ywHalf + 4, y2: ywY + 18 };
    c.armillaryBoxA = { x1: c.x - maxDist - 6, y1: c.y - maxDist - 6, x2: c.x + maxDist + 6, y2: maxY + 6 };
    ctx.restore();
  }

  function drawTopologyPrismCore(ctx, c, clock, w, h) {
    const r = c.radius;
    const t = clock * 0.001;
    ctx.save();

    // 1. 极克制的冷青/欧泊棱镜折射背景光场（非实心模糊光球）
    const aura = ctx.createRadialGradient(c.x, c.y, r * 0.1, c.x, c.y, r * 2.1);
    aura.addColorStop(0, 'rgba(71, 215, 232, 0.16)');
    aura.addColorStop(0.45, 'rgba(140, 123, 255, 0.07)');
    aura.addColorStop(1, 'rgba(4, 7, 13, 0)');
    ctx.fillStyle = aura;
    ctx.beginPath();
    ctx.arc(c.x, c.y, r * 2.1, 0, TAU);
    ctx.fill();

    // 3D 局部顶点投影辅助函数（围绕中心主星 (0, c.wy, 0) 随相机 3D 旋转）
    const worldRadius = 0.44;
    const projectLocal3D = (lx, ly, lz) => project3D(lx * worldRadius, c.wy + ly * worldRadius, lz * worldRadius, w, h);

    const rotVec = (x, y, z, rx, ry, rz) => {
      // 绕 X
      let y1 = y * Math.cos(rx) - z * Math.sin(rx);
      let z1 = y * Math.sin(rx) + z * Math.cos(rx);
      // 绕 Y
      let x2 = x * Math.cos(ry) + z1 * Math.sin(ry);
      let z2 = -x * Math.sin(ry) + z1 * Math.cos(ry);
      // 绕 Z
      let x3 = x2 * Math.cos(rz) - y1 * Math.sin(rz);
      let y3 = x2 * Math.sin(rz) + y1 * Math.cos(rz);
      return [x3, y3, z2];
    };

    // 2. 3 道三维正交偏转的极细陀螺仪子午环（带微方位刻度刻痕）
    const gyroConfigs = [
      { rad: 1.48, rx: 0.35 + t * 0.16, ry: -0.22 + t * 0.11, rz: 0.18, col: '#EAF3FF', alpha: 0.46, ticks: 24 },
      { rad: 1.28, rx: 1.22 - t * 0.14, ry: 0.48 + t * 0.19, rz: -0.52, col: '#47D7E8', alpha: 0.54, ticks: 16 },
      { rad: 1.12, rx: -0.68 + t * 0.12, ry: 1.05 - t * 0.15, rz: 0.84, col: '#8C7BFF', alpha: 0.42, ticks: 12 }
    ];

    for (const g of gyroConfigs) {
      const segs = 48;
      const ringPts = [];
      for (let i = 0; i <= segs; i++) {
        const a = (i / segs) * TAU;
        const [rx, ry, rz] = rotVec(Math.cos(a) * g.rad, 0, Math.sin(a) * g.rad, g.rx, g.ry, g.rz);
        ringPts.push(projectLocal3D(rx, ry, rz));
      }
      ctx.beginPath();
      for (let i = 0; i <= segs; i++) {
        if (i === 0) ctx.moveTo(ringPts[i].x, ringPts[i].y);
        else ctx.lineTo(ringPts[i].x, ringPts[i].y);
      }
      ctx.strokeStyle = g.col;
      ctx.lineWidth = 0.78;
      ctx.globalAlpha = g.alpha;
      ctx.stroke();

      // 子午环微方位刻度刻痕
      for (let k = 0; k < g.ticks; k++) {
        const a = (k / g.ticks) * TAU;
        const major = k % 4 === 0;
        const rIn = g.rad * (major ? 0.93 : 0.965);
        const rOut = g.rad * (major ? 1.05 : 1.02);
        const pIn = projectLocal3D(...rotVec(Math.cos(a) * rIn, 0, Math.sin(a) * rIn, g.rx, g.ry, g.rz));
        const pOut = projectLocal3D(...rotVec(Math.cos(a) * rOut, 0, Math.sin(a) * rOut, g.rx, g.ry, g.rz));
        ctx.beginPath();
        ctx.moveTo(pIn.x, pIn.y);
        ctx.lineTo(pOut.x, pOut.y);
        ctx.strokeStyle = major ? '#EAF3FF' : g.col;
        ctx.lineWidth = major ? 0.95 : 0.65;
        ctx.globalAlpha = g.alpha * (major ? 1.15 : 0.75);
        ctx.stroke();
      }
    }

    // 3. 半透明晶体八面体线框棱镜核（Octahedral Crystal Wireframe Prism）
    const spinY = t * 0.28;
    const spinX = Math.sin(t * 0.35) * 0.16;
    const spinZ = 0.14;
    const rawVerts = [
      [0, 1.06, 0],   // 0: 顶极点
      [0, -1.06, 0],  // 1: 底极点
      [0.78, 0, 0],   // 2: 东
      [0, 0, 0.78],   // 3: 南
      [-0.78, 0, 0],  // 4: 西
      [0, 0, -0.78]   // 5: 北
    ];
    const verts = rawVerts.map(v => projectLocal3D(...rotVec(v[0], v[1], v[2], spinX, spinY, spinZ)));
    const faces = [
      { idx: [0, 2, 3], tint: 'rgba(234, 243, 255, 0.12)' },
      { idx: [0, 3, 4], tint: 'rgba(71, 215, 232, 0.15)' },
      { idx: [0, 4, 5], tint: 'rgba(140, 123, 255, 0.12)' },
      { idx: [0, 5, 2], tint: 'rgba(71, 215, 232, 0.10)' },
      { idx: [1, 3, 2], tint: 'rgba(140, 123, 255, 0.13)' },
      { idx: [1, 4, 3], tint: 'rgba(234, 243, 255, 0.09)' },
      { idx: [1, 5, 4], tint: 'rgba(71, 215, 232, 0.11)' },
      { idx: [1, 2, 5], tint: 'rgba(140, 123, 255, 0.09)' }
    ].map(f => {
      const p0 = verts[f.idx[0]], p1 = verts[f.idx[1]], p2 = verts[f.idx[2]];
      return { ...f, p0, p1, p2, zAvg: (p0.z + p1.z + p2.z) / 3 };
    }).sort((a, b) => a.zAvg - b.zAvg);

    for (const f of faces) {
      ctx.beginPath();
      ctx.moveTo(f.p0.x, f.p0.y);
      ctx.lineTo(f.p1.x, f.p1.y);
      ctx.lineTo(f.p2.x, f.p2.y);
      ctx.closePath();
      ctx.fillStyle = f.tint;
      ctx.globalAlpha = 1.0;
      ctx.fill();
      ctx.strokeStyle = f.zAvg > c.z ? 'rgba(234, 243, 255, 0.82)' : 'rgba(71, 215, 232, 0.34)';
      ctx.lineWidth = f.zAvg > c.z ? 1.05 : 0.7;
      ctx.stroke();
    }

    // 内部主轴线与四芒锐利棱晶星芯
    ctx.strokeStyle = 'rgba(71, 215, 232, 0.42)';
    ctx.lineWidth = 0.7;
    ctx.beginPath();
    ctx.moveTo(verts[0].x, verts[0].y); ctx.lineTo(verts[1].x, verts[1].y);
    ctx.moveTo(verts[2].x, verts[2].y); ctx.lineTo(verts[4].x, verts[4].y);
    ctx.moveTo(verts[3].x, verts[3].y); ctx.lineTo(verts[5].x, verts[5].y);
    ctx.stroke();

    // 中心四芒光学衍射星芯
    const coreArm = r * 0.26;
    ctx.fillStyle = '#EAF3FF';
    ctx.beginPath();
    ctx.moveTo(c.x, c.y - coreArm);
    ctx.lineTo(c.x + coreArm * 0.32, c.y - coreArm * 0.32);
    ctx.lineTo(c.x + coreArm, c.y);
    ctx.lineTo(c.x + coreArm * 0.32, c.y + coreArm * 0.32);
    ctx.lineTo(c.x, c.y + coreArm);
    ctx.lineTo(c.x - coreArm * 0.32, c.y + coreArm * 0.32);
    ctx.lineTo(c.x - coreArm, c.y);
    ctx.lineTo(c.x - coreArm * 0.32, c.y - coreArm * 0.32);
    ctx.closePath();
    ctx.fill();

    // 核心铭文（去胶囊冷铂排印）
    ctx.font = `600 ${clamp(r * 0.32, 11, 13.5)}px "PingFang SC", "Microsoft YaHei", sans-serif`;
    ctx.fillStyle = '#EAF3FF';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.shadowColor = '#04070D';
    ctx.shadowBlur = 7;
    ctx.fillText('天穹钟摆', c.x, c.y + r * 1.48);

    ctx.font = '500 9px "JetBrains Mono", Consolas, monospace';
    ctx.fillStyle = '#47D7E8';
    ctx.globalAlpha = 0.78;
    ctx.fillText('PRISM CORE // 00', c.x, c.y + r * 1.48 + 13);
    ctx.restore();
  }

  function drawAstrolabeOrbit(ctx, sItem, w, h) {
    const s = sItem.set;
    const steps = 84;
    const pts = [];
    for (let i = 0; i <= steps; i++) {
      const a = i / steps * TAU;
      const [wx, wy, wz] = orbitWorldPos(s, a);
      pts.push(project3D(wx, wy, wz, w, h));
    }
    ctx.save();
    for (let i = 0; i < steps; i++) {
      const p0 = pts[i], p1 = pts[i + 1];
      const depth = (p0.depthNorm + p1.depthNorm) * 0.5;
      // 前半圈清亮、后半圈隐入暗影
      const alpha = (0.06 + 0.42 * Math.pow(depth, 1.45)) * s.focusWeight;
      ctx.beginPath();
      ctx.moveTo(p0.x, p0.y);
      ctx.lineTo(p1.x, p1.y);
      ctx.strokeStyle = '#d8b87e';
      ctx.globalAlpha = alpha;
      ctx.lineWidth = 0.7 + 0.35 * depth;
      ctx.stroke();
    }
    // 轨道局部经纬微刻度点（每 15° 一枚）
    for (let i = 0; i < 24; i++) {
      const pt = pts[Math.round(i * steps / 24)];
      const alpha = (0.08 + 0.48 * pt.depthNorm) * s.focusWeight;
      ctx.fillStyle = '#efd29a';
      ctx.globalAlpha = alpha;
      ctx.beginPath();
      ctx.arc(pt.x, pt.y, i % 6 === 0 ? 1.35 : 0.85, 0, TAU);
      ctx.fill();
    }
    ctx.restore();
  }

  function drawTopologyDomain(ctx, sItem) {
    const { set: s, x, y, radius: r, depthNorm } = sItem;
    const isEmpty = s.entries.length === 0;
    const isRimActive = state.rimHoverSetId === s.id || state.resizingSetId === s.id;
    const isSetHovered = state.hoveredSetId === s.id || state.focusedSetId === s.id;
    const baseAlpha = (0.48 + 0.52 * depthNorm) * s.focusWeight;
    const col = s.coldHue;

    ctx.save();
    if (isEmpty) {
      // 空设定集（· 0）：低透明度的虚线棱形空间切片 + 中心缓慢旋转的空心菱形校准框
      const rot = state.clock * 0.00038;
      ctx.setLineDash([4.5, 4]);
      ctx.strokeStyle = isRimActive ? '#47D7E8' : col;
      ctx.lineWidth = isRimActive ? 1.45 : 0.95;
      ctx.globalAlpha = baseAlpha * (isRimActive ? 0.95 : 0.56);

      // 外围八角棱形切片轮廓
      ctx.beginPath();
      for (let i = 0; i < 8; i++) {
        const a = i * (TAU / 8) + Math.PI / 8;
        const rad = i % 2 === 0 ? r * 1.02 : r * 0.88;
        const px = x + Math.cos(a) * rad;
        const py = y + Math.sin(a) * rad;
        if (i === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      }
      ctx.closePath();
      ctx.stroke();
      ctx.setLineDash([]);

      // 内部十字准星极细分割线
      ctx.strokeStyle = col;
      ctx.lineWidth = 0.65;
      ctx.globalAlpha = baseAlpha * 0.25;
      ctx.beginPath();
      ctx.moveTo(x - r * 0.62, y); ctx.lineTo(x + r * 0.62, y);
      ctx.moveTo(x, y - r * 0.62); ctx.lineTo(x, y + r * 0.62);
      ctx.stroke();

      // 中心缓慢旋转的双层空心菱形校准框
      for (let layer = 0; layer < 2; layer++) {
        const dr = (layer === 0 ? 11.5 : 6.2) * clamp(r / 42, 0.78, 1.35);
        const ang = layer === 0 ? rot : -rot * 1.4;
        ctx.strokeStyle = layer === 0 ? '#47D7E8' : '#EAF3FF';
        ctx.lineWidth = layer === 0 ? 1.05 : 0.8;
        ctx.globalAlpha = baseAlpha * (layer === 0 ? 0.82 : 0.62);
        ctx.beginPath();
        for (let k = 0; k < 4; k++) {
          const a = ang + k * (Math.PI * 0.5);
          const px = x + Math.cos(a) * dr;
          const py = y + Math.sin(a) * dr;
          if (k === 0) ctx.moveTo(px, py);
          else ctx.lineTo(px, py);
        }
        ctx.closePath();
        ctx.stroke();
      }
    } else {
      // 有条目设定集上层星域：四段留白的精密弧形卡尺括弧（Quadrant Caliper Brackets）
      const activeCol = isRimActive ? '#47D7E8' : isSetHovered ? '#EAF3FF' : col;
      const bracketAlpha = baseAlpha * (isRimActive ? 0.96 : isSetHovered ? 0.76 : 0.44);
      const span = 0.48; // 每象限括弧半角跨度（留出四极断开缺口）
      const serifLen = isRimActive ? 6.2 : 4.2;

      for (let q = 0; q < 4; q++) {
        const midA = q * (Math.PI * 0.5) + Math.PI * 0.25;
        const a0 = midA - span;
        const a1 = midA + span;

        // 主卡尺断弧
        ctx.strokeStyle = activeCol;
        ctx.lineWidth = isRimActive ? 1.65 : isSetHovered ? 1.2 : 0.92;
        ctx.globalAlpha = bracketAlpha;
        ctx.beginPath();
        ctx.arc(x, y, r, a0, a1);
        ctx.stroke();

        // 括弧两端向内折角卡尺游标端线 (Caliper End Serifs)
        ctx.beginPath();
        ctx.moveTo(x + Math.cos(a0) * r, y + Math.sin(a0) * r);
        ctx.lineTo(x + Math.cos(a0) * (r - serifLen), y + Math.sin(a0) * (r - serifLen));
        ctx.moveTo(x + Math.cos(a1) * r, y + Math.sin(a1) * r);
        ctx.lineTo(x + Math.cos(a1) * (r - serifLen), y + Math.sin(a1) * (r - serifLen));
        ctx.stroke();

        // 弧段内部精密测绘微刻度
        ctx.lineWidth = 0.7;
        ctx.globalAlpha = bracketAlpha * 0.7;
        for (let t = 1; t <= 3; t++) {
          const ta = lerp(a0, a1, t / 4);
          const tickL = t === 2 ? 4.2 : 2.4;
          ctx.beginPath();
          ctx.moveTo(x + Math.cos(ta) * (r - tickL), y + Math.sin(ta) * (r - tickL));
          ctx.lineTo(x + Math.cos(ta) * r, y + Math.sin(ta) * r);
          ctx.stroke();
        }
      }

      // 四极点留白缺口处的微小测绘十字/菱形刻度 (0°, 90°, 180°, 270°)
      for (let p = 0; p < 4; p++) {
        const pa = p * (Math.PI * 0.5);
        const px = x + Math.cos(pa) * r;
        const py = y + Math.sin(pa) * r;
        const arm = isRimActive ? 3.5 : 2.3;
        ctx.strokeStyle = isRimActive ? '#47D7E8' : col;
        ctx.lineWidth = 0.8;
        ctx.globalAlpha = baseAlpha * (isRimActive ? 0.92 : 0.48);
        ctx.beginPath();
        ctx.moveTo(px - arm, py); ctx.lineTo(px + arm, py);
        ctx.moveTo(px, py - arm); ctx.lineTo(px, py + arm);
        ctx.stroke();
      }
    }

    // 当鼠标靠近卡尺弧边或正在拖拽缩放时：亮起冰青高光外轨并弹出 4 枚精密菱形拖拽手柄
    if (isRimActive) {
      ctx.setLineDash([2, 3.5]);
      ctx.strokeStyle = '#47D7E8';
      ctx.lineWidth = 0.85;
      ctx.globalAlpha = baseAlpha * 0.65;
      ctx.beginPath();
      ctx.arc(x, y, r + 5, 0, TAU);
      ctx.stroke();
      ctx.setLineDash([]);

      for (let q = 0; q < 4; q++) {
        const ha = q * (Math.PI * 0.5) + Math.PI * 0.25;
        const hx = x + Math.cos(ha) * r;
        const hy = y + Math.sin(ha) * r;
        const d = 4.2;
        ctx.fillStyle = '#04070D';
        ctx.strokeStyle = '#47D7E8';
        ctx.lineWidth = 1.25;
        ctx.globalAlpha = 0.98;
        ctx.beginPath();
        ctx.moveTo(hx, hy - d);
        ctx.lineTo(hx + d, hy);
        ctx.lineTo(hx, hy + d);
        ctx.lineTo(hx - d, hy);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
      }
    }
    ctx.restore();
  }

  function drawAstrolabeDomain(ctx, sItem) {
    const { set: s, x, y, radius: r, depthNorm } = sItem;
    const isEmpty = s.entries.length === 0;
    const isRimActive = state.rimHoverSetId === s.id || state.resizingSetId === s.id;
    const isSetHovered = state.hoveredSetId === s.id || state.focusedSetId === s.id;
    const baseAlpha = (0.46 + 0.54 * depthNorm) * s.focusWeight;
    const goldCol = '#E8C688';
    const mineralCol = s.mineralA || s.hueA;
    const t = state.clock * 0.001;

    ctx.save();
    // 1. 低饱和传统矿物色星云柔纱（平滑径向衰减至 r*1.18，自然融化于松烟墨夜空，无硬圆边切割感）
    const emptyBreathe = isEmpty ? (0.76 + 0.24 * Math.sin(t * 1.5)) : 1;
    const veilR = r * 1.18;
    const field = ctx.createRadialGradient(x, y, r * 0.02, x, y, veilR);
    const veilBoost = isSetHovered || isRimActive ? 1.45 : 1.0;
    field.addColorStop(0.0, hexToRgba(mineralCol, (isEmpty ? 0.042 : 0.068) * veilBoost * emptyBreathe));
    field.addColorStop(0.42, hexToRgba(mineralCol, (isEmpty ? 0.022 : 0.038) * veilBoost * emptyBreathe));
    field.addColorStop(0.76, hexToRgba(goldCol, (isEmpty ? 0.008 : 0.014) * veilBoost));
    field.addColorStop(1.0, 'rgba(8, 7, 6, 0)');
    ctx.globalAlpha = baseAlpha;
    ctx.fillStyle = field;
    ctx.beginPath();
    ctx.arc(x, y, veilR, 0, TAU);
    ctx.fill();

    // 2. 内部极淡 3D 球面赤纬斜环（随 360° 视角旋转展现三维星垣体积感）
    const domainWorldR = s.baseDomainRadius * s.domainScale * 0.88;
    const tiltA = s.inclination * 1.4 + 0.42;
    const tiltB = s.tilt * 1.6 - 0.28;
    const ringSegs = 40;
    ctx.beginPath();
    for (let i = 0; i <= ringSegs; i++) {
      const a = (i / ringSegs) * TAU;
      const lx = Math.cos(a) * domainWorldR;
      const lz = Math.sin(a) * domainWorldR;
      const ly = lx * Math.sin(tiltA) * 0.38 + lz * Math.sin(tiltB) * 0.38;
      const p3 = project3D(sItem.wx + lx, sItem.wy + ly, sItem.wz + lz * Math.cos(tiltA), viewSize.width, viewSize.height);
      if (i === 0) ctx.moveTo(p3.x, p3.y);
      else ctx.lineTo(p3.x, p3.y);
    }
    ctx.setLineDash([2, 4.5]);
    ctx.strokeStyle = isSetHovered ? mineralCol : goldCol;
    ctx.lineWidth = 0.55;
    ctx.globalAlpha = baseAlpha * (isSetHovered ? 0.34 : 0.14);
    ctx.stroke();
    ctx.setLineDash([]);

    if (isEmpty) {
      // 空设定集（未勘定星域）：雅致虚线古星盘准星 + 中心缓慢呼吸的极细空心八芒校准微标 + 漂浮微弱金尘
      const rot = t * 0.18;
      const pulse = 0.72 + 0.28 * Math.sin(t * 1.45);
      ctx.setLineDash([4, 4.5]);
      ctx.strokeStyle = isRimActive ? '#FFF0CC' : goldCol;
      ctx.lineWidth = isRimActive ? 1.2 : 0.75;
      ctx.globalAlpha = baseAlpha * (isRimActive ? 0.88 : 0.52);
      ctx.beginPath();
      ctx.arc(x, y, r, 0, TAU);
      ctx.stroke();

      ctx.setLineDash([1.6, 5]);
      ctx.strokeStyle = mineralCol;
      ctx.lineWidth = 0.55;
      ctx.globalAlpha = baseAlpha * 0.36;
      ctx.beginPath();
      ctx.arc(x, y, r * 0.68, 0, TAU);
      ctx.stroke();
      ctx.setLineDash([]);

      // 四正古星盘准星微刻
      for (let i = 0; i < 12; i++) {
        const a = (i / 12) * TAU;
        const isCardinal = i % 3 === 0;
        const len = isCardinal ? 5.2 : 2.0;
        ctx.strokeStyle = goldCol;
        ctx.lineWidth = isCardinal ? 0.72 : 0.48;
        ctx.globalAlpha = baseAlpha * (isCardinal ? 0.54 : 0.24);
        ctx.beginPath();
        ctx.moveTo(x + Math.cos(a) * (r - len), y + Math.sin(a) * (r - len));
        ctx.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r);
        ctx.stroke();
      }

      // 中心缓慢呼吸的极细空心八芒校准微标
      const starOuter = clamp(r * 0.30, 9.5, 16) * (0.94 + 0.08 * pulse);
      const starInner = starOuter * 0.34;
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(rot);
      ctx.beginPath();
      for (let i = 0; i < 16; i++) {
        const a = (i / 16) * TAU;
        const rr = i % 2 === 0 ? starOuter : starInner;
        const px = Math.cos(a) * rr, py = Math.sin(a) * rr;
        if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.closePath();
      ctx.strokeStyle = '#EAD09B';
      ctx.lineWidth = 0.65;
      ctx.globalAlpha = baseAlpha * (0.48 + 0.28 * pulse);
      ctx.stroke();
      // 极细内圆定标环 + 炽白针尖心
      ctx.beginPath();
      ctx.arc(0, 0, starInner * 0.58, 0, TAU);
      ctx.strokeStyle = mineralCol;
      ctx.lineWidth = 0.5;
      ctx.globalAlpha = baseAlpha * 0.55;
      ctx.stroke();
      ctx.globalCompositeOperation = 'lighter';
      ctx.fillStyle = '#FFFDF6';
      ctx.globalAlpha = baseAlpha * (0.65 + 0.25 * pulse);
      ctx.beginPath();
      ctx.arc(0, 0, 1.05, 0, TAU);
      ctx.fill();
      ctx.restore();

      // 若干粒极其微弱的漂浮金尘
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      for (let i = 0; i < 9; i++) {
        const a = i * 0.72 + t * (0.14 + (i % 3) * 0.05) * (i % 2 ? 1 : -1);
        const rr = r * (0.36 + ((i * 37) % 52) * 0.01);
        const tw = 0.45 + 0.55 * Math.sin(t * 1.8 + i * 2.3);
        ctx.fillStyle = i % 3 === 0 ? '#FFF6E0' : '#E8C688';
        ctx.globalAlpha = baseAlpha * 0.32 * tw;
        ctx.beginPath();
        ctx.arc(x + Math.cos(a) * rr, y + Math.sin(a) * rr, i % 4 === 0 ? 0.95 : 0.6, 0, TAU);
        ctx.fill();
      }
      ctx.restore();

      if (r >= 26) {
        ctx.font = '500 8.5px "Noto Serif SC", "Songti SC", serif';
        ctx.fillStyle = '#D8B77A';
        ctx.globalAlpha = baseAlpha * 0.62;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('未名星野', x, y + r * 0.58);
      }
    } else {
      // 有条目星域：极细（0.65px–0.85px）渐变呼吸双层断弧星垣环 + 微距分度短刻痕 + 四象微雕小菱标
      const mainCol = isRimActive ? '#FFF1CF' : isSetHovered ? '#F5DCA8' : goldCol;
      const peakAlpha = baseAlpha * (isRimActive ? 0.92 : isSetHovered ? 0.72 : 0.46);
      const gapHalf = 0.16;
      const arcSegs = 12;

      // 1. 外层极细渐变呼吸四象限断弧（两端向断口自然淡隐，消除生硬圆环切割感）
      ctx.lineCap = 'round';
      for (let q = 0; q < 4; q++) {
        const aStart = q * (Math.PI * 0.5) + gapHalf;
        const aEnd = (q + 1) * (Math.PI * 0.5) - gapHalf;
        for (let j = 0; j < arcSegs; j++) {
          const u0 = j / arcSegs, u1 = (j + 1) / arcSegs;
          const midU = (u0 + u1) * 0.5;
          const taper = 0.22 + 0.78 * Math.sin(Math.PI * midU);
          ctx.beginPath();
          ctx.arc(x, y, r, lerp(aStart, aEnd, u0), lerp(aStart, aEnd, u1));
          ctx.strokeStyle = mainCol;
          ctx.lineWidth = isRimActive ? 1.25 : isSetHovered ? 0.88 : 0.72;
          ctx.globalAlpha = peakAlpha * taper;
          ctx.stroke();
        }
      }

      // 2. 次外层极细星垣呼应双弧（偏置相位，0.55px 游丝感）
      const innerR = Math.max(12, r - 4.4);
      for (let q = 0; q < 4; q++) {
        const aStart = q * (Math.PI * 0.5) + 0.34;
        const aEnd = (q + 1) * (Math.PI * 0.5) - 0.34;
        ctx.beginPath();
        ctx.arc(x, y, innerR, aStart, aEnd);
        ctx.strokeStyle = isSetHovered ? mineralCol : goldCol;
        ctx.lineWidth = 0.55;
        ctx.globalAlpha = baseAlpha * (isRimActive ? 0.48 : isSetHovered ? 0.34 : 0.20);
        ctx.stroke();
      }

      // 3. 局部极精密微距分度短刻痕
      for (let i = 0; i < 36; i++) {
        if (i % 9 === 0 || i % 9 === 1 || i % 9 === 8) continue;
        const a = (i / 36) * TAU;
        const major = i % 3 === 0;
        const r0 = major ? innerR - 0.5 : innerR + 1.8;
        ctx.strokeStyle = isRimActive ? '#FFE9BA' : goldCol;
        ctx.lineWidth = major ? 0.62 : 0.45;
        ctx.globalAlpha = baseAlpha * (isRimActive ? (major ? 0.62 : 0.34) : (major ? 0.28 : 0.13));
        ctx.beginPath();
        ctx.moveTo(x + Math.cos(a) * r0, y + Math.sin(a) * r0);
        ctx.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r);
        ctx.stroke();
      }

      // 4. 四象正位（子午卯酉）断口处的微雕小菱标（极简精工镂空菱形 + 微矿物光点）
      for (let k = 0; k < 4; k++) {
        const a = k * (Math.PI * 0.5);
        const cx = x + Math.cos(a) * r;
        const cy = y + Math.sin(a) * r;
        const d = isRimActive ? 3.4 : 2.6;
        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(a);
        ctx.beginPath();
        ctx.moveTo(0, -d);
        ctx.lineTo(d * 0.72, 0);
        ctx.lineTo(0, d);
        ctx.lineTo(-d * 0.72, 0);
        ctx.closePath();
        ctx.strokeStyle = isRimActive ? '#FFF0CC' : (k % 2 === 0 ? goldCol : mineralCol);
        ctx.lineWidth = isRimActive ? 0.9 : 0.68;
        ctx.globalAlpha = baseAlpha * (isRimActive ? 0.94 : 0.68);
        ctx.stroke();

        ctx.globalCompositeOperation = 'lighter';
        ctx.fillStyle = isRimActive ? '#C84B31' : (k % 2 === 0 ? '#FFF2D4' : mineralCol);
        ctx.globalAlpha = baseAlpha * (isRimActive ? 0.95 : 0.72);
        ctx.beginPath();
        ctx.arc(0, 0, isRimActive ? 1.15 : 0.8, 0, TAU);
        ctx.fill();
        ctx.restore();
      }
    }

    // 5. 拖拽圆边缩放热区激活时：外环亮起香槟金流光轨与 4 枚微菱锚点
    if (isRimActive) {
      ctx.setLineDash([2, 3.5]);
      ctx.strokeStyle = '#FFE7B5';
      ctx.lineWidth = 0.75;
      ctx.globalAlpha = baseAlpha * 0.68;
      ctx.beginPath();
      ctx.arc(x, y, r + 5, 0, TAU);
      ctx.stroke();
      ctx.setLineDash([]);

      for (let q = 0; q < 4; q++) {
        const ha = q * (Math.PI * 0.5) + Math.PI * 0.25;
        const hx = x + Math.cos(ha) * r;
        const hy = y + Math.sin(ha) * r;
        const d = 3.4;
        ctx.strokeStyle = '#FFE7B5';
        ctx.lineWidth = 1.0;
        ctx.globalAlpha = 0.96;
        ctx.beginPath();
        ctx.moveTo(hx, hy - d);
        ctx.lineTo(hx + d, hy);
        ctx.lineTo(hx, hy + d);
        ctx.lineTo(hx - d, hy);
        ctx.closePath();
        ctx.stroke();
      }
    }
    ctx.restore();
  }

  function drawTopologyCrystalNode(ctx, nItem) {
    const { entry: e, set: s, x, y, radius: r, depthNorm } = nItem;
    const isHovered = state.hoveredNodeId === e.id;
    const alpha = clamp((0.46 + 0.54 * depthNorm) * e.focusWeight, 0.06, 1.0);
    const col = s.coldHue;

    ctx.save();
    ctx.globalAlpha = alpha;

    if (e.tier === 1) {
      // 高关联权重核心条目：锐利空心双层四芒菱晶 + 克制的极细十字光学星芒衍射
      const spikeLen = r * (isHovered ? 2.65 : 2.05);
      ctx.strokeStyle = isHovered ? '#47D7E8' : col;
      ctx.lineWidth = isHovered ? 0.95 : 0.72;
      ctx.globalAlpha = alpha * (isHovered ? 0.88 : 0.52);
      ctx.beginPath();
      ctx.moveTo(x - spikeLen, y); ctx.lineTo(x + spikeLen, y);
      ctx.moveTo(x, y - spikeLen); ctx.lineTo(x, y + spikeLen);
      ctx.stroke();

      // 外层四芒锐利切面菱晶（4-Point Star Facet）
      const outR = r * 1.32;
      const waist = r * 0.38;
      ctx.globalAlpha = alpha;
      ctx.fillStyle = 'rgba(4, 9, 18, 0.90)';
      ctx.strokeStyle = isHovered ? '#47D7E8' : '#EAF3FF';
      ctx.lineWidth = isHovered ? 1.45 : 1.15;
      ctx.beginPath();
      ctx.moveTo(x, y - outR);
      ctx.lineTo(x + waist, y - waist);
      ctx.lineTo(x + outR, y);
      ctx.lineTo(x + waist, y + waist);
      ctx.lineTo(x, y + outR);
      ctx.lineTo(x - waist, y + waist);
      ctx.lineTo(x - outR, y);
      ctx.lineTo(x - waist, y - waist);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // 内层空心菱形晶核
      const inR = r * 0.62;
      ctx.strokeStyle = isHovered ? '#EAF3FF' : col;
      ctx.lineWidth = 0.85;
      ctx.beginPath();
      ctx.moveTo(x, y - inR);
      ctx.lineTo(x + inR, y);
      ctx.lineTo(x, y + inR);
      ctx.lineTo(x - inR, y);
      ctx.closePath();
      ctx.stroke();

      // 中心极微高光菱点
      const coreD = 1.9;
      ctx.fillStyle = '#EAF3FF';
      ctx.beginPath();
      ctx.moveTo(x, y - coreD);
      ctx.lineTo(x + coreD, y);
      ctx.lineTo(x, y + coreD);
      ctx.lineTo(x - coreD, y);
      ctx.closePath();
      ctx.fill();
    } else {
      // 普通条目（Tier 2 / Tier 3）：精致的小型实心微光棱形切面标点（零小圆点）
      const ry = r * 1.16;
      const rx = r * 0.86;

      if (isHovered) {
        // 悬停时外围弹出空心菱形锁定框与十字短衍射丝
        const lockR = ry * 1.55;
        ctx.strokeStyle = '#47D7E8';
        ctx.lineWidth = 0.9;
        ctx.globalAlpha = alpha * 0.82;
        ctx.beginPath();
        ctx.moveTo(x, y - lockR);
        ctx.lineTo(x + lockR * 0.82, y);
        ctx.lineTo(x, y + lockR);
        ctx.lineTo(x - lockR * 0.82, y);
        ctx.closePath();
        ctx.stroke();
      }

      // 左半晶体切面（高光冷白/冷铂折射面）
      ctx.globalAlpha = alpha;
      ctx.fillStyle = isHovered ? '#EAF3FF' : col;
      ctx.beginPath();
      ctx.moveTo(x, y - ry);
      ctx.lineTo(x, y + ry);
      ctx.lineTo(x - rx, y);
      ctx.closePath();
      ctx.fill();

      // 右半晶体切面（深邃冰青/冷靛背光折射面，体现晶体立体切面感）
      ctx.fillStyle = isHovered ? '#47D7E8' : hexToRgba(col, 0.46);
      ctx.beginPath();
      ctx.moveTo(x, y - ry);
      ctx.lineTo(x + rx, y);
      ctx.lineTo(x, y + ry);
      ctx.closePath();
      ctx.fill();

      // 锐利棱形外框
      ctx.strokeStyle = isHovered ? '#FFFFFF' : '#EAF3FF';
      ctx.lineWidth = isHovered ? 1.2 : 0.8;
      ctx.beginPath();
      ctx.moveTo(x, y - ry);
      ctx.lineTo(x + rx, y);
      ctx.lineTo(x, y + ry);
      ctx.lineTo(x - rx, y);
      ctx.closePath();
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawCrystalPulse(ctx, samples, u, coreColor, glowColor, size) {
    const idx = Math.min(samples.length - 2, Math.floor(u * (samples.length - 1)));
    const frac = u * (samples.length - 1) - idx;
    const x = lerp(samples[idx].x, samples[idx + 1].x, frac);
    const y = lerp(samples[idx].y, samples[idx + 1].y, frac);
    const dx = samples[idx + 1].x - samples[idx].x;
    const dy = samples[idx + 1].y - samples[idx].y;
    const ang = Math.atan2(dy, dx);

    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(ang);
    // 流光拖尾微丝
    const grad = ctx.createLinearGradient(-size * 4.5, 0, size * 1.2, 0);
    grad.addColorStop(0, 'rgba(71, 215, 232, 0)');
    grad.addColorStop(0.7, glowColor);
    grad.addColorStop(1, coreColor);
    ctx.strokeStyle = grad;
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.moveTo(-size * 4.5, 0);
    ctx.lineTo(size * 0.8, 0);
    ctx.stroke();

    // 菱形脉冲光核
    ctx.fillStyle = coreColor;
    ctx.beginPath();
    ctx.moveTo(size * 1.4, 0);
    ctx.lineTo(0, size * 0.72);
    ctx.lineTo(-size * 1.1, 0);
    ctx.lineTo(0, -size * 0.72);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  // 方案 A 专属：双色渐变尖锋光学衍射光线（中心炽象牙白 -> 向外渐变为条目专属矿物色并平滑消隐）
  function drawOpticalSpikeA(ctx, x, y, len, angle, width, alpha, tintHex) {
    const ux = Math.cos(angle), uy = Math.sin(angle);
    const x0 = x - ux * len, y0 = y - uy * len;
    const x1 = x + ux * len, y1 = y + uy * len;
    const g = ctx.createLinearGradient(x0, y0, x1, y1);
    g.addColorStop(0.0, 'rgba(255, 253, 248, 0)');
    g.addColorStop(0.24, hexToRgba(tintHex, alpha * 0.42));
    g.addColorStop(0.41, hexToRgba(tintHex, alpha * 0.82));
    g.addColorStop(0.50, hexToRgba('#FFFDF8', alpha));
    g.addColorStop(0.59, hexToRgba(tintHex, alpha * 0.82));
    g.addColorStop(0.76, hexToRgba(tintHex, alpha * 0.42));
    g.addColorStop(1.0, 'rgba(255, 253, 248, 0)');
    ctx.strokeStyle = g;
    ctx.lineWidth = width;
    ctx.beginPath();
    ctx.moveTo(x0, y0);
    ctx.lineTo(x1, y1);
    ctx.stroke();
  }

  function drawAstrolabeNode(ctx, nItem) {
    const { entry: e, set: s, x, y, radius: r, depthNorm } = nItem;
    const isHovered = state.hoveredNodeId === e.id;
    const isSetFocused = state.hoveredSetId === s.id || state.focusedSetId === s.id;
    const alpha = clamp((0.52 + 0.48 * depthNorm) * e.focusWeight, 0.08, 1.0);
    const goldCol = '#E8C688';
    const pal = e.mineralA || { tint: s.mineralA || goldCol, halo: hexToRgba(goldCol, 0.34), soft: hexToRgba(goldCol, 0.14) };
    const starCol = pal.tint;
    const t = state.clock * 0.001;

    // 独立异步星光微颤相位（6%–10% 极克制呼吸闪烁）
    if (e._phaseA === undefined) {
      let h = 17;
      for (let i = 0; i < e.id.length; i++) h = (h * 31 + e.id.charCodeAt(i)) % 997;
      e._phaseA = (h / 997) * TAU;
      e._freqA = 1.25 + (h % 19) * 0.055;
      e._rotA = e._phaseA;
      e._hoverT = 0;
    }
    e._hoverT = lerp(e._hoverT, isHovered ? 1 : 0, 0.16);
    const hoverT = e._hoverT;
    // 悬停时游丝金环丝滑锁定旋转
    e._rotA += (1 - hoverT) * 0.0042;
    const scint = 1 + 0.08 * Math.sin(t * e._freqA + e._phaseA);
    const starClass = e.starClassA || (e.tier === 1 ? 'hub' : e.tier === 2 ? 'anchor' : 'dust');

    ctx.save();

    if (starClass === 'hub') {
      // 1. 跨集枢纽星「紫微衔珠」：光学长衍射星芒 + 双层不对称慢旋香槟金断弧游丝环 + 专属矿物宝石点 & 1.4px 朱砂定标点
      const tierScale = e.tier === 1 ? 1.0 : 0.86;
      const airyR = r * lerp(2.35, 2.85, hoverT) * scint * tierScale;
      const coreR = clamp(r * (e.tier === 1 ? 0.27 : 0.25), 1.6, 2.5);
      const ringR = r * lerp(1.30, 1.30 * 1.26, hoverT);
      nItem.outerVisRA = ringR + 3.4;
